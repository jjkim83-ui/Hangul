/*SA-THEME*/
/* ==========================================================================
   한글 놀이터 — "문방구 Sticker Arcade" theme
   Loaded after each page's own styles; restyles the shared building blocks
   (.puff tiles/buttons, .frost panels, blobs, fonts) without touching markup.
   ========================================================================== */
:root{
  --ink:#16131F; --paper:#FFFFFF; --mist:#F4F2EC; --violet:#6A47F2; --violet-d:#4C2BD6; --violet-l:#B9A8FF;
  --red:#EC4027; --lime:#4CC46A; --sun:#FFDD3C; --sky:#4FB8FF; --gum:#F05AB4;
  --b:3px solid var(--ink);
}

/* page background: dot grid instead of drifting blobs */
.sa-root{background:var(--mist) !important;color:var(--ink) !important;isolation:isolate}
/* poster decor: big flat shapes, hatching, polka dots, giant outlined type (behind everything) */
.sa-decor{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sa-decor i{position:absolute;display:block}
.sa-decor .d-type{left:-40px;bottom:-150px;font-family:'Jua',sans-serif;font-weight:800;font-size:560px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(22,19,31,.16);letter-spacing:-20px;white-space:nowrap;font-style:normal}
.sa-decor .d-blob{right:-120px;top:-150px;width:560px;height:470px;border-radius:58% 42% 55% 45%/48% 60% 40% 52%;background:repeating-linear-gradient(-45deg,var(--violet) 0 5px,transparent 5px 11px);opacity:.9;transform:rotate(-12deg)}
.sa-decor .d-dots{left:-90px;bottom:-110px;width:430px;height:330px;background:var(--lime) radial-gradient(#FFFFFF 7px,transparent 7.5px) 0 0/34px 34px;transform:rotate(14deg);clip-path:polygon(0 18%,74% 0,100% 64%,30% 100%)}
.sa-decor .d-star{left:20px;top:96px;width:250px;height:250px;background:var(--sun);clip-path:polygon(50% 0,59% 26%,85% 12%,73% 39%,100% 46%,74% 58%,90% 84%,62% 74%,52% 100%,42% 74%,14% 88%,28% 60%,0 50%,27% 40%,12% 14%,40% 25%);transform:rotate(8deg)}
.sa-decor .d-tri{right:300px;bottom:-40px;width:140px;height:180px;background:var(--ink);clip-path:polygon(0 0,100% 60%,20% 100%)}
.blob{display:none !important}

/* fonts: display text heavy, never faux-bold */
[style*="'Jua'"]{font-weight:800 !important;letter-spacing:-.2px}
h1,h2{font-weight:800 !important}

/* sticker surfaces */
.puff{background:var(--c) !important;border:var(--b) !important;box-shadow:0 4px 0 var(--ink) !important;box-sizing:border-box}
.puff::before,.puff::after{display:none !important}
.puff .puff{box-shadow:0 2px 0 var(--ink) !important;border-width:2.5px !important}
.p-white{--c:var(--paper)}
.p-lav{--c:var(--violet-l)}
.p-coral{--c:var(--red);color:#FFFFFF}
.p-mint{--c:var(--lime)}
.p-butter{--c:var(--sun)}
.p-blue{--c:var(--sky)}
.p-pink{--c:var(--gum)}
.p-holo{--c:var(--lime)}
.p-ghost,.p-ghost.puff{--c:transparent;border-color:transparent !important;box-shadow:none !important}
.flat{box-shadow:none !important}
.frost,.frost-strong{background:var(--paper) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border:var(--b) !important;box-shadow:0 6px 0 var(--ink) !important;box-sizing:border-box}
.frost .frost{box-shadow:0 3px 0 var(--ink) !important}
.ico{filter:none !important}
.sw{box-shadow:0 0 0 3px var(--ink) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:var(--b) !important;box-shadow:inset 0 3px 0 rgba(28,24,56,.08) !important;background:#FFFFFF !important}

/* white text sits on colour: give it an ink outline so it stays readable */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink) !important}
.p-coral{text-shadow:none}
.p-coral > span,.p-coral{-webkit-text-stroke:0}

/* gradient-clipped "glossy" display words become solid ink */
[style*="background-clip: text"]{-webkit-text-fill-color:currentColor}

/* motion: quick, tactile, no hover floating */
.tile{transition:transform .14s cubic-bezier(.3,1.6,.6,1),box-shadow .14s !important}
.tile:hover{transform:translateY(-4px) rotate(-.5deg) !important;box-shadow:0 8px 0 var(--ink) !important}
.tile:active{transform:translateY(4px) !important;box-shadow:0 0 0 var(--ink) !important}
.press{transition:transform .1s cubic-bezier(.3,1.6,.6,1),box-shadow .1s !important}
.press:hover{transform:translateY(-2px) !important}
.press:active{transform:translateY(3px) !important;box-shadow:0 1px 0 var(--ink) !important}
.float,.float2{animation:none !important}

/* focus ring */
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--violet) !important;outline-offset:3px}

/* ---------- hub (menu) ---------- */
.sa-onv{color:var(--ink)}
.sa-onv-sub{color:var(--ink);opacity:.65}
.sa-violet h1{color:#FFFFFF;text-shadow:3px 3px 0 var(--ink)}
.sa-violet h1 + * , .sa-violet .sa-sub-on{color:#FFFFFF}
.sa-nolja{font-family:'Jua',sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--red);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink);transform:rotate(-4deg);letter-spacing:-3px;flex-shrink:0;margin-left:-6px}
.sa-nolja-sm{font-size:118px;-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px 0 var(--ink)}
.sa-tag{height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:var(--b);border-radius:6px;background:var(--ink);color:#FFFFFF;font-weight:800;font-size:17px}
.sa-tag[style*="background"]{color:var(--ink)}
.sa-tag b{font-family:'Jua',sans-serif;font-size:19px}
.sa-me{position:relative;width:330px;height:190px;flex-shrink:0;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:18px;padding:0 22px;box-sizing:border-box}
.sa-me > div:first-child > span{background-color:var(--sky) !important}
.sa-rank{position:absolute;right:-14px;top:-20px;width:80px;height:80px;border:var(--b);border-radius:50%;background:var(--lime);place-items:center;transform:rotate(10deg);box-shadow:0 4px 0 var(--ink);font-family:'Jua',sans-serif;font-size:28px}
.sa-edit{position:absolute;right:-4px;bottom:-2px;z-index:3;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.sa-games{flex:1;min-height:0;display:grid;gap:22px;padding-bottom:8px}
.sa-card{position:relative;display:flex;flex-direction:column;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);overflow:hidden;text-decoration:none;color:var(--ink)}
.sa-art{position:relative;flex:1;min-height:0;border-bottom:var(--b);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sa-art-in{position:relative;width:240px;height:186px;flex-shrink:0}
.sa-foot{height:92px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;box-sizing:border-box}
.sa-gname{font-family:'Jua',sans-serif;font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.sa-gsub{font-weight:650;font-size:15px;opacity:.6;margin-top:6px;white-space:nowrap}
.sa-play{margin-left:auto;width:54px;height:54px;flex-shrink:0;border:var(--b);border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.sa-play svg{margin-left:3px}
.sa-pips{position:absolute;right:12px;top:12px;gap:3px;background:var(--paper);border:var(--b);border-radius:10px;padding:4px 7px}
.sa-t{position:absolute;display:grid;place-items:center;border:var(--b);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-family:'Jua',sans-serif;font-weight:800;color:var(--ink);box-sizing:border-box}
.sa-o{position:absolute;height:34px;border:var(--b);border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;box-sizing:border-box}
.sa-o i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:12px}
.sa-ow{position:absolute;font-family:'Jua',sans-serif;font-weight:800;font-size:32px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
/* class mode: 3 x 2 smaller cards */
.sa-games[style*="repeat(3"]:not(.one) .sa-foot{height:70px}
.sa-games[style*="repeat(3"]:not(.one) .sa-gname{font-size:25px}
.sa-games[style*="repeat(3"]:not(.one) .sa-gsub{font-size:13px;margin-top:4px}
.sa-games[style*="repeat(3"]:not(.one) .sa-play{width:46px;height:46px}
.sa-games[style*="repeat(3"]:not(.one) .sa-art-in{transform:scale(.55)}

/* welcome screen */
.sa-welcome{background:var(--mist) !important}
.sa-welcome h1{font-size:64px !important}

/* ---------- games ---------- */
.sa-prompt{position:relative;border:var(--b);border-radius:24px;box-shadow:0 7px 0 var(--ink);background:var(--violet) repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 12px)}
.sa-ask{font-family:'Jua',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF}
.sa-bigword{color:#FFFFFF;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);letter-spacing:1px}
.sa-key{width:58px;height:58px;flex-shrink:0;border-radius:12px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-family:'Jua',sans-serif;font-weight:800;font-size:28px;position:relative;z-index:1}
.dim{opacity:1 !important;--c:#E9E7EF !important;color:rgba(22,19,31,.42) !important;box-shadow:0 2px 0 rgba(22,19,31,.35) !important;border-color:rgba(22,19,31,.35) !important}
.dim .sa-key{background:rgba(22,19,31,.35)}
.dim *{color:inherit !important}

/* calmer decor on game pages: the menu keeps the full poster */
.sa-root:not(.sa-hub) .sa-decor .d-dots,.sa-root:not(.sa-hub) .sa-decor .d-tri{display:none}
.sa-root:not(.sa-hub) .sa-decor .d-star{left:auto;right:-60px;top:auto;bottom:-70px;width:220px;height:220px}

/* ==========================================================================
   v2 — no outlines on controls (client feedback):
   colour blocks: flat fill + a darker base in their own colour (press-down affordance)
   white surfaces: hairline + soft shadow on a slightly deeper paper background
   white strips attached to colour cards: solid ink with white text
   ink lines stay only on stickers (game art tiles), big outlined type, avatars, "selected"
   ========================================================================== */
:root{--mist:#ECE8DE; --paper-d:#D5CEBE; --hair:inset 0 0 0 1.5px rgba(22,19,31,.13); --soft:0 10px 22px -12px rgba(22,19,31,.32)}
.p-white{--d:var(--paper-d)} .p-lav{--d:#8E78E8} .p-coral{--d:#B52A16} .p-mint{--d:#2F9A4C}
.p-butter{--d:#D9B315} .p-blue{--d:#2A8DD6} .p-pink{--d:#C23A8C} .p-holo{--d:#2F9A4C}
.puff{border:0 !important;box-shadow:0 5px 0 var(--d) !important}
.puff.p-white{box-shadow:var(--hair),0 5px 0 var(--paper-d),var(--soft) !important}
.puff .puff{box-shadow:none !important;border:0 !important}
.puff .puff.p-white{box-shadow:var(--hair) !important}
.frost,.frost-strong{border:0 !important;box-shadow:var(--hair),var(--soft) !important}
.frost .frost{box-shadow:var(--hair) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:0 !important;box-shadow:inset 0 0 0 2px rgba(22,19,31,.15),inset 0 3px 0 rgba(22,19,31,.05) !important}
input:focus{box-shadow:inset 0 0 0 3px var(--violet) !important;outline:none !important}
.tile:hover{box-shadow:0 9px 0 var(--d) !important}
.tile:active{box-shadow:0 0 0 var(--d) !important}
.press:active{box-shadow:0 0 0 var(--d) !important}

.sa-games[style*="repeat(4"] .sa-art-in{transform:scale(.46) translateY(8px)}
.sa-games[style*="repeat(5"] .sa-art-in{transform:scale(.74)}
.sa-games[style*="repeat(5"] .sa-pips{right:8px;top:8px}
.dc-phone .sa-games[style*="repeat(4"]{margin-top:12px}
.dc-phone .sa-games[style*="repeat(4"] .sa-foot,.dc-phone .sa-games[style*="repeat(5"] .sa-foot{height:74px}
.dc-phone .sa-games[style*="repeat(4"] .sa-gname,.dc-phone .sa-games[style*="repeat(5"] .sa-gname{font-size:26px}
.dc-phone .sa-games[style*="repeat(4"] .sa-gsub,.dc-phone .sa-games[style*="repeat(5"] .sa-gsub{font-size:18px !important}
.dc-phone .sa-games[style*="repeat(4"] .sa-art-in{transform:scale(.44) translateY(14px)}
.dc-phone .sa-games[style*="repeat(5"] .sa-art-in{transform:scale(.8)}
/* 서보 hub: all 9 games, 5 x 2 small cards */
.sa-games[style*="repeat(5"]:not(.one){gap:14px}
.sa-games[style*="repeat(5"]:not(.one) .sa-art-in{transform:scale(.4) translateY(8px)}
.sa-games[style*="repeat(5"]:not(.one) .sa-foot{height:58px}
.sa-games[style*="repeat(5"]:not(.one) .sa-gname{font-size:21px}
.dc-phone .sa-games[style*="repeat(5"]:not(.one) .sa-art-in{transform:scale(.4) translateY(10px)}
.dc-phone .sa-games[style*="repeat(5"]:not(.one) .sa-foot{height:66px}
.dc-phone .sa-games[style*="repeat(5"]:not(.one) .sa-gname{font-size:24px}
/*/LAYOUT*/

/*PORTRAIT*/
/* ==========================================================================
   Upright phones (html.dc-portrait, set by dc-runtime.js on pages that allow it).
   The stage is 720 design px wide and as tall as the screen; rows become columns.
   ========================================================================== */
.dc-portrait .sa-root{width:100% !important;height:100% !important;padding:26px 26px 30px !important;gap:20px !important;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* header: back/title on the first line, the pills wrap below */
.dc-portrait .sa-root > header{height:auto !important;flex-wrap:wrap;row-gap:12px;column-gap:12px !important}
.dc-portrait .sa-root > header > div[style*="flex: 1"]{flex:1 1 300px !important}
.dc-portrait .sa-root > header span[style*="font-size: 14px; font-weight: 800; color: #2E4F45"]{display:none}
/* game pages: main row becomes a column; progress strip on top */
.dc-portrait .sa-root > div[style*="flex: 1; min-height: 0; display: flex; gap"]{flex-direction:column !important;gap:16px !important;flex:1 0 auto !important}
.dc-portrait .sa-root > div[style*="flex: 1; min-height: 0; display: flex; gap"] > aside{width:100% !important;order:-1;gap:12px !important}
.dc-portrait aside:has(.plist > :only-child) > .puff.p-blue,.dc-portrait aside:has(.plist > :only-child) > .plist{display:none !important}
.dc-portrait aside > .frost:last-child{padding:10px 14px !important}
/* game setup dialog */
.dc-portrait [role=dialog][aria-label^="게임 준비"]{width:calc(100% - 32px) !important;padding:20px 20px 22px !important;border-radius:36px !important}
.dc-portrait [role=dialog][aria-label^="게임 준비"] > div[style*="gap: 16px"]{flex-direction:column;align-items:stretch !important;gap:8px !important}
.dc-portrait [role=dialog][aria-label^="게임 준비"] > div[style*="gap: 16px"] > div[style*="width: 178px"]{width:auto !important;display:flex;align-items:baseline;gap:10px}
.dc-portrait [role=dialog][aria-label^="게임 준비"] > div:last-child{flex-wrap:wrap}
.dc-portrait [role=dialog][aria-label^="게임 준비"] > div:last-child > div:first-child{flex-basis:100%}
.dc-portrait [role=dialog][aria-label^="게임 준비"] > div:last-child > button{flex:1}

/* ---- hub ---- */
.dc-portrait .sa-root > header[style*="justify-content: space-between"]{flex-direction:column;align-items:flex-start !important}
.dc-portrait .sa-root > header[style*="justify-content: space-between"] > div:last-child{flex-wrap:wrap;gap:10px !important}
.dc-portrait .sa-root > header[style*="justify-content: space-between"] > div:last-child span[style*="font-size: 14px"]{display:none}
.dc-portrait .sa-root > div[style*="height: 214px"]{height:auto !important;flex-wrap:wrap;gap:16px 18px !important}
.dc-portrait .sa-root > div[style*="height: 214px"] > .sa-nolja{order:1;transform:scale(.72);transform-origin:left center;margin-right:-80px}
.dc-portrait .sa-root > div[style*="height: 214px"] > .sa-me{order:2;flex:1 1 0;width:auto !important;min-width:0}
.dc-portrait .sa-root > div[style*="height: 214px"] > div[style*="flex: 1"]{order:3;flex:1 1 100% !important}
.dc-portrait .sa-games{flex:0 0 auto !important;grid-template-columns:repeat(2,minmax(0,1fr)) !important;grid-auto-rows:300px;gap:18px !important;padding-bottom:20px}
.dc-portrait .sa-games:not(.one){grid-auto-rows:230px}
.dc-portrait .sa-games > .sa-card:last-child:nth-child(odd){grid-column:span 2}
.dc-portrait .sa-games .sa-foot{height:78px !important}
.dc-portrait .sa-games .sa-gname{font-size:28px !important}
.dc-portrait .sa-games .sa-gsub{font-size:17px !important}
.dc-portrait .sa-games .sa-play{width:52px !important;height:52px !important}
.dc-portrait .sa-games .sa-art-in{transform:scale(.82) !important}
.dc-portrait .sa-games:not(.one) .sa-art-in{transform:scale(.6) !important}
/* welcome screen: the two big buttons stack */
.dc-portrait .sa-welcome div[style*="display: flex; gap: 76px"]{flex-direction:column;gap:24px !important}
.dc-portrait .sa-welcome div[style*="display: flex; gap: 76px"] > .tile{width:560px !important;height:230px !important}

/* ---- 단어 퀴즈: answers one per row ---- */
.dc-portrait .sa-root:has(.sa-prompt) section{flex:0 0 auto !important}
.dc-portrait .sa-root:has(.sa-prompt) section > div[style*="grid-template-columns: repeat(2"]{flex:0 0 auto !important;grid-template-columns:1fr !important;grid-auto-rows:150px !important;gap:16px !important}
.dc-portrait .sa-prompt{height:250px !important}

/* ---- 산성비: tall sky, keyboard at the bottom ---- */
.dc-portrait .sa-root:has(#rain-in) > div[style*="flex: 1; min-height: 0; display: flex; flex-direction: column"]{flex:1 1 auto !important}
.dc-portrait .sa-root:has(#rain-in) > header > div[aria-label^="우산"]{order:5}
.dc-portrait .rain-entry input{width:330px !important}
.dc-portrait .rain-entry button{white-space:nowrap}
.dc-portrait .rkb-row button{height:84px !important;font-size:34px !important;flex-basis:62px !important}
.dc-portrait .rkb-row button.wide{flex-basis:96px !important}
/* columns: every block takes the full width and its natural height (the page scrolls) */
.dc-portrait .sa-root > div[style*="flex: 1; min-height: 0; display: flex; gap"] > *:not(aside){width:100% !important;flex:0 0 auto !important;min-height:0}
.dc-portrait .sa-root > div[style*="flex: 1; min-height: 0; display: flex; gap"] .frost[style*="flex: 1; min-height: 0"]{flex:0 0 auto !important}
.dc-portrait .sa-root:has(#cw-answer) .frost[style*="grid-auto-rows"]{padding:18px !important}
.dc-portrait .sa-root:has(.ws-grid) section.frost{height:700px !important}
.dc-portrait .ws-list{width:100% !important}
.dc-portrait .sa-root:has(#cs-answer) section .frost{padding:22px 20px !important}
/* hub overlays (avatar studio, settings, players): full screen, stacked, scrolling */
.dc-portrait .frost-strong.pop[style*="width: 1220px; height: 668px"],.dc-portrait .frost-strong.pop[style*="width: 1120px; height: 640px"]{width:calc(100% - 24px) !important;max-width:none !important;height:calc(100% - 24px) !important;flex-direction:column !important;gap:16px !important;padding:22px 20px !important;overflow-y:auto;border-radius:36px !important}
.dc-portrait .frost-strong.pop[style*="width: 1220px; height: 668px"] > section{width:100% !important;flex:0 0 auto !important}
.dc-portrait .frost-strong.pop[style*="width: 1220px; height: 668px"] > section:first-child > .puff[style*="width: 290px"]{width:220px !important;height:220px !important}
.dc-portrait .frost-strong.pop[style*="width: 1220px; height: 668px"] > section:first-child > .puff[style*="width: 290px"] svg{width:192px;height:192px}
.dc-portrait .frost-strong.pop[style*="width: 1120px; height: 640px"] > div[style*="flex: 1; min-height: 0; display: flex"]{flex-direction:column !important;flex:0 0 auto !important}
.dc-portrait .frost-strong.pop[style*="width: 1120px; height: 640px"] section{width:100% !important;flex:0 0 auto !important}
.dc-portrait .frost-strong.pop[style*="width: 1120px; height: 640px"] section > div[style*="grid-template-rows"]{grid-template-columns:1fr !important;grid-template-rows:none !important}
/*/PORTRAIT*/
.dc-portrait span[style*="font-size: 11px; font-weight: 900; color: #4A4C80; margin-top: 2px"]{display:none!important}
.dc-portrait .frost-strong.pop[style*="width: 900px; max-height: 600px"]{width:calc(100% - 24px)!important;max-height:calc(100% - 40px)!important;overflow-y:auto}

/*/SA-THEME*/
</style>

<body>
<template id="dc-view">
<div class="sa-root" style="position: relative; isolation: isolate; width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 80px 44px; background: #E4DCF4; color: #2B2C6B; font-family: 'Nunito', 'Jua', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px; overflow: hidden">
  <div class="sa-decor" aria-hidden="true"><i class="d-type">한글</i><i class="d-blob"></i><i class="d-dots"></i><i class="d-star"></i><i class="d-tri"></i></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden">
    <span class="blob" style="left: -120px; top: -140px; width: 620px; height: 480px; background: #B49BF6"></span>
    <span class="blob blob2" style="left: 620px; top: -160px; width: 600px; height: 440px; background: #FFA797"></span>
    <span class="blob blob3" style="left: 260px; top: 330px; width: 640px; height: 420px; background: #8AD9B6"></span>
    <span class="blob" style="left: 900px; top: 380px; width: 480px; height: 400px; background: #FFD46E; animation-delay: -11s"></span>
  </div>
  <header style="height: 60px; display: flex; align-items: center; gap: 20px">
    <a href="index.html" class="frost press" style="height: 56px; box-sizing: border-box; border-radius: 999px; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 8px; font-family: 'Jua', sans-serif; font-size: 20px">
      <span class="puff p-lav" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B2C6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative; z-index: 1"><polyline points="14 6 8 12 14 18"></polyline></svg>
      </span>
      <span class="sa-sign sm">키움한글학교</span><span class="sa-menu">메뉴</span></a>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; white-space: nowrap">뱀주사위 놀이 🐍🪜</div>
      <div style="font-size: 15px; font-weight: 800; color: #4A4C80; margin-top: 4px">Schlangen und Leitern</div>
    </div>
    <button type="button" onClick="{{openSetup}}" class="frost press" style="height: 56px; box-sizing: border-box; border: none; border-radius: 999px; padding: 0 20px 0 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #2B2C6B; font-family: inherit">
      <span class="puff p-butter" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#2B2C6B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="position: relative; z-index: 1"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5Z"></path><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5c.8 0 1.5-.7 1.5-1.5Z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05">
        <span style="font-family: 'Jua', sans-serif; font-size: 19px; white-space: nowrap">{{poolLabel}}</span>
        <span style="font-size: 12px; font-weight: 800; color: #4A4C80">단어 · Einstellen</span>
      </span>
    </button>
    <div class="puff p-mint" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #3FAE7E; box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 2px 3px rgba(30,120,80,.35)"></span>
      <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 20px">{{roundLabel}}</span>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; gap: 38px">
    <section class="frost" style="position: relative; width: 760px; flex-shrink: 0; border-radius: 40px; overflow: hidden">
      <svg class="bd-svg" width="760" height="550" viewBox="0 0 760 550" aria-hidden="true">
        <path d="{{roadD}}" fill="none" stroke="#E9E4F7" stroke-width="{{roadW}}" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{roadD}}" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"></path>
      </svg>
      <sc-for list="{{tiles}}" as="q" hint-placeholder-count="40">
        <div class="tl {{q.big}}" style="left: {{q.x}}px; top: {{q.y}}px; width: {{q.w}}px; height: {{q.h}}px; background: {{q.bg}}; color: {{q.ink}}; font-size: {{q.fs}}px">{{q.label}}<small>{{q.sub}}</small></div>
      </sc-for>
      <svg class="bd-svg" width="760" height="550" viewBox="0 0 760 550" aria-hidden="true" style="z-index: 5">
        <path d="{{ladRails}}" fill="none" stroke="#16131F" stroke-width="12" stroke-linecap="round"></path>
        <path d="{{ladRails}}" fill="none" stroke="#FFDD3C" stroke-width="6" stroke-linecap="round"></path>
        <path d="{{ladRungs}}" fill="none" stroke="#16131F" stroke-width="5" stroke-linecap="round"></path>
        <path d="{{snake0}}" fill="#4CC46A" stroke="#16131F" stroke-width="3" stroke-linejoin="round"></path>
        <path d="{{snake1}}" fill="#F05AB4" stroke="#16131F" stroke-width="3" stroke-linejoin="round"></path>
        <path d="{{snake2}}" fill="#4FB8FF" stroke="#16131F" stroke-width="3" stroke-linejoin="round"></path>
        <path d="{{snake3}}" fill="#FF2B2B" stroke="#16131F" stroke-width="3" stroke-linejoin="round"></path>
        <path d="{{snake4}}" fill="#9C84FF" stroke="#16131F" stroke-width="3" stroke-linejoin="round"></path>
        <path d="{{snake5}}" fill="#FFDD3C" stroke="#16131F" stroke-width="3" stroke-linejoin="round"></path>
        <path d="{{snakeDots}}" fill="none" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="4.5" stroke-dasharray="0.1 12" stroke-linecap="round"></path>
        <path d="{{snakeTongue}}" fill="none" stroke="#FF2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{snakeEyes}}" fill="#FFFFFF"></path>
        <path d="{{snakePupils}}" fill="#16131F"></path>
      </svg>
      <sc-for list="{{tileNums}}" as="q" hint-placeholder-count="40">
        <span class="tn" style="left: {{q.x}}px; top: {{q.y}}px; color: {{q.ink}}; -webkit-text-stroke: 6px {{q.bg}}; font-size: {{q.fs}}px">{{q.label}}</span>
      </sc-for>
      <sc-for list="{{pieces}}" as="p" hint-placeholder-count="3">
        <span class="piece {{p.hop}} {{p.fly}} {{p.on}}" style="left: {{p.x}}px; top: {{p.y}}px; z-index: {{p.z}}">
          <span style="position: relative; z-index: 1; width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: block; background: {{p.inner}}; box-shadow: 0 0 0 2.5px #FFFFFF">
              <svg viewBox="0 4 120 116" width="46" height="46" aria-hidden="true" style="display: block">
                <path d="{{p.hairBack}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M53 68L53 92L67 92L67 68Z" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{p.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.shirtLines}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="{{p.ears}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
                <path d="{{p.head}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.blush}}" fill="#F49AA8" opacity="0.6"></path>
                <path d="{{p.brows}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.eyesFill}}" fill="#1E1E24"></path>
                <path d="{{p.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.eyesWhite}}" fill="#FFFFFF"></path>
                <path d="{{p.noseStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="{{p.noseFill}}" fill="#1E1E24"></path>
                <path d="{{p.mouthFill}}" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.6" stroke-linejoin="round"></path>
                <path d="{{p.mouthWhite}}" fill="#FFFFFF"></path>
                <path d="{{p.tongue}}" fill="#F27A8A"></path>
                <path d="{{p.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.hairFront}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
                <path d="{{p.accStroke}}" fill="none" stroke="#1E1E24" stroke-width="4" stroke-linecap="round"></path>
                <path d="{{p.accFill}}" fill="{{p.accCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.accFill2}}" fill="{{p.acc2Col}}" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round"></path>
              </svg>
            </span>
        </span>
      </sc-for>

      <sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; z-index: 20; background: rgba(43,44,107,.28); display: flex; align-items: center; justify-content: center">
          <div class="frost frost-strong pop" style="width: 680px; box-sizing: border-box; border-radius: 40px; padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 14px">
            <div style="text-align: center; font-size: 15px; font-weight: 800; color: #4A4C80">{{askLabel}} — 🎲 {{rolled}}칸 앞으로 · {{rolled}} Felder vor</div>
            <div style="text-align: center; font-family: 'Jua', sans-serif; font-size: {{wordFs}}px; line-height: 1.1">{{word}}</div>
            <div style="text-align: center; font-size: 16px; font-weight: 800; color: #3A3B78; min-height: 4px">{{wordSub}}</div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
              <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
                <button type="button" onClick="{{o.pick}}" class="puff press {{o.cls}}" style="height: 80px; border: none; border-radius: 28px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #2B2C6B; font-family: inherit; text-align: left">
                  <span class="puff p-white" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 22px"><span style="position: relative; z-index: 1">{{o.mark}}</span></span>
                  <span style="position: relative; z-index: 1; flex: 1; min-width: 0; font-family: 'Jua', sans-serif; font-size: {{o.fs}}px; line-height: 1.05; overflow-wrap: anywhere">{{o.main}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>
    </section>

    <aside class="{{asideCls}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div class="puff p-blue" style="border-radius: 36px; padding: 14px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="position: relative; z-index: 1; width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: block; background: {{cur.inner}}; box-shadow: 0 0 0 2.5px #FFFFFF">
              <svg viewBox="0 4 120 116" width="64" height="64" aria-hidden="true" style="display: block">
                <path d="{{cur.hairBack}}" fill="{{cur.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M53 68L53 92L67 92L67 68Z" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{cur.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{cur.shirtLines}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.GAME = 'race';
    this.ROSTER = this.loadPlayers();
    this.state = { pool: null, setup: true, started: false, len: 60, dir: 'mix', ...this.fresh(60, true) };
  }
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  sampleWords() {
    return [
      { ko: '사과', de: 'Apfel', en: 'apple', hint: '빨갛고 둥근 과일', lesson: 0 },
      { ko: '학교', de: 'Schule', en: 'school', hint: '학생들이 공부하러 가는 곳', lesson: 0 },
      { ko: '친구', de: 'Freund', en: 'friend', hint: '가깝게 지내는 사이', lesson: 0 },
      { ko: '바다', de: 'Meer', en: 'sea', hint: '짠물이 넓게 펼쳐진 곳', lesson: 0 },
      { ko: '고양이', de: 'Katze', en: 'cat', hint: '야옹 하고 우는 동물', lesson: 0 },
      { ko: '하늘', de: 'Himmel', en: 'sky', hint: '구름과 해가 떠 있는 위쪽', lesson: 0 },
      { ko: '기차', de: 'Zug', en: 'train', hint: '철길 위를 달리는 긴 탈것', lesson: 0 },
      { ko: '이야기', de: 'Geschichte', en: 'story', hint: '어떤 일을 말이나 글로 들려주는 것', lesson: 0 },
      { ko: '고구마', de: 'Süsskartoffel', en: 'sweet potato', hint: '땅속에서 자라는 달콤한 덩이뿌리', lesson: 0 },
      { ko: '다리', de: 'Brücke', en: 'bridge', hint: '강을 건너가게 만든 길', lesson: 0 },
      { ko: '판다', de: 'Panda', en: 'panda', hint: '대나무를 먹는 흑백 곰', lesson: 0 },
      { ko: '차표', de: 'Fahrkarte', en: 'ticket', hint: '버스나 KTX를 탈 때 필요한 종이', lesson: 0 }
    ];
  }
  readSel() {
    let sel = null;
    try { sel = JSON.parse(localStorage.getItem('hangul_today_v1') || 'null'); } catch (e) {}
    if (!sel || !sel.today || typeof sel.today !== 'object') sel = { today: { 1: true, 2: true }, off: {} };
    if (!sel.off) sel.off = {};
    return sel;
  }
  loadPool() {
    const sel = this.readSel();
    const UNIT_CLS = { u1: 'p-lav', u2: 'p-pink', u3: 'p-mint', u4: 'p-butter', u5: 'p-blue', u6: 'p-coral' };
    return fetch('content/textbook-4-1-vocab.json').then(r => r.json()).then(d => {
      const lw = (L) => {
        const own = L.words.map((w, i) => ({ w, key: L.n + ':' + i, from: L.n }));
        if (!L.review) return own;
        const more = [];
        L.review.forEach(n => { const src = d.lessons.find(x => x.n === n); if (src) src.words.forEach((w, i) => more.push({ w, key: n + ':' + i, from: n })); });
        return more.concat(own);
      };
      const chosen = d.lessons.filter(L => sel.today[L.n]);
      const seen = {}, words = [];
      chosen.forEach(L => lw(L).forEach(x => {
        if (sel.off[x.key]) return;
        const meta = (x.w[4] && typeof x.w[4] === 'object') ? x.w[4] : {};   // game form, games list, accepted alternatives
        if (meta.games && meta.games.indexOf('race') < 0) return;
        const ko = meta.g || x.w[0];
        if (seen[ko]) return;
        seen[ko] = true;
        words.push({ ko, de: x.w[1], en: x.w[2], hint: x.w[3] || '', lesson: x.from, tb: meta.g && meta.g !== x.w[0] ? x.w[0] : '', alt: meta.alt || [] });
      }));
      return {
        words, sample: false,
        label: chosen.length ? (chosen.length > 3 ? chosen.slice(0, 2).map(L => L.n + '과').join(' · ') + ' 외 ' + (chosen.length - 2) + '개' : chosen.map(L => L.n + '과').join(' · ')) : '—',
        chips: chosen.map(L => ({ label: L.n + '과 ' + L.theme[0], cls: L.unit ? UNIT_CLS[L.unit] : 'p-white' })),
        note: chosen.length ? '' : '오늘의 단어장이 비어 있어요 · Keine Lektion gewählt'
      };
    });
  }
  samplePool(note) {
    return { words: this.sampleWords(), sample: true, label: '예시', chips: [{ label: '예시 단어 · Beispiel', cls: 'p-white' }], note };
  }
  usableWords(min) {
    const p = this.state.pool;
    if (p && p.words.length >= min) return p.words;
    return this.sampleWords();
  }
  componentDidMount() {
    // class-only game: a student at home goes back to the menu
    try { const CPm = window.ClassPlay; if (CPm && CPm.studentMode && CPm.studentMode() && !(CPm.isSuhbo && CPm.isSuhbo())) { window.location.href = 'index.html'; return; } } catch (e) {}
    this.refreshPool();
    this.onStore = (e) => { if (!e || !e.key || e.key === 'hangul_today_v1') this.refreshPool(); };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
    
  }
  componentWillUnmount() {
    clearTimeout(this.timer); clearInterval(this._faceT);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  refreshPool() {
    this.loadPool()
      .then(pool => { this.setState({ pool }); if (this.onPool) this.onPool(pool); })
      .catch(() => { const pool = this.samplePool('단어장을 못 불러와서 예시 단어를 써요 · Beispielwörter'); this.setState({ pool }); if (this.onPool) this.onPool(pool); });
  }
  poolVals(min) {
    const p = this.state.pool;
    if (!p) return { poolCount: '…', poolChips: [], poolNote: '단어장을 불러오는 중… · Lädt … · Loading…', poolLabel: '…', poolReady: false };
    const short = !p.sample && p.words.length < min;
    return {
      poolCount: p.words.length + '개',
      poolChips: p.chips,
      poolNote: short ? ('단어가 ' + min + '개보다 적어서 예시 단어로 해요 · Zu wenige Wörter, Beispielwörter') : p.note,
      poolLabel: short ? '예시' : p.label,
      poolReady: true
    };
  }
  seg(list, cur, key) {
    return list.map(o => ({ label: o.label, sub: o.sub, pressed: o.v === cur ? 'true' : 'false', cls: o.v === cur ? 'p-lav' : 'p-white', pick: () => this.setState({ [key]: o.v }) }));
  }
  onPool(pool) { if (!this.state.started) this.setState({}); }
  // ---------- board: a winding track with ladders and snakes ----------
  layout(len) {
    if (this._lay && this._lay.len === len) return this._lay;
    const W = 760, H = 550, padX = 40, padY = 50;
    const rows = len <= 20 ? 3 : len <= 30 ? 4 : len <= 40 ? 5 : len <= 60 ? 6 : 7;
    const rowGap = (H - 2 * padY) / (rows - 1), r = rowGap / 2, x0 = padX + r, x1 = W - padX - r;
    // centre line: rows from the bottom up, joined by half-circle turns; rows wave gently
    const wave = (x, row) => Math.sin((x - x0) / 70 + row * 1.3) * 9;
    const segs = [];
    for (let row = 0; row < rows; row++) {
      const y = H - padY - row * rowGap, ltr = row % 2 === 0;
      segs.push({ t: 'line', row, y, ltr, L: x1 - x0 });
      if (row < rows - 1) segs.push({ t: 'turn', row, y, ltr, L: Math.PI * r });
    }
    const total = segs.reduce((s, g) => s + g.L, 0);
    const at = (d) => {
      for (const g of segs) {
