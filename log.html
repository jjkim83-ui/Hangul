/*SA-THEME*/
/* ==========================================================================
   한글 놀이터 — "문방구 Sticker Arcade" theme
   Loaded after each page's own styles; restyles the shared building blocks
   (.puff tiles/buttons, .frost panels, blobs, fonts) without touching markup.
   ========================================================================== */
:root{
  --ink:#16131F; --paper:#FFFFFF; --mist:#F4F2EC; --violet:#6A47F2; --violet-d:#4C2BD6; --violet-l:#B9A8FF;
  --red:#EC4027; --lime:#4CC46A; --sun:#FFDD3C; --sky:#4FB8FF; --gum:#F05AB4;
  --b:3px solid var(--ink);
}

/* page background: dot grid instead of drifting blobs */
.sa-root{background:var(--mist) !important;color:var(--ink) !important;isolation:isolate}
/* poster decor: big flat shapes, hatching, polka dots, giant outlined type (behind everything) */
.sa-decor{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sa-decor i{position:absolute;display:block}
.sa-decor .d-type{left:-40px;bottom:-150px;font-family:'Jua',sans-serif;font-weight:800;font-size:560px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(22,19,31,.16);letter-spacing:-20px;white-space:nowrap;font-style:normal}
.sa-decor .d-blob{right:-120px;top:-150px;width:560px;height:470px;border-radius:58% 42% 55% 45%/48% 60% 40% 52%;background:repeating-linear-gradient(-45deg,var(--violet) 0 5px,transparent 5px 11px);opacity:.9;transform:rotate(-12deg)}
.sa-decor .d-dots{left:-90px;bottom:-110px;width:430px;height:330px;background:var(--lime) radial-gradient(#FFFFFF 7px,transparent 7.5px) 0 0/34px 34px;transform:rotate(14deg);clip-path:polygon(0 18%,74% 0,100% 64%,30% 100%)}
.sa-decor .d-star{left:20px;top:96px;width:250px;height:250px;background:var(--sun);clip-path:polygon(50% 0,59% 26%,85% 12%,73% 39%,100% 46%,74% 58%,90% 84%,62% 74%,52% 100%,42% 74%,14% 88%,28% 60%,0 50%,27% 40%,12% 14%,40% 25%);transform:rotate(8deg)}
.sa-decor .d-tri{right:300px;bottom:-40px;width:140px;height:180px;background:var(--ink);clip-path:polygon(0 0,100% 60%,20% 100%)}
.blob{display:none !important}

/* fonts: display text heavy, never faux-bold */
[style*="'Jua'"]{font-weight:800 !important;letter-spacing:-.2px}
h1,h2{font-weight:800 !important}

/* sticker surfaces */
.puff{background:var(--c) !important;border:var(--b) !important;box-shadow:0 4px 0 var(--ink) !important;box-sizing:border-box}
.puff::before,.puff::after{display:none !important}
.puff .puff{box-shadow:0 2px 0 var(--ink) !important;border-width:2.5px !important}
.p-white{--c:var(--paper)}
.p-lav{--c:var(--violet-l)}
.p-coral{--c:var(--red);color:#FFFFFF}
.p-mint{--c:var(--lime)}
.p-butter{--c:var(--sun)}
.p-blue{--c:var(--sky)}
.p-pink{--c:var(--gum)}
.p-holo{--c:var(--lime)}
.p-ghost,.p-ghost.puff{--c:transparent;border-color:transparent !important;box-shadow:none !important}
.flat{box-shadow:none !important}
.frost,.frost-strong{background:var(--paper) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border:var(--b) !important;box-shadow:0 6px 0 var(--ink) !important;box-sizing:border-box}
.frost .frost{box-shadow:0 3px 0 var(--ink) !important}
.ico{filter:none !important}
.sw{box-shadow:0 0 0 3px var(--ink) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:var(--b) !important;box-shadow:inset 0 3px 0 rgba(28,24,56,.08) !important;background:#FFFFFF !important}

/* white text sits on colour: give it an ink outline so it stays readable */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink) !important}
.p-coral{text-shadow:none}
.p-coral > span,.p-coral{-webkit-text-stroke:0}

/* gradient-clipped "glossy" display words become solid ink */
[style*="background-clip: text"]{-webkit-text-fill-color:currentColor}

/* motion: quick, tactile, no hover floating */
.tile{transition:transform .14s cubic-bezier(.3,1.6,.6,1),box-shadow .14s !important}
.tile:hover{transform:translateY(-4px) rotate(-.5deg) !important;box-shadow:0 8px 0 var(--ink) !important}
.tile:active{transform:translateY(4px) !important;box-shadow:0 0 0 var(--ink) !important}
.press{transition:transform .1s cubic-bezier(.3,1.6,.6,1),box-shadow .1s !important}
.press:hover{transform:translateY(-2px) !important}
.press:active{transform:translateY(3px) !important;box-shadow:0 1px 0 var(--ink) !important}
.float,.float2{animation:none !important}

/* focus ring */
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--violet) !important;outline-offset:3px}

/* ---------- hub (menu) ---------- */
.sa-onv{color:var(--ink)}
.sa-onv-sub{color:var(--ink);opacity:.65}
.sa-violet h1{color:#FFFFFF;text-shadow:3px 3px 0 var(--ink)}
.sa-violet h1 + * , .sa-violet .sa-sub-on{color:#FFFFFF}
.sa-nolja{font-family:'Jua',sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--red);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink);transform:rotate(-4deg);letter-spacing:-3px;flex-shrink:0;margin-left:-6px}
.sa-nolja-sm{font-size:118px;-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px 0 var(--ink)}
.sa-tag{height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:var(--b);border-radius:6px;background:var(--ink);color:#FFFFFF;font-weight:800;font-size:17px}
.sa-tag[style*="background"]{color:var(--ink)}
.sa-tag b{font-family:'Jua',sans-serif;font-size:19px}
.sa-me{position:relative;width:330px;height:190px;flex-shrink:0;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:18px;padding:0 22px;box-sizing:border-box}
.sa-me > div:first-child > span{background-color:var(--sky) !important}
.sa-rank{position:absolute;right:-14px;top:-20px;width:80px;height:80px;border:var(--b);border-radius:50%;background:var(--lime);place-items:center;transform:rotate(10deg);box-shadow:0 4px 0 var(--ink);font-family:'Jua',sans-serif;font-size:28px}
.sa-edit{position:absolute;right:-4px;bottom:-2px;z-index:3;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.sa-games{flex:1;min-height:0;display:grid;gap:22px;padding-bottom:8px}
.sa-card{position:relative;display:flex;flex-direction:column;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);overflow:hidden;text-decoration:none;color:var(--ink)}
.sa-art{position:relative;flex:1;min-height:0;border-bottom:var(--b);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sa-art-in{position:relative;width:240px;height:186px;flex-shrink:0}
.sa-foot{height:92px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;box-sizing:border-box}
.sa-gname{font-family:'Jua',sans-serif;font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.sa-gsub{font-weight:650;font-size:15px;opacity:.6;margin-top:6px;white-space:nowrap}
.sa-play{margin-left:auto;width:54px;height:54px;flex-shrink:0;border:var(--b);border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.sa-play svg{margin-left:3px}
.sa-pips{position:absolute;right:12px;top:12px;gap:3px;background:var(--paper);border:var(--b);border-radius:10px;padding:4px 7px}
.sa-t{position:absolute;display:grid;place-items:center;border:var(--b);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-family:'Jua',sans-serif;font-weight:800;color:var(--ink);box-sizing:border-box}
.sa-o{position:absolute;height:34px;border:var(--b);border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;box-sizing:border-box}
.sa-o i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:12px}
.sa-ow{position:absolute;font-family:'Jua',sans-serif;font-weight:800;font-size:32px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
/* class mode: 3 x 2 smaller cards */
.sa-games[style*="repeat(3"]:not(.one) .sa-foot{height:70px}
.sa-games[style*="repeat(3"]:not(.one) .sa-gname{font-size:25px}
.sa-games[style*="repeat(3"]:not(.one) .sa-gsub{font-size:13px;margin-top:4px}
.sa-games[style*="repeat(3"]:not(.one) .sa-play{width:46px;height:46px}
.sa-games[style*="repeat(3"]:not(.one) .sa-art-in{transform:scale(.55)}

/* welcome screen */
.sa-welcome{background:var(--mist) !important}
.sa-welcome h1{font-size:64px !important}

/* ---------- games ---------- */
.sa-prompt{position:relative;border:var(--b);border-radius:24px;box-shadow:0 7px 0 var(--ink);background:var(--violet) repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 12px)}
.sa-ask{font-family:'Jua',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF}
.sa-bigword{color:#FFFFFF;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);letter-spacing:1px}
.sa-key{width:58px;height:58px;flex-shrink:0;border-radius:12px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-family:'Jua',sans-serif;font-weight:800;font-size:28px;position:relative;z-index:1}
.dim{opacity:1 !important;--c:#E9E7EF !important;color:rgba(22,19,31,.42) !important;box-shadow:0 2px 0 rgba(22,19,31,.35) !important;border-color:rgba(22,19,31,.35) !important}
.dim .sa-key{background:rgba(22,19,31,.35)}
.dim *{color:inherit !important}

/* calmer decor on game pages: the menu keeps the full poster */
.sa-root:not(.sa-hub) .sa-decor .d-dots,.sa-root:not(.sa-hub) .sa-decor .d-tri{display:none}
.sa-root:not(.sa-hub) .sa-decor .d-star{left:auto;right:-60px;top:auto;bottom:-70px;width:220px;height:220px}

/* ==========================================================================
   v2 — no outlines on controls (client feedback):
   colour blocks: flat fill + a darker base in their own colour (press-down affordance)
   white surfaces: hairline + soft shadow on a slightly deeper paper background
   white strips attached to colour cards: solid ink with white text
   ink lines stay only on stickers (game art tiles), big outlined type, avatars, "selected"
   ========================================================================== */
:root{--mist:#ECE8DE; --paper-d:#D5CEBE; --hair:inset 0 0 0 1.5px rgba(22,19,31,.13); --soft:0 10px 22px -12px rgba(22,19,31,.32)}
.p-white{--d:var(--paper-d)} .p-lav{--d:#8E78E8} .p-coral{--d:#B52A16} .p-mint{--d:#2F9A4C}
.p-butter{--d:#D9B315} .p-blue{--d:#2A8DD6} .p-pink{--d:#C23A8C} .p-holo{--d:#2F9A4C}
.puff{border:0 !important;box-shadow:0 5px 0 var(--d) !important}
.puff.p-white{box-shadow:var(--hair),0 5px 0 var(--paper-d),var(--soft) !important}
.puff .puff{box-shadow:none !important;border:0 !important}
.puff .puff.p-white{box-shadow:var(--hair) !important}
.frost,.frost-strong{border:0 !important;box-shadow:var(--hair),var(--soft) !important}
.frost .frost{box-shadow:var(--hair) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:0 !important;box-shadow:inset 0 0 0 2px rgba(22,19,31,.15),inset 0 3px 0 rgba(22,19,31,.05) !important}
input:focus{box-shadow:inset 0 0 0 3px var(--violet) !important;outline:none !important}
.tile:hover{box-shadow:0 9px 0 var(--d) !important}
.tile:active{box-shadow:0 0 0 var(--d) !important}
.press:active{box-shadow:0 0 0 var(--d) !important}
.puff.p-white.press:active,.puff.p-white.tile:active{box-shadow:var(--hair) !important}
/* selected / on states keep a ring so "chosen" is unmistakable */
[aria-pressed="true"].puff{box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 var(--d) !important}
.puff.dim,.puff.p-white.dim,.dim{box-shadow:none !important;border:0 !important;--c:#E2DED4 !important}
.sw{box-shadow:var(--hair) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}

/*MOTION*/
/* punchier red (title, play buttons, red cards) */

/* background: wobbly blobs + parallax (theme decor layers) */
:root{--px:0;--py:0}
.sa-decor .d-blob{animation:sa-wob 9s ease-in-out infinite;translate:calc(var(--px) * -26px) calc(var(--py) * -18px)}
.sa-decor .d-dots{animation:sa-bob 7s ease-in-out infinite;translate:calc(var(--px) * 18px) calc(var(--py) * 14px)}
.sa-decor .d-star{animation:sa-spin 14s ease-in-out infinite;translate:calc(var(--px) * -12px) calc(var(--py) * -10px)}

.sa-decor .d-type{animation:sa-drift 18s ease-in-out infinite;translate:calc(var(--px) * 8px) calc(var(--py) * 6px)}
@keyframes sa-wob{
  0%,100%{border-radius:58% 42% 55% 45%/48% 60% 40% 52%;scale:1;rotate:0deg}
  33%{border-radius:44% 56% 40% 60%/58% 42% 58% 42%;scale:1.05;rotate:4deg}

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 'week', tab: 'games', tick: 0 };
  }
  componentDidMount() {
    const C = window.ClassPlay;
    if (C && C.onChange) C.onChange(() => this.setState({ tick: this.state.tick + 1 }));
    if (C && C.refresh) C.refresh();
  }
  /* split a child's rounds of one game into tries: a start followed by a finish = finished, otherwise given up */
  tries(plays) {
    const by = {};
    plays.slice().sort((a, b) => a.at < b.at ? -1 : 1).forEach(p => { const k = p.sid + '|' + p.game; (by[k] = by[k] || []).push(p); });
    const out = [];
    Object.keys(by).forEach(k => {
      let open = null;
      by[k].forEach(p => {
        if (p.note === 'start') { if (open) out.push({ ...open, kind: 'quit' }); open = p; }
        else { out.push({ ...p, kind: 'done', startAt: open ? open.at : null, tracked: !!open }); open = null; }
      });
      if (open) out.push({ ...open, kind: (Date.now() - new Date(open.at).getTime()) < 20 * 60000 ? 'run' : 'quit' });
    });
    return out.sort((a, b) => a.at < b.at ? 1 : -1);
  }
  renderVals() {
    const C = window.ClassPlay;
    const teacher = !!(C && C.isTeacher && C.isTeacher());
    const s = this.state;
    const base = { locked: !teacher, open: teacher, periods: [], tabs: [], games: [], kids: [], kidCols: [], events: [] };
    const periods = [{ v: 'week', label: '이번 주' }, { v: 'last', label: '지난 주' }, { v: 'month', label: '4주' }].map(p => ({
      label: p.label, pressed: p.v === s.period ? 'true' : 'false', cls: p.v === s.period ? 'p-lav' : 'p-white', pick: () => this.setState({ period: p.v }) }));
    if (!teacher) return { ...base, periods };
    const NAMES = C.GAME_NAMES || {};
    const COLORS = { quiz: '#FFDD3C', crossword: '#4CC46A', chosung: '#4FB8FF', rain: '#16131F', search: '#6A47F2', memory: '#9C84FF', syllables: '#F05AB4', sentence: '#FF9F43', race: '#FF2B2B' };
    const ORDER = ['quiz', 'crossword', 'chosung', 'rain', 'search', 'memory', 'syllables', 'sentence'];
    const wk = C.weekKey(), prev = C.prevWeekKey(wk);
    const since = new Date(); since.setDate(since.getDate() - 27);
    const inPeriod = (p) => s.period === 'week' ? p.week === wk : s.period === 'last' ? p.week === prev : p.day >= C.dayKey(since);
    const known = {}; C.students().forEach(st => { known[st.id] = true; });   // 서보 and removed children stay out of the class log
    const all = C.allPlays().filter(p => p.game !== 'teacher' && known[p.sid] && inPeriod(p));
    const tries = this.tries(all);
    const done = tries.filter(t => t.kind === 'done');
    const firstStart = C.allPlays().filter(p => p.note === 'start').map(p => p.at).sort()[0];
    const students = C.students();
    const pct = (x) => Math.round(x * 100) + '%';
    const games = ORDER.filter(g => tries.some(t => t.game === g) || ['quiz', 'crossword', 'chosung', 'rain', 'search'].indexOf(g) >= 0);
    const maxRounds = Math.max(1, ...games.map(g => done.filter(t => t.game === g).length));
    const gameRows = games.map(g => {
      const d = done.filter(t => t.game === g);
      const tracked = tries.filter(t => t.game === g && (t.kind === 'quit' || (t.kind === 'done' && t.tracked)));
      const fin = tracked.filter(t => t.kind === 'done').length;
      const acc = d.length ? d.reduce((a, t) => a + (t.acc || 0), 0) / d.length : null;
      const kids = {}; d.forEach(t => { kids[t.sid] = true; });
      const mins = d.length ? d.reduce((a, t) => a + (t.dur || 0), 0) / d.length / 60 : 0;
      return { name: NAMES[g] || g, color: COLORS[g] || '#BBB', ink: ['rain', 'search'].indexOf(g) >= 0 && d.length ? '#FFFFFF' : '#16131F', rounds: d.length, popW: Math.round(d.length / maxRounds * 100),
        done: tracked.length ? pct(fin / tracked.length) : '—', doneSub: tracked.length ? fin + '/' + tracked.length : '',
        acc: acc === null ? '—' : pct(acc), accW: acc === null ? 0 : Math.round(acc * 100), accCol: acc === null ? 'transparent' : acc >= 0.8 ? '#9FE3B1' : acc >= 0.6 ? '#FFE48A' : '#FFB3A8',
        kids: Object.keys(kids).length + '/' + students.length, mins: d.length ? (mins < 1 ? '<1' : String(Math.round(mins))) : '—', _n: d.length };
    }).sort((a, b) => b._n - a._n);
    const kidGames = ['quiz', 'crossword', 'chosung', 'rain', 'search'];
    const fmtDay = (iso) => { if (!iso) return '—'; const d = new Date(iso), t = new Date(); const days = Math.floor((new Date(t.toDateString()) - new Date(d.toDateString())) / 86400000);
      return days === 0 ? '오늘' : days === 1 ? '어제' : days + '일 전'; };
    const kids = students.map(st => {
      const mine = done.filter(t => t.sid === st.id);
      const cells = kidGames.map(g => { const d = mine.filter(t => t.game === g); const acc = d.length ? d.reduce((a, t) => a + (t.acc || 0), 0) / d.length : null;
        return { n: String(d.length), sub: acc === null ? '' : pct(acc), cls: d.length ? '' : 'zero', bg: !d.length ? 'transparent' : acc >= 0.8 ? '#DFF6E6' : acc >= 0.6 ? '#FFF6CC' : '#FFE6E1' }; });
      const lastAny = tries.filter(t => t.sid === st.id)[0];
      return { name: st.name, cells, total: String(mine.length), last: lastAny ? fmtDay(lastAny.at) : '—', _n: mine.length };
    }).sort((a, b) => b._n - a._n);
    const nameOf = (sid) => { const st = students.find(x => x.id === sid); return st ? st.name : '?'; };
    const events = tries.slice(0, 60).map(t => {
      const d = new Date(t.at);
      const when = (fmtDay(t.at) === '오늘' ? '오늘' : (d.getMonth() + 1) + '/' + d.getDate()) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      const g = NAMES[t.game] || t.game;
      if (t.kind === 'done') return { when, who: nameOf(t.sid), what: g + ' · 정답 ' + pct(t.acc || 0) + ' · ' + Math.max(1, Math.round((t.dur || 0) / 60)) + '분' + (t.counted ? ' · ★' : ''), badge: '끝냄', cls: 'ok' };
      if (t.kind === 'run') return { when, who: nameOf(t.sid), what: g, badge: '하는 중', cls: 'run' };
      return { when, who: nameOf(t.sid), what: g, badge: '그만둠', cls: 'quit' };
    });
    const sinceTxt = firstStart ? (new Date(firstStart).getMonth() + 1) + '/' + new Date(firstStart).getDate() : '';
    const tabs = [{ v: 'games', label: '게임별 · Spiele' }, { v: 'kids', label: '아이별 · Kinder' }].map(t => ({
      label: t.label, pressed: t.v === s.tab ? 'true' : 'false', cls: t.v === s.tab ? 'p-lav' : 'p-white', pick: () => this.setState({ tab: t.v }) }));
    const kidsPlayed = {}; done.forEach(t => { kidsPlayed[t.sid] = true; });
    return {
      ...base, periods, tabs, showGames: s.tab === 'games', showKids: s.tab === 'kids',
      summary: done.length + '판 끝냄 · ' + Object.keys(kidsPlayed).length + '/' + students.length + '명 · ' + done.length + ' Runden',
      games: gameRows, gameCount: kidGames.length, kidCols: kidGames.map(g => ({ name: NAMES[g] || g })), kids,
      gamesNote: '"끝까지" = 시작한 판 중 끝까지 한 비율' + (sinceTxt ? ' (' + sinceTxt + '부터 기록)' : ' (다음 판부터 기록돼요)') + ' · 정답률 = 끝낸 판의 평균 · fertig = beendete von begonnenen Runden',
      events, eventsNote: events.length ? '' : '이 기간에는 기록이 없어요 · Keine Runden in diesem Zeitraum'
    };
  }
}
DC.mount(Component);
</script>
