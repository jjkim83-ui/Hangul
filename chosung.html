<style>
body{margin:0}
a{color:#2B2C6B}a:hover{color:#2B2C6B}
button:focus-visible,a:focus-visible{outline:4px solid #2B2C6B;outline-offset:5px}
.puff{position:relative;background:linear-gradient(180deg,var(--c) 0%,var(--c) 58%,var(--d) 160%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.38),inset 0 -12px 16px -10px rgba(255,255,255,.6),inset 0 -2px 0 var(--dd),0 0 0 1.5px rgba(255,255,255,.55),0 4px 0 var(--d),0 14px 24px var(--sh),0 2px 4px rgba(43,44,107,.08)}
.puff::before{content:"";position:absolute;left:5px;right:5px;top:4px;height:47%;border-radius:inherit;background:radial-gradient(circle at 86% 32%,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 2.5px,rgba(255,255,255,0) 4.5px),linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.2) 65%,rgba(255,255,255,.04) 100%);pointer-events:none}
.puff::after{content:"";position:absolute;inset:2px;border-radius:inherit;border:3px solid transparent;border-top-color:rgba(255,255,255,.9);border-left-color:rgba(255,255,255,.35);filter:blur(1px);pointer-events:none}
.p-white{--c:#FBFAFF;--d:#E7E3F6;--dd:rgba(120,110,180,.18);--sh:rgba(120,110,180,.24)}
.p-lav{--c:#BBA8F6;--d:#9E88E9;--dd:rgba(100,70,200,.30);--sh:rgba(140,110,230,.38)}
.p-coral{--c:#EE7466;--d:#D85B4E;--dd:rgba(160,40,30,.30);--sh:rgba(238,116,102,.42)}
.p-mint{--c:#A6E5C9;--d:#84D2B0;--dd:rgba(30,140,100,.25);--sh:rgba(110,200,160,.38)}
.p-butter{--c:#FBE18C;--d:#F1CD62;--dd:rgba(170,120,0,.22);--sh:rgba(230,190,70,.40)}
.p-blue{--c:#A9CBF7;--d:#86B1EC;--dd:rgba(40,90,180,.25);--sh:rgba(110,160,230,.38)}
.p-pink{--c:#F7B6CF;--d:#EC95B6;--dd:rgba(180,50,100,.22);--sh:rgba(240,150,190,.38)}
.frost{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.32) 100%);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -12px 18px -12px rgba(255,255,255,.7),0 12px 30px rgba(70,50,150,.16),0 2px 4px rgba(43,44,107,.06)}
.frost-strong{background:linear-gradient(180deg,#FBF9FF 0%,#F1EDFB 100%)}
.blob{position:absolute;border-radius:50%;opacity:.88;-webkit-mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);will-change:transform;animation:morph 14s ease-in-out infinite}
.blob2{animation-delay:-6s;animation-duration:17s}
.blob3{animation-delay:-11s;animation-duration:20s}
@keyframes morph{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}25%{transform:translate(180px,-90px) scale(1.2) rotate(20deg)}50%{transform:translate(60px,110px) scale(.9) rotate(-10deg)}75%{transform:translate(-160px,40px) scale(1.12) rotate(12deg)}}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .25s ease}
.press:hover{transform:translateY(-4px) scale(1.02)}
.press:active{transform:translateY(3px) scale(.97)}
.dim{opacity:.5}
.wobble{animation:wobble .45s ease}
.used{opacity:.22;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.used::before,.used::after{display:none}
.slot-empty{background:rgba(255,255,255,.35);box-shadow:inset 0 3px 6px rgba(43,44,107,.14),inset 0 0 0 2px rgba(255,255,255,.85)}
.slot-empty::before,.slot-empty::after{display:none}
@keyframes wobble{0%,100%{translate:0 0}20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:4px 0}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.blob,.pop,.wobble{animation:none}.press{transition:none}}
.kb-caret{display:inline-block;width:3px;height:34px;margin-left:4px;background:#7B6BE0;border-radius:2px;animation:kbBlink 1s steps(1) infinite}@keyframes kbBlink{50%{opacity:0}}
.many-t > :first-child{padding:10px 14px 12px !important;gap:4px !important}.many-t > :first-child > span.puff:first-child{width:66px !important;height:66px !important}.many-t > :first-child > span.puff:first-child svg{width:56px;height:56px}.many-t > :first-child > div{font-size:28px !important}.many-t > :first-child > span.puff:not(:first-child){display:none !important}.many .plist{display:grid !important;grid-template-columns:1fr 1fr;gap:4px !important;overflow:visible !important;flex-shrink:0 !important}.many .plist > div{padding:3px 10px 3px 3px !important;gap:6px !important;border-radius:16px !important;min-width:0}.many .plist > div > span:first-child{width:32px !important;height:32px !important}.many .plist > div > span:first-child svg{width:32px;height:32px}.many .plist > div > span:nth-child(2){font-size:16px !important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.many .plist > div > span:last-child{font-size:20px !important}
/*SA-THEME*/
/* ==========================================================================
   한글 놀이터 — "문방구 Sticker Arcade" theme
   Loaded after each page's own styles; restyles the shared building blocks
   (.puff tiles/buttons, .frost panels, blobs, fonts) without touching markup.
   ========================================================================== */
:root{
  --ink:#16131F; --paper:#FFFFFF; --mist:#F4F2EC; --violet:#6A47F2; --violet-d:#4C2BD6; --violet-l:#B9A8FF;
  --red:#EC4027; --lime:#4CC46A; --sun:#FFDD3C; --sky:#4FB8FF; --gum:#F05AB4;
  --b:3px solid var(--ink);
}

/* page background: dot grid instead of drifting blobs */
.sa-root{background:var(--mist) !important;color:var(--ink) !important;isolation:isolate}
/* poster decor: big flat shapes, hatching, polka dots, giant outlined type (behind everything) */
.sa-decor{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sa-decor i{position:absolute;display:block}
.sa-decor .d-type{left:-40px;bottom:-150px;font-family:'Jua',sans-serif;font-weight:800;font-size:560px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(22,19,31,.16);letter-spacing:-20px;white-space:nowrap;font-style:normal}
.sa-decor .d-blob{right:-120px;top:-150px;width:560px;height:470px;border-radius:58% 42% 55% 45%/48% 60% 40% 52%;background:repeating-linear-gradient(-45deg,var(--violet) 0 5px,transparent 5px 11px);opacity:.9;transform:rotate(-12deg)}
.sa-decor .d-dots{left:-90px;bottom:-110px;width:430px;height:330px;background:var(--lime) radial-gradient(#FFFFFF 7px,transparent 7.5px) 0 0/34px 34px;transform:rotate(14deg);clip-path:polygon(0 18%,74% 0,100% 64%,30% 100%)}
.sa-decor .d-star{left:20px;top:96px;width:250px;height:250px;background:var(--sun);clip-path:polygon(50% 0,59% 26%,85% 12%,73% 39%,100% 46%,74% 58%,90% 84%,62% 74%,52% 100%,42% 74%,14% 88%,28% 60%,0 50%,27% 40%,12% 14%,40% 25%);transform:rotate(8deg)}
.sa-decor .d-tri{right:300px;bottom:-40px;width:140px;height:180px;background:var(--ink);clip-path:polygon(0 0,100% 60%,20% 100%)}
.blob{display:none !important}

/* fonts: display text heavy, never faux-bold */
[style*="'Jua'"]{font-weight:800 !important;letter-spacing:-.2px}
h1,h2{font-weight:800 !important}

/* sticker surfaces */
.puff{background:var(--c) !important;border:var(--b) !important;box-shadow:0 4px 0 var(--ink) !important;box-sizing:border-box}
.puff::before,.puff::after{display:none !important}
.puff .puff{box-shadow:0 2px 0 var(--ink) !important;border-width:2.5px !important}
.p-white{--c:var(--paper)}
.p-lav{--c:var(--violet-l)}
.p-coral{--c:var(--red);color:#FFFFFF}
.p-mint{--c:var(--lime)}
.p-butter{--c:var(--sun)}
.p-blue{--c:var(--sky)}
.p-pink{--c:var(--gum)}
.p-holo{--c:var(--lime)}
.p-ghost,.p-ghost.puff{--c:transparent;border-color:transparent !important;box-shadow:none !important}
.flat{box-shadow:none !important}
.frost,.frost-strong{background:var(--paper) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border:var(--b) !important;box-shadow:0 6px 0 var(--ink) !important;box-sizing:border-box}
.frost .frost{box-shadow:0 3px 0 var(--ink) !important}
.ico{filter:none !important}
.sw{box-shadow:0 0 0 3px var(--ink) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:var(--b) !important;box-shadow:inset 0 3px 0 rgba(28,24,56,.08) !important;background:#FFFFFF !important}

/* white text sits on colour: give it an ink outline so it stays readable */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink) !important}
.p-coral{text-shadow:none}
.p-coral > span,.p-coral{-webkit-text-stroke:0}

/* gradient-clipped "glossy" display words become solid ink */
[style*="background-clip: text"]{-webkit-text-fill-color:currentColor}

/* motion: quick, tactile, no hover floating */
.tile{transition:transform .14s cubic-bezier(.3,1.6,.6,1),box-shadow .14s !important}
.tile:hover{transform:translateY(-4px) rotate(-.5deg) !important;box-shadow:0 8px 0 var(--ink) !important}
.tile:active{transform:translateY(4px) !important;box-shadow:0 0 0 var(--ink) !important}
.press{transition:transform .1s cubic-bezier(.3,1.6,.6,1),box-shadow .1s !important}
.press:hover{transform:translateY(-2px) !important}
.press:active{transform:translateY(3px) !important;box-shadow:0 1px 0 var(--ink) !important}
.float,.float2{animation:none !important}

/* focus ring */
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--violet) !important;outline-offset:3px}

/* ---------- hub (menu) ---------- */
.sa-onv{color:var(--ink)}
.sa-onv-sub{color:var(--ink);opacity:.65}
.sa-violet h1{color:#FFFFFF;text-shadow:3px 3px 0 var(--ink)}
.sa-violet h1 + * , .sa-violet .sa-sub-on{color:#FFFFFF}
.sa-nolja{font-family:'Jua',sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--red);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink);transform:rotate(-4deg);letter-spacing:-3px;flex-shrink:0;margin-left:-6px}
.sa-nolja-sm{font-size:118px;-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px 0 var(--ink)}
.sa-tag{height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:var(--b);border-radius:6px;background:var(--ink);color:#FFFFFF;font-weight:800;font-size:17px}
.sa-tag[style*="background"]{color:var(--ink)}
.sa-tag b{font-family:'Jua',sans-serif;font-size:19px}
.sa-me{position:relative;width:330px;height:190px;flex-shrink:0;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:18px;padding:0 22px;box-sizing:border-box}
.sa-me > div:first-child > span{background-color:var(--sky) !important}
.sa-rank{position:absolute;right:-14px;top:-20px;width:80px;height:80px;border:var(--b);border-radius:50%;background:var(--lime);place-items:center;transform:rotate(10deg);box-shadow:0 4px 0 var(--ink);font-family:'Jua',sans-serif;font-size:28px}
.sa-edit{position:absolute;right:-4px;bottom:-2px;z-index:3;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.sa-games{flex:1;min-height:0;display:grid;gap:22px;padding-bottom:8px}
.sa-card{position:relative;display:flex;flex-direction:column;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);overflow:hidden;text-decoration:none;color:var(--ink)}
.sa-art{position:relative;flex:1;min-height:0;border-bottom:var(--b);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sa-art-in{position:relative;width:240px;height:186px;flex-shrink:0}
.sa-foot{height:92px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;box-sizing:border-box}
.sa-gname{font-family:'Jua',sans-serif;font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.sa-gsub{font-weight:650;font-size:15px;opacity:.6;margin-top:6px;white-space:nowrap}
.sa-play{margin-left:auto;width:54px;height:54px;flex-shrink:0;border:var(--b);border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.sa-play svg{margin-left:3px}
.sa-pips{position:absolute;right:12px;top:12px;gap:3px;background:var(--paper);border:var(--b);border-radius:10px;padding:4px 7px}
.sa-t{position:absolute;display:grid;place-items:center;border:var(--b);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-family:'Jua',sans-serif;font-weight:800;color:var(--ink);box-sizing:border-box}
.sa-o{position:absolute;height:34px;border:var(--b);border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;box-sizing:border-box}
.sa-o i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:12px}
.sa-ow{position:absolute;font-family:'Jua',sans-serif;font-weight:800;font-size:32px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
/* class mode: 3 x 2 smaller cards */
.sa-games[style*="repeat(3"] .sa-foot{height:70px}
.sa-games[style*="repeat(3"] .sa-gname{font-size:25px}
.sa-games[style*="repeat(3"] .sa-gsub{font-size:13px;margin-top:4px}
.sa-games[style*="repeat(3"] .sa-play{width:46px;height:46px}
.sa-games[style*="repeat(3"] .sa-art-in{transform:scale(.55)}

/* welcome screen */
.sa-welcome{background:var(--mist) !important}
.sa-welcome h1{font-size:64px !important}

/* ---------- games ---------- */
.sa-prompt{position:relative;border:var(--b);border-radius:24px;box-shadow:0 7px 0 var(--ink);background:var(--violet) repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 12px)}
.sa-ask{font-family:'Jua',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF}
.sa-bigword{color:#FFFFFF;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);letter-spacing:1px}
.sa-key{width:58px;height:58px;flex-shrink:0;border-radius:12px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-family:'Jua',sans-serif;font-weight:800;font-size:28px;position:relative;z-index:1}
.dim{opacity:1 !important;--c:#E9E7EF !important;color:rgba(22,19,31,.42) !important;box-shadow:0 2px 0 rgba(22,19,31,.35) !important;border-color:rgba(22,19,31,.35) !important}
.dim .sa-key{background:rgba(22,19,31,.35)}
.dim *{color:inherit !important}

/* calmer decor on game pages: the menu keeps the full poster */
.sa-root:not(.sa-hub) .sa-decor .d-dots,.sa-root:not(.sa-hub) .sa-decor .d-tri{display:none}
.sa-root:not(.sa-hub) .sa-decor .d-star{left:auto;right:-60px;top:auto;bottom:-70px;width:220px;height:220px}

/* ==========================================================================
   v2 — no outlines on controls (client feedback):
   colour blocks: flat fill + a darker base in their own colour (press-down affordance)
   white surfaces: hairline + soft shadow on a slightly deeper paper background
   white strips attached to colour cards: solid ink with white text
   ink lines stay only on stickers (game art tiles), big outlined type, avatars, "selected"
   ========================================================================== */
:root{--mist:#ECE8DE; --paper-d:#D5CEBE; --hair:inset 0 0 0 1.5px rgba(22,19,31,.13); --soft:0 10px 22px -12px rgba(22,19,31,.32)}
.p-white{--d:var(--paper-d)} .p-lav{--d:#8E78E8} .p-coral{--d:#B52A16} .p-mint{--d:#2F9A4C}
.p-butter{--d:#D9B315} .p-blue{--d:#2A8DD6} .p-pink{--d:#C23A8C} .p-holo{--d:#2F9A4C}
.puff{border:0 !important;box-shadow:0 5px 0 var(--d) !important}
.puff.p-white{box-shadow:var(--hair),0 5px 0 var(--paper-d),var(--soft) !important}
.puff .puff{box-shadow:none !important;border:0 !important}
.puff .puff.p-white{box-shadow:var(--hair) !important}
.frost,.frost-strong{border:0 !important;box-shadow:var(--hair),var(--soft) !important}
.frost .frost{box-shadow:var(--hair) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:0 !important;box-shadow:inset 0 0 0 2px rgba(22,19,31,.15),inset 0 3px 0 rgba(22,19,31,.05) !important}
input:focus{box-shadow:inset 0 0 0 3px var(--violet) !important;outline:none !important}
.tile:hover{box-shadow:0 9px 0 var(--d) !important}
.tile:active{box-shadow:0 0 0 var(--d) !important}
.press:active{box-shadow:0 0 0 var(--d) !important}
.puff.p-white.press:active,.puff.p-white.tile:active{box-shadow:var(--hair) !important}
/* selected / on states keep a ring so "chosen" is unmistakable */
[aria-pressed="true"].puff{box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 var(--d) !important}
.puff.dim,.puff.p-white.dim,.dim{box-shadow:none !important;border:0 !important;--c:#E2DED4 !important}
.sw{box-shadow:var(--hair) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
/* white text on colour: lighter treatment now that blocks have no ink edge */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(22,19,31,.35) !important}
/* quiz + prompt panels */
.sa-prompt{border:0;box-shadow:0 7px 0 var(--violet-d)}
/* hub */
.sa-card{border:0;box-shadow:0 8px 0 var(--d,#000);background:var(--ink)}
.sa-card:hover{box-shadow:0 12px 0 var(--d,#000) !important}
.sa-card:active{box-shadow:0 0 0 var(--d,#000) !important}
.sa-art{border-bottom:0}
.sa-foot{background:var(--ink);color:#FFFFFF}
.sa-gsub{color:#FFFFFF;opacity:.62}
.sa-play{border:0;box-shadow:0 4px 0 #B52A16}
.sa-pips{border:0;background:var(--ink)}
.sa-pipt{font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:#FFFFFF;white-space:nowrap;line-height:18px}
.sa-me{border:0;box-shadow:var(--hair),0 6px 0 var(--paper-d),var(--soft)}
.sa-rank{border:0;box-shadow:0 4px 0 #2F9A4C}
.sa-edit{border:0;box-shadow:0 3px 0 #D9B315}
.sa-tag{border:0}
.sa-tag[style*="background"]{box-shadow:none}
/* white things sitting on white panels (crossword squares, empty syllable slots, list rows) get a paper tint */
.frost .puff.p-white{--c:#F2EFE7}
.frost .puff.p-white[aria-pressed="true"]{--c:var(--paper)}
/* empty syllable slots: dashed ink outline so kids can see where tiles go */
.slot-empty{background:#F2EFE7 !important;box-shadow:inset 0 0 0 2.5px rgba(22,19,31,.35) !important;border:2.5px dashed rgba(22,19,31,.0) !important;outline:2.5px dashed rgba(22,19,31,.45);outline-offset:-6px}

/*R2-PATCH*/
/* P1-1 letterbox matches the paper */
html,body{background:#ECE8DE !important}
/* P1-2 retire old navy/lavender-grey text + icon strokes */
[style*="color: #2B2C6B"],[style*="color:#2B2C6B"]{color:var(--ink) !important}
[style*="color: #4A4C80"],[style*="color:#4A4C80"],[style*="color: #8486B5"]{color:rgba(22,19,31,.62) !important}
svg[stroke="#2B2C6B"]{stroke:var(--ink)} svg[fill="#2B2C6B"]{fill:var(--ink)}
/* P1-2b remaining legacy tints */
[style*="color: #6A4A00"],[style*="color: #5B5DA8"],[style*="color: #3A3B78"],[style*="color: #2E4F45"],[style*="color: #5A4A12"],[style*="color: #5A5C8E"],[style*="color: #3A3C78"],[style*="color: #3A2E7A"],[style*="color: #1F4A3A"],[style*="color: #7E68E0"]{color:rgba(22,19,31,.72) !important}
[style*="color: #B23A2E"],[style*="color: #E2685A"]{color:var(--red) !important}
[style*="color: #2E7A57"]{color:#1F7A3D !important}
a,a:hover{color:var(--ink) !important}
input::placeholder{color:rgba(22,19,31,.42) !important}
/* P1-3 icon "coins" inside controls: drop the nested circle, keep the bare icon */
.frost > .puff[aria-hidden="true"][style*="border-radius: 50%"],
.puff > .puff[aria-hidden="true"][style*="border-radius: 50%"]{background:transparent !important;box-shadow:none !important;width:28px !important}
/* P1-4 pastel lavender -> saturated mid-violet (ink text 6.2:1) */
:root{--violet-l:#9C84FF}
.p-lav{--c:#9C84FF;--d:#7556F0}
/* P1-5 selected = solid violet + white text (one meaning, everywhere) */
[aria-pressed="true"].puff{--c:var(--violet) !important;--d:var(--violet-d) !important;color:#fff !important;box-shadow:0 5px 0 var(--violet-d) !important}
[aria-pressed="true"].puff [style*="color"],[aria-pressed="true"].puff span,[aria-pressed="true"].puff div{color:#fff !important}
[aria-pressed="true"].puff .puff,[aria-pressed="true"].puff .puff *{color:var(--ink) !important}
[aria-pressed="true"].puff > svg,[aria-pressed="true"].puff > svg *{stroke:#fff !important}
/* P1-6 overlay scrim: neutral ink, not navy-lavender */
[style*="background: rgba(43,44,107"]{background:rgba(22,19,31,.55) !important}
/* P1-7 text on red is white; text on sky/green is ink */
.p-coral,.p-coral [style*="color"]{color:#fff !important}
.p-blue [style*="color: #FFFFFF"],.p-mint [style*="color: #FFFFFF"],.p-blue[style*="color: #FFFFFF"],.p-mint[style*="color: #FFFFFF"]{color:var(--ink) !important;text-shadow:none !important}
/* P1-8 no sticky hover on touch */
@media (hover:none){.tile:hover,.press:hover,.sa-card:hover{transform:none !important}.tile:hover{box-shadow:0 5px 0 var(--d) !important}}
/* P1-9 decor type: quieter, menu only */
.sa-decor .d-type{-webkit-text-stroke-color:rgba(22,19,31,.07)}
.sa-root:not(.sa-hub) .sa-decor .d-type{display:none}
/* P1-10 result title: poster type, not gold gloss */
span[style*="background-clip: text"][style*="#FFF8D9"]{display:none !important}
span[style*="color: #F1CD62"]{color:var(--red) !important;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink) !important}
/*/R2-PATCH*/

/*/SA-THEME*/
</style>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#ECE8DE}</style>
</head>
<body>
<template id="dc-view">
<div class="sa-root" style="position: relative; isolation: isolate; width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 80px 44px; background: #E4DCF4; color: #2B2C6B; font-family: 'Nunito', 'Jua', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px; overflow: hidden">
  <div class="sa-decor" aria-hidden="true"><i class="d-type">한글</i><i class="d-blob"></i><i class="d-dots"></i><i class="d-star"></i><i class="d-tri"></i></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden">
    <span class="blob" style="left: -120px; top: -140px; width: 620px; height: 480px; background: #B49BF6"></span>
    <span class="blob blob2" style="left: 620px; top: -160px; width: 600px; height: 440px; background: #FFA797"></span>
    <span class="blob blob3" style="left: 260px; top: 330px; width: 640px; height: 420px; background: #8AD9B6"></span>
    <span class="blob" style="left: 900px; top: 380px; width: 480px; height: 400px; background: #FFD46E; animation-delay: -11s"></span>
  </div>

  <header style="height: 60px; display: flex; align-items: center; gap: 20px">
    <a href="index.html" class="frost press" style="height: 56px; box-sizing: border-box; border-radius: 999px; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 8px; font-family: 'Jua', sans-serif; font-size: 20px">
      <span class="puff p-lav" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B2C6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative; z-index: 1"><polyline points="14 6 8 12 14 18"></polyline></svg>
      </span>
      메뉴</a>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; white-space: nowrap">초성 퀴즈</div>
      <div style="font-size: 15px; font-weight: 800; color: #4A4C80; margin-top: 4px">Anfangskonsonanten</div>
    </div>
    <button type="button" onClick="{{openSetup}}" class="frost press" style="height: 56px; box-sizing: border-box; border: none; border-radius: 999px; padding: 0 20px 0 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #2B2C6B; font-family: inherit">
      <span class="puff p-butter" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#2B2C6B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="position: relative; z-index: 1"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5Z"></path><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5c.8 0 1.5-.7 1.5-1.5Z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05">
        <span style="font-family: 'Jua', sans-serif; font-size: 19px; white-space: nowrap">{{poolLabel}}</span>
        <span style="font-size: 12px; font-weight: 800; color: #4A4C80">단어 · Einstellen</span>
      </span>
    </button>
    <div class="puff p-mint" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #3FAE7E; box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 2px 3px rgba(30,120,80,.35)"></span>
      <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 20px">문제 {{qLabel}}</span>
      <span style="position: relative; z-index: 1; font-size: 14px; font-weight: 800; color: #2E4F45">Frage</span>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; gap: 44px">
    <section style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div class="frost" style="height: 150px; box-sizing: border-box; flex-shrink: 0; border-radius: 40px; padding: 12px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center">
        <div style="font-size: 15px; font-weight: 800; color: #4A4C80">초성을 보고 단어를 맞혀요 · Errate das Wort</div>
        <div aria-live="polite" style="font-family: 'Jua', sans-serif; font-size: {{clueFs}}px; line-height: 1.12">{{clueDe}}</div>
        <div style="font-size: 17px; font-weight: 800; color: #3A3B78; word-break: keep-all">{{clueEn}}</div>
        <div style="font-family: 'Jua', sans-serif; font-size: 20px; color: #5B5DA8; min-height: 2px">{{clueKo}}</div>
      </div>

      <div class="frost {{rowCls}}" style="flex: 1; min-height: 0; border-radius: 40px; padding: 16px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
        <div style="display: flex; justify-content: center; align-items: center; gap: 12px">
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
            <span class="puff {{t.cls}}" style="width: {{t.w}}px; height: {{t.px}}px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: {{t.ink}}; font-family: 'Jua', sans-serif; font-size: {{t.fs}}px; line-height: 1"><span style="position: relative; z-index: 1">{{t.ch}}</span></span>
          </sc-for>
        </div>
        <div style="font-size: 13px; font-weight: 800; color: #4A4C80">{{lenNote}}</div>
        <div style="width: 100%; max-width: 640px; display: flex; gap: 12px">
          <label for="cs-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">정답 · Antwort</label>
          <input id="cs-answer" type="text" value="{{guess}}" onChange="{{onGuess}}" onKeyDown="{{onKey}}" placeholder="정답 입력 · Antwort" autocomplete="off" style="flex: 1; min-width: 0; height: 60px; box-sizing: border-box; border: none; border-radius: 999px; padding: 0 24px; background: rgba(255,255,255,.9); box-shadow: inset 0 3px 6px rgba(43,44,107,.14), inset 0 -1px 0 rgba(255,255,255,.9), 0 0 0 1.5px rgba(255,255,255,.8); font-family: 'Jua', sans-serif; font-size: 28px; color: #2B2C6B">
          <button type="button" onClick="{{submit}}" class="puff p-coral press" style="height: 60px; border: none; border-radius: 999px; padding: 0 24px; cursor: pointer; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 21px; text-shadow: 0 2px 3px rgba(160,40,30,.35)"><span style="position: relative; z-index: 1">확인</span></button>
          <button type="button" onClick="{{openKb}}" aria-label="화면 키보드 · Bildschirmtastatur" class="puff p-lav press" style="width: 60px; height: 60px; flex-shrink: 0; border: none; border-radius: 50%; padding: 0; cursor: pointer; font-size: 26px; display: flex; align-items: center; justify-content: center"><span style="position: relative; z-index: 1">⌨️</span></button>
          <sc-if value="{{hasMic}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{listen}}" aria-label="말해서 입력 · Sprechen" class="puff {{micCls}} press" style="width: 60px; height: 60px; flex-shrink: 0; border: none; border-radius: 50%; padding: 0; cursor: pointer; font-size: 26px; display: flex; align-items: center; justify-content: center"><span style="position: relative; z-index: 1">🎤</span></button>
          </sc-if>

        </div>
        <div style="display: flex; gap: 12px">
          <button type="button" onClick="{{hint}}" class="puff p-butter press" style="height: 46px; border: none; border-radius: 999px; padding: 0 18px; cursor: pointer; color: #2B2C6B; font-family: 'Jua', sans-serif; font-size: 18px"><span style="position: relative; z-index: 1">글자 하나 보기</span></button>
          <button type="button" onClick="{{pass}}" class="puff p-white press" style="height: 46px; border: none; border-radius: 999px; padding: 0 18px; cursor: pointer; color: #2B2C6B; font-family: 'Jua', sans-serif; font-size: 18px"><span style="position: relative; z-index: 1">모르겠어요</span></button>
        </div>
      </div>
    </section>

    <aside class="{{asideCls}}" style="width: 306px; flex-shrink: 0; display: flex; flex-direction: column; gap: 22px">
      <div class="puff p-blue" style="border-radius: 36px; padding: 18px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <span class="puff p-white" style="width: 104px; height: 104px; border-radius: 50%; display: block">
          <span style="position: absolute; inset: 6px; z-index: 1; border-radius: 50%; overflow: hidden; display: block; background: {{cur.inner}}">
            <svg viewBox="0 4 120 116" width="92" height="92" aria-hidden="true" style="display: block">
              <path d="{{cur.hairBack}}" fill="{{cur.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="M53 68L53 92L67 92L67 68Z" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{cur.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.shirtLines}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{cur.ears}}" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
              <path d="{{cur.head}}" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.blush}}" fill="#F49AA8" opacity="0.6"></path>
              <path d="{{cur.freckles}}" fill="#1E1E24" opacity="0.45"></path>
              <path d="{{cur.brows}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
              <path d="{{cur.eyesFill}}" fill="#1E1E24"></path>
              <path d="{{cur.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
              <path d="{{cur.eyesWhite}}" fill="#FFFFFF"></path>
              <path d="{{cur.noseStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{cur.noseFill}}" fill="#1E1E24"></path>
              <path d="{{cur.mouthFill}}" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.6" stroke-linejoin="round"></path>
              <path d="{{cur.mouthWhite}}" fill="#FFFFFF"></path>
              <path d="{{cur.tongue}}" fill="#F27A8A"></path>
              <path d="{{cur.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
              <path d="{{cur.hairFront}}" fill="{{cur.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
              <path d="{{cur.accStroke}}" fill="none" stroke="#1E1E24" stroke-width="4" stroke-linecap="round"></path>
              <path d="{{cur.accFill}}" fill="{{cur.accCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.accFill2}}" fill="{{cur.acc2Col}}" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round"></path>
            </svg>
          </span>
        </span>
        <div style="font-family: 'Jua', sans-serif; font-size: 36px; line-height: 1.05; color: #FFFFFF; text-shadow: 0 -1px 0 rgba(255,255,255,.6), 0 3px 0 rgba(40,90,180,.35), 0 8px 14px rgba(40,90,180,.4)">{{cur.name}} 차례!</div>
        <span class="puff p-white" style="border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 900"><span style="position: relative; z-index: 1">{{cur.helper}}</span></span>
      </div>
      <div class="frost plist" style="border-radius: 30px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; flex-shrink: 1; overflow-y: auto">
        <sc-for list="{{players}}" as="p" hint-placeholder-count="2">
          <div class="{{p.rowCls}}" style="display: flex; align-items: center; gap: 10px; border-radius: 22px; padding: 6px 16px 6px 6px">
            <span style="position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: block; background: {{p.inner}}; box-shadow: 0 0 0 2px #FFFFFF">
              <svg viewBox="0 4 120 116" width="44" height="44" aria-hidden="true" style="display: block">
                <path d="{{p.hairBack}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M53 68L53 92L67 92L67 68Z" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{p.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.ears}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
                <path d="{{p.head}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.eyesFill}}" fill="#1E1E24"></path>
                <path d="{{p.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.mouthFill}}" fill="#1E1E24"></path>
                <path d="{{p.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.hairFront}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
              </svg>
            </span>
            <span style="position: relative; z-index: 1; flex: 1; font-family: 'Jua', sans-serif; font-size: 21px">{{p.name}}</span>
            <span style="position: relative; z-index: 1; font-size: 13px; font-weight: 900; color: #6A4A00; display: {{p.streakShow}}">{{p.streak}}연속</span>
            <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 28px; font-variant-numeric: tabular-nums">{{p.score}}</span>
          </div>
        </sc-for>
      </div>
      <div class="frost" style="border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: {{dotGap}}px; justify-content: center">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
            <span style="width: {{d.size}}px; height: {{d.size}}px; border-radius: 50%; background: {{d.bg}}; box-shadow: inset 0 2px 2px rgba(255,255,255,.7), inset 0 -3px 4px rgba(0,0,0,.12), 0 0 0 {{d.ring}} #FFFFFF"></span>
          </sc-for>
        </div>
        <div style="font-size: 15px; font-weight: 800; line-height: 1.45; min-height: 44px; text-align: center">{{msg}}</div>
      </div>
    </aside>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 6; background: rgba(43,44,107,.3); display: flex; align-items: center; justify-content: center">
      <div class="frost frost-strong pop" style="border-radius: 48px; padding: 36px 52px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <div aria-hidden="true" style="position: relative; font-family: 'Jua', sans-serif; font-size: 112px; line-height: 1">
          <span style="color: #F1CD62; text-shadow: 0 3px 0 #E8B93E, 0 6px 0 #D9A62A, 0 18px 24px rgba(230,190,70,.5)">완성!</span>
          <span style="position: absolute; left: 0; top: 0; background: linear-gradient(175deg, #FFF8D9 0%, #FFE58F 35%, #F6CF55 70%, #EDBD3A 100%); -webkit-background-clip: text; background-clip: text; color: transparent">완성!</span>
        </div>
        <div style="font-family: 'Jua', sans-serif; font-size: 30px">{{winner}}</div>
        <sc-if value="{{classOn}}" hint-placeholder-val="{{ false }}">
          <div class="puff p-butter" style="border-radius: 999px; padding: 10px 24px; font-family: 'Jua', sans-serif; font-size: 24px; color: #6A4A00"><span style="position: relative; z-index: 1">{{classLine}}</span></div>
        </sc-if>
        <div style="font-size: 16px; font-weight: 800; color: #4A4C80">{{finalLine}}</div>
        <button type="button" onClick="{{restart}}" class="puff p-coral press" style="margin-top: 8px; height: 62px; border: none; border-radius: 999px; padding: 0 28px; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 24px; cursor: pointer; text-shadow: 0 2px 3px rgba(160,40,30,.35)"><span style="position: relative; z-index: 1">한 번 더 · Nochmal</span></button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{setup}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; z-index: 5; background: rgba(43,44,107,.34); display: flex; align-items: center; justify-content: center">
      <div class="frost frost-strong pop" role="dialog" aria-label="게임 준비 · Spiel einstellen" style="width: 760px; box-sizing: border-box; border-radius: 46px; padding: 28px 34px 30px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="font-family: 'Jua', sans-serif; font-size: 36px; line-height: 1">게임 준비</div>
          <div style="font-size: 15px; font-weight: 800; color: #4A4C80">Spiel einstellen</div>
        </div>
        <div class="frost" style="border-radius: 30px; padding: 14px 16px 14px 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 12px">
            <div style="flex: 1; line-height: 1.15">
              <div style="font-family: 'Jua', sans-serif; font-size: 21px">오늘의 단어 <span style="font-family: 'Jua', sans-serif; color: #5B5DA8">{{poolCount}}</span></div>
              <div style="font-size: 13px; font-weight: 800; color: #4A4C80">Heutige Wörter</div>
            </div>
            <a href="words.html" class="puff p-white press" style="height: 44px; box-sizing: border-box; border-radius: 999px; padding: 0 18px; display: {{vocabDisp}}; align-items: center; text-decoration: none; font-family: 'Jua', sans-serif; font-size: 17px"><span style="position: relative; z-index: 1">단어장에서 바꾸기 · Ändern</span></a>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{poolChips}}" as="ch" hint-placeholder-count="2">
              <span class="puff {{ch.cls}}" style="border-radius: 999px; padding: 6px 14px; font-family: 'Jua', sans-serif; font-size: 17px"><span style="position: relative; z-index: 1">{{ch.label}}</span></span>
            </sc-for>
          </div>
          <div style="font-size: 13px; font-weight: 800; color: #4A4C80">{{poolNote}}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 178px; flex-shrink: 0; line-height: 1.15">
            <div style="font-family: 'Jua', sans-serif; font-size: 21px">{{opt1Title}}</div>
            <div style="font-size: 13px; font-weight: 800; color: #4A4C80">{{opt1Sub}}</div>
          </div>

<script>
class Component extends DCLogic {
  constructor(props) {

  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  sampleWords() {

      { ko: '학교', de: 'Schule', en: 'school', hint: '학생들이 공부하러 가는 곳', lesson: 0 },
      { ko: '친구', de: 'Freund', en: 'friend', hint: '가깝게 지내는 사이', lesson: 0 },
      { ko: '바다', de: 'Meer', en: 'sea', hint: '짠물이 넓게 펼쳐진 곳', lesson: 0 },

  readSel() {
    const CC = this.cp();
    if (CC) { const t = {}; CC.lessons().forEach(n => { t[n] = true; }); return { today: t, off: {} }; }
    let sel = null;
    try { sel = JSON.parse(localStorage.getItem('hangul_today_v1') || 'null'); } catch (e) {}

    if (!sel.off) sel.off = {};
    return sel;
  }
  loadPool() {
    const sel = this.readSel();
    const UNIT_CLS = { u1: 'p-lav', u2: 'p-pink', u3: 'p-mint', u4: 'p-butter', u5: 'p-blue', u6: 'p-coral' };
    return fetch('content/textbook-4-1-vocab.json').then(r => r.json()).then(d => {
      const lw = (L) => {
        const own = L.words.map((w, i) => ({ w, key: L.n + ':' + i, from: L.n }));
        if (!L.review) return own;
        const more = [];
        L.review.forEach(n => { const src = d.lessons.find(x => x.n === n); if (src) src.words.forEach((w, i) => more.push({ w, key: n + ':' + i, from: n })); });
        return more.concat(own);
      };
      const chosen = d.lessons.filter(L => sel.today[L.n]);
      const seen = {}, words = [];
      chosen.forEach(L => lw(L).forEach(x => {
        if (sel.off[x.key]) return;
        const meta = (x.w[4] && typeof x.w[4] === 'object') ? x.w[4] : {};   // game form, games list, accepted alternatives
        if (meta.games && meta.games.indexOf('chosung') < 0) return;
        const ko = meta.g || x.w[0];
        if (seen[ko]) return;
        seen[ko] = true;
        words.push({ ko, de: x.w[1], en: x.w[2], hint: x.w[3] || '', lesson: x.from, tb: meta.g && meta.g !== x.w[0] ? x.w[0] : '', alt: meta.alt || [] });
      }));
      return {
        words, sample: false,
        label: chosen.length ? (chosen.length > 3 ? chosen.slice(0, 2).map(L => L.n + '과').join(' · ') + ' 외 ' + (chosen.length - 2) + '개' : chosen.map(L => L.n + '과').join(' · ')) : '—',
        chips: chosen.map(L => ({ label: L.n + '과 ' + L.theme[0], cls: L.unit ? UNIT_CLS[L.unit] : 'p-white' })),
        note: chosen.length ? '단어장에서 고른 단어로 해요 · Wörter aus dem Wortschatz' : '오늘의 단어장이 비어 있어요 · Keine Lektion gewählt'
      };
    });
  }
  samplePool(note) {
    return { words: this.sampleWords(), sample: true, label: '예시', chips: [{ label: '예시 단어 · Beispiel', cls: 'p-white' }], note };
  }
  usableWords(min) {
    const p = this.state.pool;
    if (p && p.words.length >= min) return p.words;
    return this.sampleWords();
  }
  componentDidMount() {
    this.refreshPool();
    this.onStore = (e) => { if (!e || !e.key || e.key === 'hangul_today_v1') this.refreshPool(); };

  }
  componentWillUnmount() {
    clearTimeout(this.timer);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  refreshPool() {
    this.loadPool()
      .then(pool => { this.setState({ pool }); if (this.onPool) this.onPool(pool); })

  }
  poolVals(min) {
    const p = this.state.pool;
    if (!p) return { poolCount: '…', poolChips: [], poolNote: '단어장을 불러오는 중… · Lädt … · Loading…', poolLabel: '…', poolReady: false };
    const short = !p.sample && p.words.length < min;
    return {
      poolCount: p.words.length + '개',
      poolChips: p.chips,
      poolNote: short ? ('단어가 ' + min + '개보다 적어서 예시 단어로 해요 · Zu wenige Wörter, Beispielwörter') : p.note,
      poolLabel: short ? '예시' : p.label,
      poolReady: true
    };
  }
  seg(list, cur, key) {
    return list.map(o => ({ label: o.label, sub: o.sub, pressed: o.v === cur ? 'true' : 'false', cls: o.v === cur ? 'p-lav' : 'p-white', pick: () => this.setState({ [key]: o.v }) }));
  }

  onPool(pool) {
    if (!this.state.started) this.setState(this.fresh(this.usableWords(4), this.state.count));
  }
  quizWords(words) {
    // Hangul words/phrases up to 6 syllables (spaces kept for display, ignored when checking)
    return words.filter(w => /^[가-힣 ]+$/.test(w.ko) && w.ko.replace(/\s+/g, '').length >= 2 && w.ko.replace(/\s+/g, '').length <= 6);
  }
  chosung(ch) {
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c < 0 || c > 11171) return ch;
    return 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor(c / 588)];
  }
  fresh(words, count) {
    const pw = this.quizWords(words);
    const src = pw.length >= 2 ? pw : this.quizWords(this.sampleWords());
    const qs = this.shuffle(src).slice(0, Math.min(count, src.length)).map(w => ({ w, chars: Array.from(w.ko) }));
    return { qs, i: 0, turn: 0, scores: this.zeros(), streaks: this.zeros(), results: [], shown: [], tries: 0, hintUsed: false, status: null, guess: '',

  }

    const ans = q.w.ko.replace(/\s+/g, '');
    const alts = (q.w.alt || []).map(a => a.replace(/\s+/g, ''));
    if (g === ans || alts.indexOf(g) >= 0) {
      this.sfx('match');
      const streaks = s.streaks.slice(); streaks[s.turn] += 1;

  loadHub() { try { return JSON.parse(localStorage.getItem('hangul_hub_v1') || 'null') || {}; } catch (e) { return {}; } }
  loadPlayers() {

      { name: '지민', en: '지민', cfg: { head: 0, hair: 1, eyes: 3, brows: 0, nose: 0, mouth: 0, glasses: 0, shirt: 2, acc: 0, skin: 1, hairC: 0, shirtC: 0, accC: 3, blush: true, freckles: false, bg: 0 } },

  }
  zeros() { return this.ROSTER.map(() => 0); }
  winnerOf(scores) {
    if (this.ROSTER.length === 1) return scores[0] + '점! · ' + scores[0] + ' Punkte';
    const max = Math.max.apply(null, scores);
    const top = this.ROSTER.filter((p, i) => scores[i] === max);
    return top.length > 1 ? top.map(p => p.name).join(' · ') + ' 공동 1등! · ' + (top.length === this.ROSTER.length ? 'Unentschieden' : 'gemeinsam Platz 1') : top[0].name + ' 우승! · gewinnt';
  }
  sfx(name) {
    const h = this.loadHub();
    if (h.sound === false) return;
    const vol = (typeof h.volume === 'number' ? h.volume : 70) / 100;
    if (vol <= 0) return;
    try {
      if (!this._ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this._ac = new AC(); }

      if (c.state === 'suspended') c.resume();
      const t0 = c.currentTime + 0.01;
      const N = (f, d, dur, type, peak, f2) => {
        const o = c.createOscillator(), g = c.createGain(), t = t0 + d;
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.8);

      const bell = (f, d, p, dur) => { const L = dur || 0.9; N(f, d, L, 'sine', p); N(f * 1.006, d, L, 'sine', p * 0.7); N(f * 2.01, d, L * 0.5, 'sine', p * 0.25); };
      const S = {
        bubble: { tap: () => N(500, 0, 0.09, 'sine', 0.3, 820), select: () => { N(620, 0, 0.08, 'sine', 0.26, 990); N(880, 0.07, 0.1, 'sine', 0.22, 1250); }, match: () => [523, 659, 784].forEach((f, i) => N(f, i * 0.08, 0.16, 'sine', 0.3, f * 1.25)), miss: () => N(420, 0, 0.28, 'sine', 0.26, 200), win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => N(f, i * 0.09, 0.22, 'sine', 0.28, f * 1.2)) },
        xylo: { tap: () => mallet(1047, 0, 0.3), select: () => { mallet(784, 0, 0.28); mallet(1175, 0.08, 0.25); }, match: () => [784, 988, 1175].forEach((f, i) => mallet(f, i * 0.09, 0.28)), miss: () => { mallet(262, 0, 0.32); mallet(277, 0.02, 0.24); }, win: () => [523, 587, 659, 784, 880, 1047].forEach((f, i) => mallet(f, i * 0.08, 0.28)) },
        retro: { tap: () => N(660, 0, 0.06, 'square', 0.12), select: () => { N(520, 0, 0.07, 'square', 0.12); N(780, 0.05, 0.08, 'square', 0.12); }, match: () => [523, 659, 784].forEach((f, i) => N(f, i * 0.09, 0.12, 'square', 0.13)), miss: () => N(320, 0, 0.25, 'sawtooth', 0.12, 140), win: () => [523, 659, 784, 1047].forEach((f, i) => N(f, i * 0.13, 0.2, 'square', 0.14)) },
        glass: { tap: () => bell(1568, 0, 0.14, 0.35), select: () => { bell(1319, 0, 0.14, 0.5); bell(1760, 0.06, 0.12, 0.5); }, match: () => { bell(1319, 0, 0.16); bell(1661, 0.1, 0.14); bell(1976, 0.2, 0.14); }, miss: () => { bell(587, 0, 0.16, 0.6); bell(554, 0.08, 0.12, 0.6); }, win: () => [1047, 1319, 1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.1, 0.14, 1.1)) }
      };
      const P = S[h.pack] || S.glass;
      if (P[name]) P[name]();
    } catch (e) {}
  }
  winSound(done) {
    if (done && !this._won) {
      this._won = true; this.sfx('win');
      const C = this.cp();
      if (C && this.accuracy) this._classRes = C.finish(this.GAME, this.accuracy());

  }
  /* ---------- class mode (online version: one student, stars) ---------- */
  cp() { const c = window.ClassPlay; return c && (c.studentMode ? c.studentMode() : c.me()) ? c : null; }
  classVals(v) {
    const C = this.cp();

    v.classLine = this._classRes ? this._classRes.line : '';
    if (!C) return v;
    const size = String(C.RULES.roundSize[this.GAME]);
    if (v.opt1) v.opt1 = v.opt1.filter(o => o.label.indexOf(size) === 0).map(o => ({ ...o, cls: 'p-lav', pressed: 'true' }));

  }
  classStart() {
    this._classRes = null; this._wrong = 0; this._hints = 0; this._half = 0;
    const C = this.cp(); if (C) C.start(this.GAME);
  }
  classSize(own) { const C = this.cp(); return C ? C.RULES.roundSize[this.GAME] : own; }
  accuracy() {
    const r = this.state.results; if (!r.length) return 0;
    return Math.max(0, (r.filter(Boolean).length - 0.5 * (this._half || 0)) / r.length);
  }

  /* ---------- on-screen Korean keyboard + voice input ---------- */
  hgCompose(str, key) {
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
    const VV = { 'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ', 'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ' };
    const CC = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
    const SPLIT = {}; Object.keys(CC).forEach(k => { SPLIT[CC[k]] = [k[0], k[1]]; });
    const mk = (c, v, j) => String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28 + (j ? JONG.indexOf(j) : 0));
    const parts = (ch) => { const n = ch.charCodeAt(0) - 0xAC00; if (n < 0 || n > 11171) return null; return [CHO[Math.floor(n / 588)], JUNG[Math.floor(n % 588 / 28)], n % 28 ? JONG[n % 28] : '']; };
    const last = str.slice(-1), head = str.slice(0, -1), p = last ? parts(last) : null;
    const isV = JUNG.indexOf(key) >= 0;
    if (!isV) {
      if (p && !p[2] && JONG.indexOf(key) > 0) return head + mk(p[0], p[1], key);
      if (p && p[2] && CC[p[2] + key]) return head + mk(p[0], p[1], CC[p[2] + key]);
      return str + key;
    }
    if (last && CHO.indexOf(last) >= 0) return head + mk(last, key, '');
    if (p && !p[2] && VV[p[1] + key]) return head + mk(p[0], VV[p[1] + key], '');
    if (p && p[2]) {

      if (sp) return head + mk(p[0], p[1], sp[0]) + mk(sp[1], key, '');

  }
  hgBack(str) {
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
    const UNV = { 'ㅘ': 'ㅗ', 'ㅙ': 'ㅗ', 'ㅚ': 'ㅗ', 'ㅝ': 'ㅜ', 'ㅞ': 'ㅜ', 'ㅟ': 'ㅜ', 'ㅢ': 'ㅡ' };
    const UNC = { 'ㄳ': 'ㄱ', 'ㄵ': 'ㄴ', 'ㄶ': 'ㄴ', 'ㄺ': 'ㄹ', 'ㄻ': 'ㄹ', 'ㄼ': 'ㄹ', 'ㄽ': 'ㄹ', 'ㄾ': 'ㄹ', 'ㄿ': 'ㄹ', 'ㅀ': 'ㄹ', 'ㅄ': 'ㅂ' };
    const last = str.slice(-1), head = str.slice(0, -1);

    const c = CHO[Math.floor(n / 588)], v = JUNG[Math.floor(n % 588 / 28)], j = n % 28 ? JONG[n % 28] : '';
    const mk = (c, v, j) => String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28 + (j ? JONG.indexOf(j) : 0));
    if (j) return head + mk(c, v, UNC[j] || '');

  }
  kbVals(v) {
    const s = this.state;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const base = [['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', 'ㅐ', 'ㅔ'], ['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'], ['ㅋ', 'ㅌ', 'ㅊ', 'ㅍ', 'ㅠ', 'ㅜ', 'ㅡ']];
    const SH = { 'ㅂ': 'ㅃ', 'ㅈ': 'ㅉ', 'ㄷ': 'ㄸ', 'ㄱ': 'ㄲ', 'ㅅ': 'ㅆ', 'ㅐ': 'ㅒ', 'ㅔ': 'ㅖ' };
    const vowel = (k) => 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅛㅜㅠㅡㅣ'.indexOf(k) >= 0;
    const key = (k) => { const ch = s.kbShift && SH[k] ? SH[k] : k; return { label: ch, w: '68', cls: vowel(ch) ? 'p-butter' : 'p-white', ink: '#2B2C6B',

    rows[2].keys.unshift({ label: '⇧', w: '96', cls: s.kbShift ? 'p-lav' : 'p-white', ink: '#2B2C6B', press: () => this.setState({ kbShift: !this.state.kbShift }) });
    rows[2].keys.push({ label: '⌫', w: '96', cls: 'p-pink', ink: '#2B2C6B', press: () => this.setState({ guess: this.hgBack(this.state.guess || '') }) });

      { label: '띄어쓰기 · Leertaste', w: '360', cls: 'p-white', ink: '#2B2C6B', press: () => this.setState({ guess: (this.state.guess || '') + ' ' }) },
      { label: '전부 지우기', w: '250', cls: 'p-white', ink: '#2B2C6B', press: () => this.setState({ guess: '' }) }

      if (!SR) return;

      micLabel: s.listening ? '듣고 있어요… · Ich höre zu' : '🎤 말하기 · Sprechen',
      micCls: s.listening ? 'p-coral' : 'p-mint', micInk: s.listening ? '#FFFFFF' : '#1F4A3A', micMsg: s.micMsg || '',

      closeKb: () => this.setState({ kbOpen: false }),

  }
  kbHint() { const q = this.q(); return q ? (q.chars.map(ch => ch === ' ' ? ' ' : this.chosung(ch)).join(' ') + ' · ' + (q.w.de || '')) : ''; }
  renderVals() { const v = this.kbVals(this.classVals(this.renderVals0())); v.asideCls = v.players && v.players.length > 3 ? 'many many-t' : ''; v.vocabDisp = (window.ClassPlay && window.ClassPlay.studentMode && window.ClassPlay.studentMode()) ? 'none' : 'flex'; return v; }
  renderVals0() {
    const s = this.state;
    const n = s.qs.length;
    const done = s.started && !s.setup && s.i >= n;
    this.winSound(done);
    const q = this.q();
    const open = s.status === 'right' || s.status === 'reveal';
    const L = q.chars.filter(c => c !== ' ').length;
    const px = L <= 3 ? 120 : L === 4 ? 104 : L === 5 ? 92 : 80;
    const tiles = q.chars.map((c, k) => {
      if (c === ' ') return { ch: '', w: 18, px, fs: 10, cls: 'flat', ink: '#2B2C6B' };
      const show = open || s.shown.indexOf(k) >= 0;
      return {
        ch: show ? c : this.chosung(c), w: px, px, fs: Math.round(px * 0.52),
        cls: s.status === 'right' ? 'p-mint' : s.status === 'reveal' ? 'p-coral' : (show ? 'p-butter' : ['p-lav', 'p-blue', 'p-pink', 'p-mint', 'p-butter', 'p-lav'][k % 6]),
        ink: s.status === 'reveal' ? '#FFFFFF' : '#2B2C6B'

    });

    const dots = s.qs.map((x, k) => {
      const r = s.results[k];
      return { size: big ? 20 : 26, bg: r === true ? '#7FD3AE' : r === false ? '#F2918A' : (k === s.i ? '#FBE18C' : 'rgba(255,255,255,.8)'), ring: k === s.i ? '3px' : '0px' };
    });
    const players = this.ROSTER.map((p, k) => ({
      ...this.build(p.cfg), name: p.name, score: s.scores[k], streak: s.streaks[k],
      streakShow: s.streaks[k] >= 2 ? 'inline' : 'none', rowCls: k === s.turn && !done ? 'puff p-butter' : ''
    }));
    const cp = this.ROSTER[s.turn];
    const winner = this.winnerOf(s.scores);
    const right = s.results.filter(Boolean).length;
    const de = q.w.de, dl = de.length;
    const pv = this.poolVals(4);
    const avail = this.quizWords(this.usableWords(4)).length;
    const want = Math.min(s.count, avail);
    return {
      ...pv,
      clueDe: de, clueFs: dl <= 12 ? 50 : dl <= 20 ? 40 : 32, clueEn: (s.status === 'right' || s.status === 'reveal') && q.w && q.w.tb ? '📖 교과서 · Lehrbuch: ' + q.w.tb : '',
      clueKo: s.clue === 'deko' ? q.w.hint : '',
      tiles, rowCls: s.status === 'wrong' ? 'wobble' : '',
      lenNote: L + '글자 · ' + L + ' Silben' + (q.chars.indexOf(' ') >= 0 ? ' · 띄어쓰기 있어요 · mit Leerzeichen' : ''),
      guess: s.guess,
      onGuess: (e) => this.setState({ guess: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter' && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); this.submit(); } },
      submit: () => this.submit(), hint: () => this.hint(),
      pass: () => { if (!this.state.status && !this.state.setup && this.state.i < n) this.reveal(); },
      dots, dotGap: big ? 4 : 6, players, msg: s.msg, done, winner,
      qLabel: s.setup ? '–' : Math.min(s.i + 1, n) + '/' + n,
      finalLine: n + '문제 중 ' + right + '개 정답 · ' + right + ' von ' + n + ' richtig',
      cur: { ...this.build(cp.cfg), name: cp.name, helper: cp.en + ' ist dran' },
      restart: () => { clearTimeout(this.timer); this.setState({ setup: true, started: false }); },
      setup: s.setup, canClose: s.started && !done,
      openSetup: () => this.setState({ setup: true }),
      closeSetup: () => this.setState({ setup: false }),
      startGame: () => this.startGame(),
      opt1Title: '문제 수', opt1Sub: 'Fragen',
      opt1: this.seg([
        { v: 6, label: '6문제', sub: '6 Fragen' },
        { v: 8, label: '8문제', sub: '8 Fragen' },
        { v: 10, label: '10문제', sub: '10 Fragen' },
        { v: 12, label: '12문제', sub: '12 Fragen' }
      ], s.count, 'count'),
      opt2Title: '단서', opt2Sub: 'Hinweis',
      opt2: this.seg([
        { v: 'deko', label: '독일어 + 한국어 설명', sub: 'Deutsch + Erklärung' },
        { v: 'de', label: '독일어만', sub: 'Nur Deutsch' }
      ], s.clue, 'clue'),
      setupNote: want < s.count
        ? ('단어가 ' + avail + '개라서 ' + want + '문제로 해요 · Nur ' + want + ' Fragen')
        : 'ㅊㅇㅅ → 첫인상! 초성만 보고 맞혀요 · Nur die Anfangskonsonanten'
    };
  }
