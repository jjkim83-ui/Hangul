<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글 놀이터">
<meta name="theme-color" content="#E4DCF4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>카드 짝맞추기 · Memory</title>
<link rel="stylesheet" href="shared/fonts/fonts.css">
<style>
body{margin:0}
a{color:#2B2C6B}a:hover{color:#2B2C6B}
button:focus-visible,a:focus-visible{outline:4px solid #2B2C6B;outline-offset:6px}
.puff{position:relative;background:linear-gradient(180deg,var(--c) 0%,var(--c) 58%,var(--d) 160%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.38),inset 0 -12px 16px -10px rgba(255,255,255,.6),inset 0 -2px 0 var(--dd),0 0 0 1.5px rgba(255,255,255,.55),0 4px 0 var(--d),0 14px 24px var(--sh),0 2px 4px rgba(43,44,107,.08)}
.puff::before{content:"";position:absolute;left:5px;right:5px;top:4px;height:47%;border-radius:inherit;background:radial-gradient(circle at 86% 32%,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 2.5px,rgba(255,255,255,0) 4.5px),linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.2) 65%,rgba(255,255,255,.04) 100%);pointer-events:none}
.puff::after{content:"";position:absolute;inset:2px;border-radius:inherit;border:3px solid transparent;border-top-color:rgba(255,255,255,.9);border-left-color:rgba(255,255,255,.35);filter:blur(1px);pointer-events:none}
.flat::before{display:none}
.p-white{--l:#FFFFFF;--c:#FBFAFF;--d:#E7E3F6;--dd:rgba(120,110,180,.18);--sh:rgba(120,110,180,.28)}
.p-lav{--l:#E6DEFF;--c:#BBA8F6;--d:#9E88E9;--dd:rgba(100,70,200,.30);--sh:rgba(140,110,230,.38)}
.p-coral{--l:#FFB3AA;--c:#EE7466;--d:#D85B4E;--dd:rgba(160,40,30,.30);--sh:rgba(238,116,102,.42)}
.p-mint{--l:#DDF8EC;--c:#A6E5C9;--d:#84D2B0;--dd:rgba(30,140,100,.25);--sh:rgba(110,200,160,.38)}
.p-butter{--l:#FFF6CC;--c:#FBE18C;--d:#F1CD62;--dd:rgba(170,120,0,.22);--sh:rgba(230,190,70,.40)}
.p-pink{--l:#FFE3EE;--c:#F7B6CF;--d:#EC93B5;--dd:rgba(190,60,110,.25);--sh:rgba(236,147,181,.40)}
.p-blue{--l:#DCEBFF;--c:#A9CBF7;--d:#86B1EC;--dd:rgba(40,90,180,.25);--sh:rgba(110,160,230,.38)}
.p-holo{background:radial-gradient(130% 130% at 28% 18%,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 50%),linear-gradient(115deg,#FFD3E4 0%,#CFF1FF 22%,#E3D7FF 44%,#FFF4CC 66%,#CFFBE6 88%,#FFD3E4 100%);background-size:100% 100%,250% 100%;animation:holo 6s linear infinite;--dd:rgba(120,90,200,.22);--sh:rgba(150,120,230,.35)}
@keyframes holo{to{background-position:0 0,250% 0}}
.blob{position:absolute;border-radius:50%;opacity:.88;-webkit-mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);will-change:transform;animation:morph 14s ease-in-out infinite}
.blob2{animation-delay:-6s;animation-duration:17s}
.blob3{animation-delay:-11s;animation-duration:20s}
@keyframes morph{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}25%{transform:translate(180px,-90px) scale(1.2) rotate(20deg)}50%{transform:translate(60px,110px) scale(.9) rotate(-10deg)}75%{transform:translate(-160px,40px) scale(1.12) rotate(12deg)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}
.frost{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.32) 100%);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -12px 18px -12px rgba(255,255,255,.7),0 12px 30px rgba(70,50,150,.16),0 2px 4px rgba(43,44,107,.06)}
.frost-strong{background:linear-gradient(180deg,#FBF9FF 0%,#F1EDFB 100%)}
.ico{filter:drop-shadow(0 1.5px 0 rgba(255,255,255,.75)) drop-shadow(0 3px 3px rgba(43,44,107,.28))}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.press:hover{transform:translateY(-3px) scale(1.04)}
.press:active{transform:translateY(3px) scale(.96)}
.card-btn{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.card-btn:hover{transform:translateY(-6px)}
.flipper{transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.flipper,.card-btn,.press{transition:none}.pop,.p-holo{animation:none}}
.many-t > :first-child{padding:10px 14px 12px !important;gap:4px !important}.many-t > :first-child > span.puff:first-child{width:66px !important;height:66px !important}.many-t > :first-child > span.puff:first-child svg{width:56px;height:56px}.many-t > :first-child > div{font-size:28px !important}.many-t > :first-child > span.puff:not(:first-child){display:none !important}.many .plist{display:grid !important;grid-template-columns:1fr 1fr;gap:4px !important;overflow:visible !important;flex-shrink:0 !important}.many .plist > div{padding:3px 10px 3px 3px !important;gap:6px !important;border-radius:16px !important;min-width:0}.many .plist > div > span:first-child{width:32px !important;height:32px !important}.many .plist > div > span:first-child svg{width:32px;height:32px}.many .plist > div > span:nth-child(2){font-size:16px !important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.many .plist > div > span:last-child{font-size:20px !important}
</style>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#E4DCF4}</style>
</head>
<body>
<template id="dc-view">
<div style="position: relative; isolation: isolate; width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 80px 44px; background: #E4DCF4; color: #2B2C6B; font-family: 'Nunito', 'Jua', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden">
    <span class="blob" style="left: -120px; top: -140px; width: 620px; height: 480px; background: #B49BF6"></span>
    <span class="blob blob2" style="left: 620px; top: -160px; width: 600px; height: 440px; background: #FFA797"></span>
    <span class="blob blob3" style="left: 260px; top: 330px; width: 640px; height: 420px; background: #8AD9B6"></span>
    <span class="blob" style="left: 900px; top: 380px; width: 480px; height: 400px; background: #FFD46E; animation-delay: -11s"></span>
    <span class="blob blob2" style="left: -100px; top: 420px; width: 420px; height: 360px; background: #9EBEF4"></span>
  </div>
  <header style="height: 64px; display: flex; align-items: center; gap: 20px">
    <a href="index.html" class="frost press" style="height: 56px; box-sizing: border-box; border-radius: 999px; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 8px; font-family: 'Jua', sans-serif; font-size: 20px">
      <span class="puff p-lav" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B2C6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14 6 8 12 14 18"></polyline></svg>
      </span>
      메뉴 · Menu
    </a>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; white-space: nowrap">카드 짝맞추기</div>
      <div style="font-size: 15px; font-weight: 800; color: #5A5C8E; margin-top: 4px">Memory · Card match</div>
    </div>
    <button type="button" onClick="{{openSetup}}" class="frost press" style="height: 56px; box-sizing: border-box; border: none; border-radius: 999px; padding: 0 20px 0 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #2B2C6B; font-family: inherit">
      <span class="puff p-butter" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#2B2C6B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="position: relative; z-index: 1"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5Z"></path><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5c.8 0 1.5-.7 1.5-1.5Z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05">
        <span style="font-family: 'Jua', sans-serif; font-size: 19px; white-space: nowrap">{{poolLabel}}</span>
        <span style="font-size: 12px; font-weight: 800; color: #4A4C80">단어 · Einstellen · Setup</span>
      </span>
    </button>
    <div class="puff p-mint" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #3FAE7E; box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 2px 3px rgba(30,120,80,.35)"></span>
      <span style="font-family: 'Jua', sans-serif; font-size: 20px">맞춘 짝 {{pairsLabel}}</span>
      <span style="font-size: 14px; font-weight: 800; color: #2E4F45">Pairs</span>
    </div>
    <div class="puff p-butter" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #E8A417; box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 2px 3px rgba(150,100,0,.35)"></span>
      <span style="font-family: 'Jua', sans-serif; font-size: 20px">시도 {{moves}}</span>
      <span style="font-size: 14px; font-weight: 800; color: #5A4A12">Züge · Moves</span>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; gap: 56px">
    <div style="flex: 1; min-width: 0; display: flex; justify-content: center; align-items: flex-start">
      <div style="display: grid; grid-template-columns: repeat({{cols}}, {{px}}px); grid-auto-rows: {{px}}px; gap: 22px; perspective: 1100px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="16">
          <button type="button" class="card-btn" onClick="{{c.pick}}" aria-label="{{c.label}}" style="position: relative; width: {{c.px}}px; height: {{c.px}}px; border: none; padding: 0; background: none; cursor: pointer; font-family: inherit; color: #2B2C6B">
            <span class="flipper" style="position: absolute; inset: 0; display: block; transform-style: preserve-3d; transform: {{c.turn}}">
              <span class="puff p-lav" style="position: absolute; inset: 0; border-radius: 30px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center">
                <span style="position: absolute; left: 16px; top: 12px; font-size: 14px; font-weight: 900; color: #3A2E7A">{{c.coord}}</span>
                <span aria-hidden="true" style="font-family: 'Jua', sans-serif; font-size: {{c.qfs}}px; line-height: 1; color: #FFFFFF; text-shadow: 0 -1px 0 rgba(255,255,255,.7), 0 3px 0 rgba(120,90,220,.35), 0 8px 12px rgba(80,50,180,.35)">?</span>
              </span>
              <sc-if value="{{c.isMatched}}" hint-placeholder-val="{{ false }}">
                <span class="puff p-holo" style="position: absolute; inset: 0; border-radius: 30px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center">
                  <span class="puff p-white" style="position: absolute; left: 12px; top: 10px; font-size: 13px; font-weight: 900; border-radius: 999px; padding: 0 9px; line-height: 22px">{{c.lang}}</span>
                  <span class="puff p-mint" aria-hidden="true" style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#2B2C6B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 6"></polyline></svg>
                  </span>
                  <span style="padding: 0 10px; text-align: center; font-family: 'Jua', sans-serif; font-size: {{c.fs}}px; line-height: 1.1; word-break: keep-all; overflow-wrap: break-word">{{c.word}}</span>
                </span>
              </sc-if>
              <sc-if value="{{c.notMatched}}" hint-placeholder-val="{{ true }}">
                <span class="puff p-white" style="position: absolute; inset: 0; border-radius: 30px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center">
                  <span class="puff p-butter" style="position: absolute; left: 12px; top: 10px; font-size: 13px; font-weight: 900; border-radius: 999px; padding: 0 9px; line-height: 22px">{{c.lang}}</span>
                  <span style="padding: 0 10px; text-align: center; font-family: 'Jua', sans-serif; font-size: {{c.fs}}px; line-height: 1.1; word-break: keep-all; overflow-wrap: break-word">{{c.word}}</span>
                </span>
              </sc-if>
            </span>
          </button>
        </sc-for>
      </div>
    </div>

    <aside class="{{asideCls}}" style="width: 306px; flex-shrink: 0; display: flex; flex-direction: column; gap: 22px">
      <div class="puff p-blue" style="border-radius: 36px; padding: 18px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <span class="puff p-white" style="width: 104px; height: 104px; border-radius: 50%; display: block">
          <span style="position: absolute; inset: 6px; z-index: 1; border-radius: 50%; overflow: hidden; display: block; background: {{cur.inner}}">
            <svg viewBox="0 4 120 116" width="92" height="92" aria-hidden="true" style="display: block">
              <path d="{{cur.hairBack}}" fill="{{cur.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="M53 68L53 92L67 92L67 68Z" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{cur.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.shirtLines}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{cur.ears}}" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
              <path d="{{cur.head}}" fill="{{cur.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.blush}}" fill="#F49AA8" opacity="0.6"></path>
              <path d="{{cur.freckles}}" fill="#1E1E24" opacity="0.45"></path>
              <path d="{{cur.brows}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
              <path d="{{cur.eyesFill}}" fill="#1E1E24"></path>
              <path d="{{cur.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
              <path d="{{cur.eyesWhite}}" fill="#FFFFFF"></path>
              <path d="{{cur.noseStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{cur.noseFill}}" fill="#1E1E24"></path>
              <path d="{{cur.mouthFill}}" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.6" stroke-linejoin="round"></path>
              <path d="{{cur.mouthWhite}}" fill="#FFFFFF"></path>
              <path d="{{cur.tongue}}" fill="#F27A8A"></path>
              <path d="{{cur.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
              <path d="{{cur.hairFront}}" fill="{{cur.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
              <path d="{{cur.accStroke}}" fill="none" stroke="#1E1E24" stroke-width="4" stroke-linecap="round"></path>
              <path d="{{cur.accFill}}" fill="{{cur.accCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
              <path d="{{cur.accFill2}}" fill="{{cur.acc2Col}}" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round"></path>
            </svg>
          </span>
        </span>
        <div style="font-family: 'Jua', sans-serif; font-size: 36px; line-height: 1.05; color: #FFFFFF; text-shadow: 0 -1px 0 rgba(255,255,255,.6), 0 3px 0 rgba(40,90,180,.35), 0 8px 14px rgba(40,90,180,.4)">{{cur.name}} 차례!</div>
        <span class="puff p-white" style="border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 900"><span style="position: relative; z-index: 1">{{cur.helper}}</span></span>
      </div>
      <div class="frost plist" style="border-radius: 30px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; flex-shrink: 1; overflow-y: auto">
        <sc-for list="{{players}}" as="p" hint-placeholder-count="2">
          <div class="{{p.rowCls}}" style="display: flex; align-items: center; gap: 10px; border-radius: 22px; padding: 6px 16px 6px 6px">
            <span style="position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: block; background: {{p.inner}}; box-shadow: 0 0 0 2px #FFFFFF">
              <svg viewBox="0 4 120 116" width="44" height="44" aria-hidden="true" style="display: block">
                <path d="{{p.hairBack}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M53 68L53 92L67 92L67 68Z" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{p.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.ears}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
                <path d="{{p.head}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.eyesFill}}" fill="#1E1E24"></path>
                <path d="{{p.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.mouthFill}}" fill="#1E1E24"></path>
                <path d="{{p.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{p.hairFront}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{p.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
              </svg>
            </span>
            <span style="position: relative; z-index: 1; flex: 1; font-family: 'Jua', sans-serif; font-size: 21px">{{p.name}}</span>
            <span style="position: relative; z-index: 1; font-size: 13px; font-weight: 900; color: #6A4A00; display: {{p.streakShow}}">{{p.streak}}연속</span>
            <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 28px; font-variant-numeric: tabular-nums">{{p.score}}</span>
          </div>
        </sc-for>
      </div>
      <div class="frost" style="border-radius: 24px; padding: 12px 18px; font-size: 15px; font-weight: 800; line-height: 1.45; min-height: 46px; box-sizing: border-box">{{msg}}</div>
    </aside>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 6; background: rgba(43,44,107,.38); display: flex; align-items: center; justify-content: center">
      <div class="frost frost-strong pop" style="border-radius: 48px; padding: 36px 52px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <div aria-hidden="true" style="position: relative; font-family: 'Jua', sans-serif; font-size: 112px; line-height: 1">
          <span style="color: #F1CD62; text-shadow: 0 3px 0 #E8B93E, 0 6px 0 #D9A62A, 0 18px 24px rgba(230,190,70,.5)">완성!</span>
          <span style="position: absolute; left: 0; top: 0; background: linear-gradient(175deg, #FFF8D9 0%, #FFE58F 35%, #F6CF55 70%, #EDBD3A 100%); -webkit-background-clip: text; background-clip: text; color: transparent">완성!</span>
          <span style="position: absolute; left: 0; top: 0; background: radial-gradient(30% 22% at 24% 24%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%); -webkit-background-clip: text; background-clip: text; color: transparent">완성!</span>
        </div>
        <div style="font-family: 'Jua', sans-serif; font-size: 30px">{{winner}}</div>
        <sc-if value="{{classOn}}" hint-placeholder-val="{{ false }}">
          <div class="puff p-butter" style="border-radius: 999px; padding: 10px 24px; font-family: 'Jua', sans-serif; font-size: 24px; color: #6A4A00"><span style="position: relative; z-index: 1">{{classLine}}</span></div>
        </sc-if>
        <div style="font-size: 16px; font-weight: 800; color: #5A5C8E">Geschafft! · All pairs found!</div>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.GAME = 'memory';
    this.ROSTER = this.loadPlayers();
    this.state = { pool: null, setup: true, started: false, pairsN: 8, mode: 'de', ...this.freshState(this.sampleWords(), 8, 'de') };
  }

  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  sampleWords() {
    return [
      { ko: '사과', de: 'Apfel', en: 'apple', hint: '빨갛고 둥근 과일', lesson: 0 },
      { ko: '학교', de: 'Schule', en: 'school', hint: '학생들이 공부하러 가는 곳', lesson: 0 },
      { ko: '친구', de: 'Freund', en: 'friend', hint: '가깝게 지내는 사이', lesson: 0 },
      { ko: '바다', de: 'Meer', en: 'sea', hint: '짠물이 넓게 펼쳐진 곳', lesson: 0 },
      { ko: '고양이', de: 'Katze', en: 'cat', hint: '야옹 하고 우는 동물', lesson: 0 },
      { ko: '하늘', de: 'Himmel', en: 'sky', hint: '구름과 해가 떠 있는 위쪽', lesson: 0 },
      { ko: '기차', de: 'Zug', en: 'train', hint: '철길 위를 달리는 긴 탈것', lesson: 0 },
      { ko: '이야기', de: 'Geschichte', en: 'story', hint: '어떤 일을 말이나 글로 들려주는 것', lesson: 0 },
      { ko: '고구마', de: 'Süsskartoffel', en: 'sweet potato', hint: '땅속에서 자라는 달콤한 덩이뿌리', lesson: 0 },
      { ko: '다리', de: 'Brücke', en: 'bridge', hint: '강을 건너가게 만든 길', lesson: 0 },
      { ko: '판다', de: 'Panda', en: 'panda', hint: '대나무를 먹는 흑백 곰', lesson: 0 },
      { ko: '차표', de: 'Fahrkarte', en: 'ticket', hint: '버스나 KTX를 탈 때 필요한 종이', lesson: 0 }
    ];
  }
  readSel() {
    const CC = this.cp();
    if (CC) { const t = {}; CC.lessons().forEach(n => { t[n] = true; }); return { today: t, off: {} }; }
    let sel = null;
    try { sel = JSON.parse(localStorage.getItem('hangul_today_v1') || 'null'); } catch (e) {}
    if (!sel || !sel.today || typeof sel.today !== 'object') sel = { today: { 1: true, 2: true }, off: {} };
    if (!sel.off) sel.off = {};
    return sel;
  }
  loadPool() {
    const sel = this.readSel();
    const UNIT_CLS = { u1: 'p-lav', u2: 'p-pink', u3: 'p-mint', u4: 'p-butter', u5: 'p-blue', u6: 'p-coral' };
    return fetch('content/textbook-4-1-vocab.json').then(r => r.json()).then(d => {
      const lw = (L) => {
        const own = L.words.map((w, i) => ({ w, key: L.n + ':' + i, from: L.n }));
        if (!L.review) return own;
        const more = [];
        L.review.forEach(n => { const src = d.lessons.find(x => x.n === n); if (src) src.words.forEach((w, i) => more.push({ w, key: n + ':' + i, from: n })); });
        return more.concat(own);
      };
      const chosen = d.lessons.filter(L => sel.today[L.n]);
      const seen = {}, words = [];
      chosen.forEach(L => lw(L).forEach(x => {
        if (sel.off[x.key]) return;
        const ko = x.w[0];
        if (seen[ko]) return;
        seen[ko] = true;
        words.push({ ko, de: x.w[1], en: x.w[2], hint: x.w[3] || '', lesson: x.from });
      }));
      return {
        words, sample: false,
        label: chosen.length ? (chosen.length > 3 ? chosen.slice(0, 2).map(L => L.n + '과').join(' · ') + ' 외 ' + (chosen.length - 2) + '개' : chosen.map(L => L.n + '과').join(' · ')) : '—',
        chips: chosen.map(L => ({ label: L.n + '과 ' + L.theme[0], cls: L.unit ? UNIT_CLS[L.unit] : 'p-white' })),
        note: chosen.length ? '단어장에서 고른 단어로 해요 · Wörter aus dem Wortschatz · Words from the word pool' : '오늘의 단어장이 비어 있어요 · Keine Lektion gewählt · No lessons picked yet'
      };
    });
  }
  samplePool(note) {
    return { words: this.sampleWords(), sample: true, label: '예시 · Sample', chips: [{ label: '예시 단어 · Beispiel · Sample', cls: 'p-white' }], note };
  }
  usableWords(min) {
    const p = this.state.pool;
    if (p && p.words.length >= min) return p.words;
    return this.sampleWords();
  }
  componentDidMount() {
    // class-only game: a student at home goes back to the menu
    try { const CPm = window.ClassPlay; if (CPm && CPm.studentMode && CPm.studentMode()) { window.location.href = 'index.html'; return; } } catch (e) {}
    this.refreshPool();
    this.onStore = (e) => { if (!e || !e.key || e.key === 'hangul_today_v1') this.refreshPool(); };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
    
  }
  componentWillUnmount() {
    clearTimeout(this.timer);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  refreshPool() {
    this.loadPool()
      .then(pool => { this.setState({ pool }); if (this.onPool) this.onPool(pool); })
      .catch(() => { const pool = this.samplePool('단어장을 못 불러와서 예시 단어를 써요 · Beispielwörter · Using sample words'); this.setState({ pool }); if (this.onPool) this.onPool(pool); });
  }
  poolVals(min) {
    const p = this.state.pool;
    if (!p) return { poolCount: '…', poolChips: [], poolNote: '단어장을 불러오는 중… · Lädt … · Loading…', poolLabel: '…', poolReady: false };
    const short = !p.sample && p.words.length < min;
    return {
      poolCount: p.words.length + '개 · words',
      poolChips: p.chips,
      poolNote: short ? ('단어가 ' + min + '개보다 적어서 예시 단어로 해요 · Zu wenige Wörter, Beispielwörter · Too few words, using samples') : p.note,
      poolLabel: short ? '예시 · Sample' : p.label,
      poolReady: true
    };
  }
  seg(list, cur, key) {
    return list.map(o => ({ label: o.label, sub: o.sub, pressed: o.v === cur ? 'true' : 'false', cls: o.v === cur ? 'p-lav' : 'p-white', pick: () => this.setState({ [key]: o.v }) }));
  }

  onPool(pool) {
    if (!this.state.started) this.setState(this.freshState(this.usableWords(6), this.state.pairsN, this.state.mode));
  }
  layout(n) {
    const cols = { 6: 4, 8: 4, 10: 5, 12: 6 }[n] || Math.min(6, Math.ceil(n / 2));
    const rows = Math.ceil((n * 2) / cols);
    const px = Math.min(116, Math.floor((750 - (cols - 1) * 22) / cols), Math.floor((536 - (rows - 1) * 22) / rows));
    return { cols, rows, px };
  }
  fontFor(word, isKo, px) {
    const n = word.length;
    const base = isKo ? (n <= 3 ? 32 : n <= 5 ? 26 : n <= 8 ? 20 : 16) : (n <= 6 ? 26 : n <= 10 ? 21 : n <= 15 ? 17 : 14);
    // the longest single word must fit on one line (no breaks inside a word)
    const longest = Math.max.apply(null, word.split(/[\s\/]+/).map(t => t.length));
    const fit = (px - 22) / (longest * (isKo ? 1.0 : 0.58));
    return Math.max(11, Math.round(Math.min(base * px / 122, fit)));
  }
  freshState(words, pairsN, mode) {
    const other = (w) => mode === 'en' ? w.en : w.de;
    const short = words.filter(w => w.ko.length <= 7 && other(w).length <= 14);
    const fits = words.filter(w => w.ko.length <= 9 && other(w).length <= 22);
    const src = short.length >= pairsN ? short : fits.length >= pairsN ? fits : words;
    const picks = this.shuffle(src).slice(0, Math.min(pairsN, src.length));
    const n = picks.length;
    const L = this.layout(n);
    const deck = [];
    picks.forEach((p, i) => {
      deck.push({ pair: i, lang: 'KO', word: p.ko, fs: this.fontFor(p.ko, true, L.px) });
      deck.push({ pair: i, lang: mode === 'en' ? 'EN' : 'DE', word: other(p), fs: this.fontFor(other(p), false, L.px) });
    });
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    return { deck, cols: L.cols, px: L.px, up: [], matched: [], turn: 0, scores: this.zeros(), streak: 0, moves: 0, lock: false, msg: '카드 두 장을 뒤집어 짝을 찾아요 · Zwei Karten umdrehen · Flip two cards' };
  }
  pick(i) {
    const s = this.state;
    if (s.setup || s.lock || s.up.indexOf(i) >= 0 || s.matched.indexOf(i) >= 0 || s.up.length >= 2) return;
    const up = s.up.concat([i]);
    if (up.length < 2) { this.sfx('tap'); this.setState({ up }); return; }
    const a = s.deck[up[0]], b = s.deck[up[1]];
    const moves = s.moves + 1;
    if (a.pair === b.pair) {
      this.sfx('match');
      const streak = s.streak + 1;
      const pts = 10 + (streak - 1) * 5;
      const scores = s.scores.slice(); scores[s.turn] += pts;
      const msg = streak >= 2 ? (streak + '연속! +' + pts + ' · ' + streak + 'er-Serie · ' + streak + ' in a row') : ('정답! +' + pts + ' · Richtig! · Correct!');
      this.setState({ up: [], matched: s.matched.concat(up), scores, streak, moves, msg });
    } else {
      this.sfx('miss');
      this.setState({ up, lock: true, moves, msg: '아쉬워요! 다음 차례 · Schade! · Not a match' });
      this.timer = setTimeout(() => {
        this.setState({ up: [], lock: false, turn: (this.state.turn + 1) % this.ROSTER.length, streak: 0 });
      }, 1000);
    }
  }
  startGame() {
    this.classStart();
    clearTimeout(this.timer);
    this.setState({ ...this.freshState(this.usableWords(6), this.classSize(this.state.pairsN), this.state.mode), setup: false, started: true });
  }
  loadHub() { try { return JSON.parse(localStorage.getItem('hangul_hub_v1') || 'null') || {}; } catch (e) { return {}; } }
  loadPlayers() {
    const CC = this.cp();
    if (CC) { const me = CC.me(); return [{ name: me.name, en: me.name, cfg: me.cfg }]; }
    const DEF = [
      { name: '지민', en: '지민', cfg: { head: 0, hair: 1, eyes: 3, brows: 0, nose: 0, mouth: 0, glasses: 0, shirt: 2, acc: 0, skin: 1, hairC: 0, shirtC: 0, accC: 3, blush: true, freckles: false, bg: 0 } },
      { name: '서연', en: '서연', cfg: { head: 1, hair: 3, eyes: 1, brows: 2, nose: 2, mouth: 1, glasses: 1, shirt: 0, acc: 0, skin: 3, hairC: 1, shirtC: 2, accC: 5, blush: true, freckles: true, bg: 1 } }
    ];
    const h = this.loadHub();
    if (!Array.isArray(h.roster) || !h.roster.length) return DEF;
    const sel = h.sel || {};
    const list = (h.order || []).filter(id => sel[id]).map(id => h.roster.find(p => p.id === id)).filter(Boolean);
    return list.length ? list.map(p => ({ name: p.name, en: p.name, cfg: p.cfg })) : DEF;
  }
  zeros() { return this.ROSTER.map(() => 0); }
  winnerOf(scores) {
    if (this.ROSTER.length === 1) return this.ROSTER[0].name + ' 님 ' + scores[0] + '점! · ' + scores[0] + ' Punkte · points';
    const max = Math.max.apply(null, scores);
    const top = this.ROSTER.filter((p, i) => scores[i] === max);
    return top.length > 1 ? '무승부! · Unentschieden · Draw' : top[0].name + ' 님 우승! · gewinnt · wins';
  }
  sfx(name) {
    const h = this.loadHub();
    if (h.sound === false) return;
    const vol = (typeof h.volume === 'number' ? h.volume : 70) / 100;
    if (vol <= 0) return;
    try {
      if (!this._ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this._ac = new AC(); }
      const c = this._ac;
      if (c.state === 'suspended') c.resume();
      const t0 = c.currentTime + 0.01;
      const N = (f, d, dur, type, peak, f2) => {
        const o = c.createOscillator(), g = c.createGain(), t = t0 + d;
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.8);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * vol), t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      };
      const mallet = (f, d, p) => { N(f, d, 0.35, 'triangle', p); N(f * 4, d, 0.08, 'sine', p * 0.25); };
      const bell = (f, d, p, dur) => { const L = dur || 0.9; N(f, d, L, 'sine', p); N(f * 1.006, d, L, 'sine', p * 0.7); N(f * 2.01, d, L * 0.5, 'sine', p * 0.25); };
      const S = {
        bubble: { tap: () => N(500, 0, 0.09, 'sine', 0.3, 820), select: () => { N(620, 0, 0.08, 'sine', 0.26, 990); N(880, 0.07, 0.1, 'sine', 0.22, 1250); }, match: () => [523, 659, 784].forEach((f, i) => N(f, i * 0.08, 0.16, 'sine', 0.3, f * 1.25)), miss: () => N(420, 0, 0.28, 'sine', 0.26, 200), win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => N(f, i * 0.09, 0.22, 'sine', 0.28, f * 1.2)) },
        xylo: { tap: () => mallet(1047, 0, 0.3), select: () => { mallet(784, 0, 0.28); mallet(1175, 0.08, 0.25); }, match: () => [784, 988, 1175].forEach((f, i) => mallet(f, i * 0.09, 0.28)), miss: () => { mallet(262, 0, 0.32); mallet(277, 0.02, 0.24); }, win: () => [523, 587, 659, 784, 880, 1047].forEach((f, i) => mallet(f, i * 0.08, 0.28)) },
        retro: { tap: () => N(660, 0, 0.06, 'square', 0.12), select: () => { N(520, 0, 0.07, 'square', 0.12); N(780, 0.05, 0.08, 'square', 0.12); }, match: () => [523, 659, 784].forEach((f, i) => N(f, i * 0.09, 0.12, 'square', 0.13)), miss: () => N(320, 0, 0.25, 'sawtooth', 0.12, 140), win: () => [523, 659, 784, 1047].forEach((f, i) => N(f, i * 0.13, 0.2, 'square', 0.14)) },
        glass: { tap: () => bell(1568, 0, 0.14, 0.35), select: () => { bell(1319, 0, 0.14, 0.5); bell(1760, 0.06, 0.12, 0.5); }, match: () => { bell(1319, 0, 0.16); bell(1661, 0.1, 0.14); bell(1976, 0.2, 0.14); }, miss: () => { bell(587, 0, 0.16, 0.6); bell(554, 0.08, 0.12, 0.6); }, win: () => [1047, 1319, 1568, 2093, 2637].forEach((f, i) => bell(f, i * 0.1, 0.14, 1.1)) }
      };
      const P = S[h.pack] || S.glass;
      if (P[name]) P[name]();
    } catch (e) {}
  }
  winSound(done) {
    if (done && !this._won) {
      this._won = true; this.sfx('win');
      const C = this.cp();
      if (C && this.accuracy) this._classRes = C.finish(this.GAME, this.accuracy());
    }
    if (!done) this._won = false;
  }
  build(cfg) {
    const C = (x, y, r) => 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0Z';
    const E = (x, y, rx, ry) => 'M' + (x - rx) + ' ' + y + 'a' + rx + ' ' + ry + ' 0 1 0 ' + (2 * rx) + ' 0a' + rx + ' ' + ry + ' 0 1 0 ' + (-2 * rx) + ' 0Z';
    const NONE = 'M0 0';
    const SKIN = ['#FFE9DC', '#F9D7BE', '#EEC09A', '#D9A27A', '#B07A52', '#8A5A3A', '#6A4128'];
    const HAIR = ['#1E1E24', '#4A3326', '#7B4E2E', '#C99A4E', '#E5C27A', '#B4B4B8', '#E46B5A', '#7E6BD9'];
    const CLOTH = ['#BBA8F6', '#EE7466', '#A6E5C9', '#FBE18C', '#A9CBF7', '#F7B6CF', '#FFFFFF', '#5B5DA8'];
    const INNER = ['#EEE8FF', '#E6F8EF', '#FFF7D6', '#E8F1FF', '#FFEDF4', '#FFE7E3'];
    const heads = [E(60, 52, 22, 26), E(60, 53, 24, 24), 'M38 46C38 30 48 24 60 24C72 24 82 30 82 46L82 58C82 72 72 80 60 80C48 80 38 72 38 58Z'];
    const earX = cfg.head === 1 ? 23.5 : 21.5;
    const hairs = [
      { f: 'M36 50C34 30 46 20 60 20C76 20 86 30 84 50C80 41 74 37 66 39C60 33 50 35 46 41C42 41 38 45 36 50Z' },
      { f: 'M33 50C33 26 46 18 60 18C74 18 87 26 87 50L88 74C82 77 77 75 76 70L78 48C70 41 55 35 42 48L44 70C43 75 38 77 32 74Z' },
      { b: 'M35 42C35 22 47 15 60 15C73 15 85 22 85 42L88 100C76 104 44 104 32 100Z', f: 'M38 46C39 30 49 22 60 22C72 22 81 30 82 46C73 42 64 36 59 29C55 38 47 44 38 46Z' },
      { f: C(60, 15, 9) + 'M37 48C35 28 47 22 60 22C73 22 85 28 83 48C76 38 68 34 60 34C52 34 44 38 37 48Z' },
      { f: C(40, 42, 9) + C(45, 29, 10) + C(58, 22, 11) + C(71, 26, 10) + C(80, 37, 9) + C(84, 49, 7) + C(36, 53, 7) },
      { f: 'M36 49L37 31L45 36L49 20L57 30L64 15L70 29L78 21L80 35L86 33L84 49C76 40 67 36 60 36C52 36 43 40 36 49Z' },
      { f: 'M36 52C33 30 46 19 62 19C78 19 87 30 85 48C82 44 78 42 74 42C64 42 54 36 50 30C48 38 42 46 36 52Z' },
      { b: 'M80 34C92 34 96 50 92 66C90 72 86 72 86 66C88 54 86 44 78 40Z', f: 'M37 48C35 28 47 21 60 21C73 21 85 28 83 48C76 38 68 34 60 34C52 34 44 38 37 48Z' },
      { f: 'M38 44C40 29 50 24 60 24C70 24 80 29 82 44C74 38 46 38 38 44Z' }
    ];
    const eyes = [
      { fill: C(51, 55, 2.6) + C(69, 55, 2.6) },
      { stroke: 'M47 56Q51 51 55 56M65 56Q69 51 73 56' },
      { stroke: 'M47 55L55 55M65 55L73 55' },
      { fill: C(51, 55, 3.8) + C(69, 55, 3.8), white: C(52.3, 53.8, 1.3) + C(70.3, 53.8, 1.3) },
      { fill: C(51, 55, 2.6), stroke: 'M65 56Q69 51 73 56' },
      { stroke: 'M47 54Q51 58 55 54M65 54Q69 58 73 54' }
    ];
    const brows = ['M46 48Q51 44 56 47M64 47Q69 44 74 48', 'M46 47L56 46M64 46L74 47', 'M46 45Q51 41 56 44M64 44Q69 41 74 45', NONE];
    const noses = [{ s: 'M60 55L57 64L61 64' }, { s: 'M61 56Q55 63 61 65' }, { f: C(60, 62, 1.6) }, {}];
    const mouths = [
      { s: 'M53 70Q60 76 67 70' },
      { f: 'M52 69Q60 81 68 69Z', t: E(60, 75, 3.4, 2) },
      { f: E(60, 71, 3, 3.6) },
      { s: 'M55 71L65 71' },
      { s: 'M54 71Q62 74 68 68' },
      { f: 'M51 68Q60 80 69 68Z', w: 'M54 69.5L66 69.5L65 72L55 72Z' }
    ];
    const glasses = [NONE, C(51, 55, 7) + C(69, 55, 7) + 'M58 55L62 55', 'M43 49H58V61H43ZM62 49H77V61H62ZM58 54H62'];
    const shirts = ['M52 90Q60 97 68 90', 'M50 90L56 101L60 92L64 101L70 90', 'M42 92Q60 105 78 92M56 98L55 109M64 98L65 109', 'M30 104L90 104M25 113L95 113'];
    const accs = [
      {},
      { f: 'M35 44C35 22 47 13 60 13C73 13 85 22 85 44ZM33 40Q33 36 37 36H83Q87 36 87 40V44Q87 48 83 48H37Q33 48 33 44Z' + C(60, 11, 5) },
      { f: 'M36 42C36 24 48 17 60 17C72 17 84 24 84 42ZM60 40L96 42C97 46 84 47 60 45Z' },
      { s: 'M34 54C32 20 88 20 86 54', f: 'M28 46H40V64H28ZM80 46H92V64H80Z' },
      { f: C(80, 26, 4) + C(86, 22, 4) + C(88, 29, 4) + C(83, 34, 4) + C(77, 32, 4), f2: C(82, 28, 3) },
      { f: 'M70 26L80 20L80 32ZM90 20L90 32L80 26Z', f2: C(80, 26, 2.6) }
    ];
    const h = hairs[cfg.hair], e = eyes[cfg.eyes], n = noses[cfg.nose], m = mouths[cfg.mouth], a = accs[cfg.acc];
    return {
      inner: INNER[cfg.bg], skin: SKIN[cfg.skin], hairCol: HAIR[cfg.hairC], shirtCol: CLOTH[cfg.shirtC], accCol: CLOTH[cfg.accC], acc2Col: '#FBE18C',
      head: heads[cfg.head], ears: C(60 - earX, 55, 5) + C(60 + earX, 55, 5),
      hairBack: h.b || NONE, hairFront: h.f || NONE,
      eyesFill: e.fill || NONE, eyesStroke: e.stroke || NONE, eyesWhite: e.white || NONE,
      brows: brows[cfg.brows], noseStroke: n.s || NONE, noseFill: n.f || NONE,
      mouthFill: m.f || NONE, mouthStroke: m.s || NONE, mouthWhite: m.w || NONE, tongue: m.t || NONE,
      blush: cfg.blush ? E(46, 64, 4.5, 2.6) + E(74, 64, 4.5, 2.6) : NONE,
      freckles: cfg.freckles ? C(45, 61, 0.9) + C(48, 63, 0.9) + C(72, 61, 0.9) + C(75, 63, 0.9) : NONE,
      glasses: glasses[cfg.glasses], shirtLines: shirts[cfg.shirt],
      accStroke: a.s || NONE, accFill: a.f || NONE, accFill2: a.f2 || NONE
    };
  }
  /* ---------- class mode (online version: one student, stars) ---------- */
  cp() { return null; }   // memory is a class game now: no stars
  classVals(v) {
    const C = this.cp();
    v.classOn = !!(C && this._classRes);
    v.classLine = this._classRes ? this._classRes.line : '';
    if (!C) return v;
    const size = String(C.RULES.roundSize[this.GAME]);
    if (v.opt1) v.opt1 = v.opt1.filter(o => o.label.indexOf(size) === 0).map(o => ({ ...o, cls: 'p-lav', pressed: 'true' }));
    v.setupNote = C.status(this.GAME).line;
    return v;
  }
  classStart() {
    this._classRes = null; this._wrong = 0; this._hints = 0; this._half = 0;
    const C = this.cp(); if (C) C.start(this.GAME);
  }
  classSize(own) { const C = this.cp(); return C ? C.RULES.roundSize[this.GAME] : own; }
  accuracy() {
    const s = this.state; const pairs = s.deck.length / 2;
    return s.moves ? Math.min(1, pairs / s.moves) : 0;
  }
  renderVals() { const v = this.classVals(this.renderVals0()); v.asideCls = v.players && v.players.length > 3 ? 'many many-t' : ''; return v; }
  renderVals0() {
    const s = this.state;
    const cols = 'ABCDEF';
    const cards = s.deck.map((c, i) => {
      const isUp = s.up.indexOf(i) >= 0;
      const isMatched = s.matched.indexOf(i) >= 0;
      const coord = cols[i % s.cols] + (Math.floor(i / s.cols) + 1);
      return {
        ...c, coord, isMatched, notMatched: !isMatched, px: s.px, qfs: Math.round(60 * s.px / 122),
        turn: (isUp || isMatched) ? 'rotateY(180deg)' : 'rotateY(0deg)',
        label: (isUp || isMatched) ? c.word : ('카드 ' + coord),
        pick: () => this.pick(i)
      };
    });
    const done = s.started && !s.setup && s.matched.length === s.deck.length;
    this.winSound(done);
    const players = this.ROSTER.map((p, i) => ({ ...this.build(p.cfg), name: p.name, score: s.scores[i], streak: 0, streakShow: 'none', rowCls: i === s.turn && !done ? 'puff p-butter' : '' }));
    const cp = this.ROSTER[s.turn];
    const winner = this.winnerOf(s.scores);
    const pv = this.poolVals(6);
    const avail = this.usableWords(6).length;
    const want = Math.min(s.pairsN, avail);
    return {
      ...pv,
      cards, players, msg: s.msg, moves: s.moves, done, winner, cols: s.cols, px: s.px,
      pairsLabel: (s.matched.length / 2) + '/' + (s.deck.length / 2),
      cur: { ...this.build(cp.cfg), name: cp.name, helper: cp.en + ' ist dran · ' + cp.en + "'s turn" },
      restart: () => this.setState({ setup: true, started: false }),
      setup: s.setup, canClose: s.started,
      openSetup: () => this.setState({ setup: true }),
      closeSetup: () => this.setState({ setup: false }),
      startGame: () => this.startGame(),
      opt1Title: '카드 수', opt1Sub: 'Karten · Board size',
      opt1: this.seg([
        { v: 6, label: '6쌍', sub: '12 Karten' },
        { v: 8, label: '8쌍', sub: '16 Karten' },
        { v: 10, label: '10쌍', sub: '20 Karten' },
        { v: 12, label: '12쌍', sub: '24 Karten' }
      ], s.pairsN, 'pairsN'),
      opt2Title: '짝 맞추기', opt2Sub: 'Paare · Pair with',
      opt2: this.seg([
        { v: 'de', label: '한국어 ↔ 독일어', sub: 'Koreanisch ↔ Deutsch' },
        { v: 'en', label: '한국어 ↔ 영어', sub: 'Korean ↔ English' }
      ], s.mode, 'mode'),
      setupNote: want < s.pairsN
        ? ('단어가 ' + avail + '개라서 ' + want + '쌍으로 해요 · Nur ' + want + ' Paare · Only ' + want + ' pairs')
        : ('오늘의 단어에서 ' + want + '개를 무작위로 골라요 · ' + want + ' zufällige Wörter · ' + want + ' random words')
    };
  }
}
