<title>한글 놀이터 · Korean games</title>

<style>
body{margin:0}
a{color:#2B2C6B}a:hover{color:#2B2C6B}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #2B2C6B;outline-offset:5px}
.puff{position:relative;background:linear-gradient(180deg,var(--c) 0%,var(--c) 58%,var(--d) 160%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.38),inset 0 -12px 16px -10px rgba(255,255,255,.6),inset 0 -2px 0 var(--dd),0 0 0 1.5px rgba(255,255,255,.55),0 4px 0 var(--d),0 14px 24px var(--sh),0 2px 4px rgba(43,44,107,.08)}
.puff::before{content:"";position:absolute;left:5px;right:5px;top:4px;height:47%;border-radius:inherit;background:radial-gradient(circle at 86% 32%,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 2.5px,rgba(255,255,255,0) 4.5px),linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.2) 65%,rgba(255,255,255,.04) 100%);pointer-events:none}
.puff::after{content:"";position:absolute;inset:2px;border-radius:inherit;border:3px solid transparent;border-top-color:rgba(255,255,255,.9);border-left-color:rgba(255,255,255,.35);filter:blur(1px);pointer-events:none}
.flat::before{display:none}
.p-white{--c:#FBFAFF;--d:#E7E3F6;--dd:rgba(120,110,180,.18);--sh:rgba(120,110,180,.24)}
.p-lav{--c:#BBA8F6;--d:#9E88E9;--dd:rgba(100,70,200,.30);--sh:rgba(140,110,230,.38)}
.p-coral{--c:#EE7466;--d:#D85B4E;--dd:rgba(160,40,30,.30);--sh:rgba(238,116,102,.42)}
.p-mint{--c:#A6E5C9;--d:#84D2B0;--dd:rgba(30,140,100,.25);--sh:rgba(110,200,160,.38)}
.p-butter{--c:#FBE18C;--d:#F1CD62;--dd:rgba(170,120,0,.22);--sh:rgba(230,190,70,.40)}
.p-blue{--c:#A9CBF7;--d:#86B1EC;--dd:rgba(40,90,180,.25);--sh:rgba(110,160,230,.38)}
.p-pink{--c:#F7B6CF;--d:#EC95B6;--dd:rgba(180,50,100,.22);--sh:rgba(240,150,190,.38)}
.p-ghost{--c:rgba(255,255,255,0);--d:rgba(255,255,255,0);--dd:rgba(0,0,0,0);--sh:rgba(0,0,0,0);box-shadow:none}
.p-ghost::before,.p-ghost::after{display:none}
.frost{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.32) 100%);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -12px 18px -12px rgba(255,255,255,.7),0 12px 30px rgba(70,50,150,.16),0 2px 4px rgba(43,44,107,.06)}
.frost-strong{background:linear-gradient(180deg,#FBF9FF 0%,#F1EDFB 100%)}
.blob{position:absolute;border-radius:50%;opacity:.88;-webkit-mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);will-change:transform;animation:morph 14s ease-in-out infinite}
.blob2{animation-delay:-6s;animation-duration:17s}
.blob3{animation-delay:-11s;animation-duration:20s}
@keyframes morph{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}25%{transform:translate(180px,-90px) scale(1.2) rotate(20deg)}50%{transform:translate(60px,110px) scale(.9) rotate(-10deg)}75%{transform:translate(-160px,40px) scale(1.12) rotate(12deg)}}
.still .blob{animation:none}
.ico{filter:drop-shadow(0 1.5px 0 rgba(255,255,255,.75)) drop-shadow(0 3px 3px rgba(43,44,107,.28))}
.tile{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tile:hover{transform:translateY(-10px) rotate(-1deg)}
.tile:active{transform:translateY(6px) scale(.98)}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.press:hover{transform:translateY(-3px) scale(1.04)}
.press:active{transform:translateY(3px) scale(.96)}
.float{animation:float 3.4s ease-in-out infinite}
.float2{animation:float 3.4s ease-in-out -1.7s infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
.jig-a{animation:jigA .6s cubic-bezier(.3,1.6,.5,1)}
.jig-b{animation:jigB .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jigA{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-12deg)}60%{transform:translateY(2px) rotate(8deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes jigB{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(12deg)}60%{transform:translateY(2px) rotate(-8deg)}100%{transform:translateY(0) rotate(0)}}
.off{opacity:.45;pointer-events:none}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.sw{width:44px;height:44px;border-radius:50%;border:none;padding:0;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 8px -4px rgba(0,0,0,.18),0 0 0 2px #FFFFFF,0 4px 10px rgba(43,44,107,.18)}
.sw-on{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 8px -4px rgba(0,0,0,.18),0 0 0 3px #FFFFFF,0 0 0 6px #7E68E0,0 4px 10px rgba(43,44,107,.18)}
.range{width:100%;accent-color:#7E68E0;height:28px}
input::placeholder{color:#8486B5}
@media (prefers-reduced-motion: reduce){.blob,.float,.float2,.pop{animation:none}.tile,.press{transition:none}}
/*SA-THEME*/
/* ==========================================================================
   한글 놀이터 — "문방구 Sticker Arcade" theme
   Loaded after each page's own styles; restyles the shared building blocks
   (.puff tiles/buttons, .frost panels, blobs, fonts) without touching markup.
   ========================================================================== */
:root{
  --ink:#16131F; --paper:#FFFFFF; --mist:#F4F2EC; --violet:#6A47F2; --violet-d:#4C2BD6; --violet-l:#B9A8FF;
  --red:#EC4027; --lime:#4CC46A; --sun:#FFDD3C; --sky:#4FB8FF; --gum:#F05AB4;
  --b:3px solid var(--ink);
}

/* page background: dot grid instead of drifting blobs */
.sa-root{background:var(--mist) !important;color:var(--ink) !important;isolation:isolate}
/* poster decor: big flat shapes, hatching, polka dots, giant outlined type (behind everything) */
.sa-decor{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sa-decor i{position:absolute;display:block}
.sa-decor .d-type{left:-40px;bottom:-150px;font-family:'Jua',sans-serif;font-weight:800;font-size:560px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(22,19,31,.16);letter-spacing:-20px;white-space:nowrap;font-style:normal}
.sa-decor .d-blob{right:-120px;top:-150px;width:560px;height:470px;border-radius:58% 42% 55% 45%/48% 60% 40% 52%;background:repeating-linear-gradient(-45deg,var(--violet) 0 5px,transparent 5px 11px);opacity:.9;transform:rotate(-12deg)}
.sa-decor .d-dots{left:-90px;bottom:-110px;width:430px;height:330px;background:var(--lime) radial-gradient(#FFFFFF 7px,transparent 7.5px) 0 0/34px 34px;transform:rotate(14deg);clip-path:polygon(0 18%,74% 0,100% 64%,30% 100%)}
.sa-decor .d-star{left:20px;top:96px;width:250px;height:250px;background:var(--sun);clip-path:polygon(50% 0,59% 26%,85% 12%,73% 39%,100% 46%,74% 58%,90% 84%,62% 74%,52% 100%,42% 74%,14% 88%,28% 60%,0 50%,27% 40%,12% 14%,40% 25%);transform:rotate(8deg)}
.sa-decor .d-tri{right:300px;bottom:-40px;width:140px;height:180px;background:var(--ink);clip-path:polygon(0 0,100% 60%,20% 100%)}
.blob{display:none !important}

/* fonts: display text heavy, never faux-bold */
[style*="'Jua'"]{font-weight:800 !important;letter-spacing:-.2px}
h1,h2{font-weight:800 !important}

/* sticker surfaces */
.puff{background:var(--c) !important;border:var(--b) !important;box-shadow:0 4px 0 var(--ink) !important;box-sizing:border-box}
.puff::before,.puff::after{display:none !important}
.puff .puff{box-shadow:0 2px 0 var(--ink) !important;border-width:2.5px !important}
.p-white{--c:var(--paper)}
.p-lav{--c:var(--violet-l)}
.p-coral{--c:var(--red);color:#FFFFFF}
.p-mint{--c:var(--lime)}
.p-butter{--c:var(--sun)}
.p-blue{--c:var(--sky)}
.p-pink{--c:var(--gum)}
.p-holo{--c:var(--lime)}
.p-ghost,.p-ghost.puff{--c:transparent;border-color:transparent !important;box-shadow:none !important}
.flat{box-shadow:none !important}
.frost,.frost-strong{background:var(--paper) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border:var(--b) !important;box-shadow:0 6px 0 var(--ink) !important;box-sizing:border-box}
.frost .frost{box-shadow:0 3px 0 var(--ink) !important}
.ico{filter:none !important}
.sw{box-shadow:0 0 0 3px var(--ink) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:var(--b) !important;box-shadow:inset 0 3px 0 rgba(28,24,56,.08) !important;background:#FFFFFF !important}

/* white text sits on colour: give it an ink outline so it stays readable */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink) !important}
.p-coral{text-shadow:none}
.p-coral > span,.p-coral{-webkit-text-stroke:0}

/* gradient-clipped "glossy" display words become solid ink */
[style*="background-clip: text"]{-webkit-text-fill-color:currentColor}

/* motion: quick, tactile, no hover floating */
.tile{transition:transform .14s cubic-bezier(.3,1.6,.6,1),box-shadow .14s !important}
.tile:hover{transform:translateY(-4px) rotate(-.5deg) !important;box-shadow:0 8px 0 var(--ink) !important}
.tile:active{transform:translateY(4px) !important;box-shadow:0 0 0 var(--ink) !important}
.press{transition:transform .1s cubic-bezier(.3,1.6,.6,1),box-shadow .1s !important}
.press:hover{transform:translateY(-2px) !important}
.press:active{transform:translateY(3px) !important;box-shadow:0 1px 0 var(--ink) !important}
.float,.float2{animation:none !important}

/* focus ring */
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--violet) !important;outline-offset:3px}

/* ---------- hub (menu) ---------- */
.sa-onv{color:var(--ink)}
.sa-onv-sub{color:var(--ink);opacity:.65}
.sa-violet h1{color:#FFFFFF;text-shadow:3px 3px 0 var(--ink)}
.sa-violet h1 + * , .sa-violet .sa-sub-on{color:#FFFFFF}
.sa-nolja{font-family:'Jua',sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--red);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink);transform:rotate(-4deg);letter-spacing:-3px;flex-shrink:0;margin-left:-6px}
.sa-nolja-sm{font-size:118px;-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px 0 var(--ink)}
.sa-tag{height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:var(--b);border-radius:6px;background:var(--ink);color:#FFFFFF;font-weight:800;font-size:17px}
.sa-tag[style*="background"]{color:var(--ink)}
.sa-tag b{font-family:'Jua',sans-serif;font-size:19px}
.sa-me{position:relative;width:330px;height:190px;flex-shrink:0;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:18px;padding:0 22px;box-sizing:border-box}
.sa-me > div:first-child > span{background-color:var(--sky) !important}
.sa-rank{position:absolute;right:-14px;top:-20px;width:80px;height:80px;border:var(--b);border-radius:50%;background:var(--lime);place-items:center;transform:rotate(10deg);box-shadow:0 4px 0 var(--ink);font-family:'Jua',sans-serif;font-size:28px}
.sa-edit{position:absolute;right:-4px;bottom:-2px;z-index:3;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.sa-games{flex:1;min-height:0;display:grid;gap:22px;padding-bottom:8px}
.sa-card{position:relative;display:flex;flex-direction:column;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);overflow:hidden;text-decoration:none;color:var(--ink)}
.sa-art{position:relative;flex:1;min-height:0;border-bottom:var(--b);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sa-art-in{position:relative;width:240px;height:186px;flex-shrink:0}
.sa-foot{height:92px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;box-sizing:border-box}
.sa-gname{font-family:'Jua',sans-serif;font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.sa-gsub{font-weight:650;font-size:15px;opacity:.6;margin-top:6px;white-space:nowrap}
.sa-play{margin-left:auto;width:54px;height:54px;flex-shrink:0;border:var(--b);border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.sa-play svg{margin-left:3px}
.sa-pips{position:absolute;right:12px;top:12px;gap:3px;background:var(--paper);border:var(--b);border-radius:10px;padding:4px 7px}
.sa-t{position:absolute;display:grid;place-items:center;border:var(--b);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-family:'Jua',sans-serif;font-weight:800;color:var(--ink);box-sizing:border-box}
.sa-o{position:absolute;height:34px;border:var(--b);border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;box-sizing:border-box}
.sa-o i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:12px}
.sa-ow{position:absolute;font-family:'Jua',sans-serif;font-weight:800;font-size:32px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
/* class mode: 3 x 2 smaller cards */
.sa-games[style*="repeat(3"] .sa-foot{height:70px}
.sa-games[style*="repeat(3"] .sa-gname{font-size:25px}
.sa-games[style*="repeat(3"] .sa-gsub{font-size:13px;margin-top:4px}
.sa-games[style*="repeat(3"] .sa-play{width:46px;height:46px}
.sa-games[style*="repeat(3"] .sa-art-in{transform:scale(.55)}

/* welcome screen */
.sa-welcome{background:var(--mist) !important}
.sa-welcome h1{font-size:64px !important}

/* ---------- games ---------- */
.sa-prompt{position:relative;border:var(--b);border-radius:24px;box-shadow:0 7px 0 var(--ink);background:var(--violet) repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 12px)}
.sa-ask{font-family:'Jua',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF}
.sa-bigword{color:#FFFFFF;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);letter-spacing:1px}
.sa-key{width:58px;height:58px;flex-shrink:0;border-radius:12px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-family:'Jua',sans-serif;font-weight:800;font-size:28px;position:relative;z-index:1}
.dim{opacity:1 !important;--c:#E9E7EF !important;color:rgba(22,19,31,.42) !important;box-shadow:0 2px 0 rgba(22,19,31,.35) !important;border-color:rgba(22,19,31,.35) !important}
.dim .sa-key{background:rgba(22,19,31,.35)}
.dim *{color:inherit !important}

/* calmer decor on game pages: the menu keeps the full poster */
.sa-root:not(.sa-hub) .sa-decor .d-dots,.sa-root:not(.sa-hub) .sa-decor .d-tri{display:none}
.sa-root:not(.sa-hub) .sa-decor .d-star{left:auto;right:-60px;top:auto;bottom:-70px;width:220px;height:220px}

/* ==========================================================================
   v2 — no outlines on controls (client feedback):
   colour blocks: flat fill + a darker base in their own colour (press-down affordance)
   white surfaces: hairline + soft shadow on a slightly deeper paper background
   white strips attached to colour cards: solid ink with white text
   ink lines stay only on stickers (game art tiles), big outlined type, avatars, "selected"
   ========================================================================== */
:root{--mist:#ECE8DE; --paper-d:#D5CEBE; --hair:inset 0 0 0 1.5px rgba(22,19,31,.13); --soft:0 10px 22px -12px rgba(22,19,31,.32)}
.p-white{--d:var(--paper-d)} .p-lav{--d:#8E78E8} .p-coral{--d:#B52A16} .p-mint{--d:#2F9A4C}
.p-butter{--d:#D9B315} .p-blue{--d:#2A8DD6} .p-pink{--d:#C23A8C} .p-holo{--d:#2F9A4C}
.puff{border:0 !important;box-shadow:0 5px 0 var(--d) !important}
.puff.p-white{box-shadow:var(--hair),0 5px 0 var(--paper-d),var(--soft) !important}
.puff .puff{box-shadow:none !important;border:0 !important}
.puff .puff.p-white{box-shadow:var(--hair) !important}
.frost,.frost-strong{border:0 !important;box-shadow:var(--hair),var(--soft) !important}
.frost .frost{box-shadow:var(--hair) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:0 !important;box-shadow:inset 0 0 0 2px rgba(22,19,31,.15),inset 0 3px 0 rgba(22,19,31,.05) !important}
input:focus{box-shadow:inset 0 0 0 3px var(--violet) !important;outline:none !important}
.tile:hover{box-shadow:0 9px 0 var(--d) !important}
.tile:active{box-shadow:0 0 0 var(--d) !important}
.press:active{box-shadow:0 0 0 var(--d) !important}
.puff.p-white.press:active,.puff.p-white.tile:active{box-shadow:var(--hair) !important}
/* selected / on states keep a ring so "chosen" is unmistakable */
[aria-pressed="true"].puff{box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 var(--d) !important}
.puff.dim,.puff.p-white.dim,.dim{box-shadow:none !important;border:0 !important;--c:#E2DED4 !important}
.sw{box-shadow:var(--hair) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
/* white text on colour: lighter treatment now that blocks have no ink edge */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(22,19,31,.35) !important}
/* quiz + prompt panels */
.sa-prompt{border:0;box-shadow:0 7px 0 var(--violet-d)}
/* hub */
.sa-card{border:0;box-shadow:0 8px 0 var(--d,#000);background:var(--ink)}
.sa-card:hover{box-shadow:0 12px 0 var(--d,#000) !important}
.sa-card:active{box-shadow:0 0 0 var(--d,#000) !important}
.sa-art{border-bottom:0}
.sa-foot{background:var(--ink);color:#FFFFFF}
.sa-gsub{color:#FFFFFF;opacity:.62}
.sa-play{border:0;box-shadow:0 4px 0 #B52A16}
.sa-pips{border:0;background:var(--ink)}
.sa-pipt{font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:#FFFFFF;white-space:nowrap;line-height:18px}
.sa-me{border:0;box-shadow:var(--hair),0 6px 0 var(--paper-d),var(--soft)}
.sa-rank{border:0;box-shadow:0 4px 0 #2F9A4C}
.sa-edit{border:0;box-shadow:0 3px 0 #D9B315}
.sa-tag{border:0}
.sa-tag[style*="background"]{box-shadow:none}
/* white things sitting on white panels (crossword squares, empty syllable slots, list rows) get a paper tint */
.frost .puff.p-white{--c:#F2EFE7}
.frost .puff.p-white[aria-pressed="true"]{--c:var(--paper)}
/* empty syllable slots: dashed ink outline so kids can see where tiles go */
.slot-empty{background:#F2EFE7 !important;box-shadow:inset 0 0 0 2.5px rgba(22,19,31,.35) !important;border:2.5px dashed rgba(22,19,31,.0) !important;outline:2.5px dashed rgba(22,19,31,.45);outline-offset:-6px}

/*R2-PATCH*/
/* P1-1 letterbox matches the paper */
html,body{background:#ECE8DE !important}
/* P1-2 retire old navy/lavender-grey text + icon strokes */
[style*="color: #2B2C6B"],[style*="color:#2B2C6B"]{color:var(--ink) !important}
[style*="color: #4A4C80"],[style*="color:#4A4C80"],[style*="color: #8486B5"]{color:rgba(22,19,31,.62) !important}
svg[stroke="#2B2C6B"]{stroke:var(--ink)} svg[fill="#2B2C6B"]{fill:var(--ink)}
/* P1-2b remaining legacy tints */
[style*="color: #6A4A00"],[style*="color: #5B5DA8"],[style*="color: #3A3B78"],[style*="color: #2E4F45"],[style*="color: #5A4A12"],[style*="color: #5A5C8E"],[style*="color: #3A3C78"],[style*="color: #3A2E7A"],[style*="color: #1F4A3A"],[style*="color: #7E68E0"]{color:rgba(22,19,31,.72) !important}
[style*="color: #B23A2E"],[style*="color: #E2685A"]{color:var(--red) !important}
[style*="color: #2E7A57"]{color:#1F7A3D !important}
a,a:hover{color:var(--ink) !important}
input::placeholder{color:rgba(22,19,31,.42) !important}
/* P1-3 icon "coins" inside controls: drop the nested circle, keep the bare icon */
.frost > .puff[aria-hidden="true"][style*="border-radius: 50%"],
.puff > .puff[aria-hidden="true"][style*="border-radius: 50%"]{background:transparent !important;box-shadow:none !important;width:28px !important}
/* P1-4 pastel lavender -> saturated mid-violet (ink text 6.2:1) */
:root{--violet-l:#9C84FF}
.p-lav{--c:#9C84FF;--d:#7556F0}
/* P1-5 selected = solid violet + white text (one meaning, everywhere) */
[aria-pressed="true"].puff{--c:var(--violet) !important;--d:var(--violet-d) !important;color:#fff !important;box-shadow:0 5px 0 var(--violet-d) !important}
[aria-pressed="true"].puff [style*="color"],[aria-pressed="true"].puff span,[aria-pressed="true"].puff div{color:#fff !important}
[aria-pressed="true"].puff .puff,[aria-pressed="true"].puff .puff *{color:var(--ink) !important}
[aria-pressed="true"].puff > svg,[aria-pressed="true"].puff > svg *{stroke:#fff !important}
/* P1-6 overlay scrim: neutral ink, not navy-lavender */
[style*="background: rgba(43,44,107"]{background:rgba(22,19,31,.55) !important}
/* P1-7 text on red is white; text on sky/green is ink */
.p-coral,.p-coral [style*="color"]{color:#fff !important}
.p-blue [style*="color: #FFFFFF"],.p-mint [style*="color: #FFFFFF"],.p-blue[style*="color: #FFFFFF"],.p-mint[style*="color: #FFFFFF"]{color:var(--ink) !important;text-shadow:none !important}
/* P1-8 no sticky hover on touch */
@media (hover:none){.tile:hover,.press:hover,.sa-card:hover{transform:none !important}.tile:hover{box-shadow:0 5px 0 var(--d) !important}}
/* P1-9 decor type: quieter, menu only */
.sa-decor .d-type{-webkit-text-stroke-color:rgba(22,19,31,.07)}
.sa-root:not(.sa-hub) .sa-decor .d-type{display:none}
/* P1-10 result title: poster type, not gold gloss */
span[style*="background-clip: text"][style*="#FFF8D9"]{display:none !important}
span[style*="color: #F1CD62"]{color:var(--red) !important;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink) !important}
/*/R2-PATCH*/

/*/SA-THEME*/
</style>

<body>
<template id="dc-view">
<div class="sa-root sa-hub {{rootCls}}" style="position: relative; isolation: isolate; width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 84px 50px; background: #E4DCF4; color: #2B2C6B; font-family: 'Nunito', 'Jua', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
  <div class="sa-decor" aria-hidden="true"><i class="d-type">한글</i><i class="d-blob"></i><i class="d-dots"></i><i class="d-star"></i><i class="d-tri"></i></div>

    <span class="blob blob2" style="left: 620px; top: -160px; width: 600px; height: 440px; background: #FFA797"></span>
    <span class="blob blob3" style="left: 260px; top: 330px; width: 640px; height: 420px; background: #8AD9B6"></span>
    <span class="blob" style="left: 900px; top: 380px; width: 480px; height: 400px; background: #FFD46E; animation-delay: -11s"></span>

  <header style="height: 58px; display: flex; align-items: center; justify-content: space-between">

      <span class="puff p-white" aria-hidden="true" style="width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 30px; color: #FF4D3D; transform: rotate(-6deg)">한</span>
      <div>
        <div class="sa-onv" style="font-family: 'Jua', sans-serif; font-size: 30px; line-height: 1">한글 놀이터</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <a href="words.html" onClick="{{tapSound}}" class="frost press" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 20px 0 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2B2C6B">
        <span class="puff p-butter" aria-hidden="true" style="width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B2C6B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="position: relative; z-index: 1"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"></path><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"></path></svg>
        </span>
        <span style="font-family: 'Jua', sans-serif; font-size: 19px; white-space: nowrap">단어장 <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #4A4C80">Wörter</span></span>
      </a>
      <button type="button" class="frost press" onClick="{{toggleSound}}" aria-pressed="{{soundPressed}}" style="height: 56px; border: none; border-radius: 999px; padding: 0 10px 0 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: inherit; color: #2B2C6B" aria-label="효과음 · Ton">
        <span aria-hidden="true" style="font-size: 22px">{{soundIcon}}</span>
        <span class="puff flat {{soundTrack}}" aria-hidden="true" style="position: relative; width: 70px; height: 38px; border-radius: 999px; display: block">
          <span class="puff p-white" style="position: absolute; top: 4px; left: {{soundKnob}}; width: 30px; height: 30px; border-radius: 50%; transition: left .25s cubic-bezier(.3,1.5,.5,1)"></span>
        </span>
      </button>
      <sc-if value="{{roomMode}}" hint-placeholder-val="{{ false }}">
        <a href="teacher.html" class="frost press" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 18px; display: flex; align-items: center; text-decoration: none; color: #2B2C6B; font-family: 'Jua', sans-serif; font-size: 17px">⚙️ 관리</a>
        <button type="button" onClick="{{endRoom}}" class="puff p-coral press" style="height: 56px; border: none; border-radius: 999px; padding: 0 20px; cursor: pointer; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 18px; text-shadow: 0 2px 3px rgba(160,40,30,.35)"><span style="position: relative; z-index: 1">🎓 수업 끝</span></button>
      </sc-if>
      <sc-if value="{{classMode}}" hint-placeholder-val="{{ false }}">
        <a href="board.html" onClick="{{tapSound}}" class="puff p-butter press" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 18px 0 8px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #2B2C6B">
          <span class="puff p-white" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px"><span style="position: relative; z-index: 1">🏆</span></span>
          <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 19px; white-space: nowrap">순위표 <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #5A4A12">{{boardSub}}</span></span>
        </a>
        <button type="button" onClick="{{notMe}}" class="frost press" aria-label="내가 아니에요 · Nicht ich" style="height: 56px; border: none; border-radius: 999px; padding: 0 18px; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #2B2C6B; font-family: 'Jua', sans-serif; font-size: 17px"><span style="white-space: nowrap">↩ 내가 아니에요</span></button>
      </sc-if>
      <button type="button" onClick="{{openSettings}}" class="puff p-lav press" aria-label="설정 · Einstellungen" style="width: 56px; height: 56px; border: none; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #2B2C6B; padding: 0">
        <svg class="ico" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="3.2 3.24"></circle><circle cx="12" cy="12" r="6.6" fill="currentColor"></circle><circle cx="12" cy="12" r="2.4" fill="#BBA8F6"></circle></svg>
      </button>
    </div>
  </header>

  <sc-if value="{{classMode}}" hint-placeholder-val="{{ false }}">
  <div style="height: 214px; flex-shrink: 0; position: relative; display: flex; align-items: center; gap: 30px">
    <div aria-hidden="true" class="sa-nolja">놀자!</div>
    <div style="flex: 1; min-width: 0">
      <h1 class="sa-onv" style="margin: 0; font-family: 'Jua', sans-serif; font-size: 46px; line-height: 1.05">{{whoTitle}}</h1>
      <div class="sa-onv-sub" style="margin-top: 6px; font-size: 16px; font-weight: 600">Hallo {{meName}} · heute {{chapNo}}</div>
      <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap">
        <span class="sa-tag" style="background: var(--lime)"><b>{{chapNo}}</b> {{chapTitle}}</span>
        <span class="sa-tag"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2 6.2 20.4l1.2-6.5L2.6 9.4l6.5-.8z" fill="#FFCE3A" stroke="#1C1838" stroke-width="2.2" stroke-linejoin="round"/></svg> 오늘 {{todayStars}}</span>
        <span class="sa-tag" style="{{timeSty}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1838" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#4FC3FF"></circle><path d="M12 9v4l3 2M9.5 2.5h5"></path></svg> {{timeTag}}</span>
      </div>
    </div>
    <div class="sa-me">
      <div style="position: relative; width: 118px; height: 118px; flex-shrink: 0">
        <span style="position: relative; z-index: 1; width: 112px; height: 112px; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: block; background: {{meAv.inner}}; box-shadow: 0 0 0 3px #1C1838; margin: 3px">
              <svg viewBox="0 4 120 116" width="112" height="112" aria-hidden="true" style="display: block">
                <path d="{{meAv.hairBack}}" fill="{{meAv.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M53 68L53 92L67 92L67 68Z" fill="{{meAv.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{meAv.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{meAv.shirtLines}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="{{meAv.ears}}" fill="{{meAv.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
                <path d="{{meAv.head}}" fill="{{meAv.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{meAv.blush}}" fill="#F49AA8" opacity="0.6"></path>
                <path d="{{meAv.brows}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{meAv.eyesFill}}" fill="#1E1E24"></path>
                <path d="{{meAv.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{meAv.eyesWhite}}" fill="#FFFFFF"></path>
                <path d="{{meAv.noseStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="{{meAv.noseFill}}" fill="#1E1E24"></path>
                <path d="{{meAv.mouthFill}}" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.6" stroke-linejoin="round"></path>
                <path d="{{meAv.mouthWhite}}" fill="#FFFFFF"></path>
                <path d="{{meAv.tongue}}" fill="#F27A8A"></path>
                <path d="{{meAv.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                <path d="{{meAv.hairFront}}" fill="{{meAv.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{meAv.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
                <path d="{{meAv.accStroke}}" fill="none" stroke="#1E1E24" stroke-width="4" stroke-linecap="round"></path>
                <path d="{{meAv.accFill}}" fill="{{meAv.accCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                <path d="{{meAv.accFill2}}" fill="{{meAv.acc2Col}}" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round"></path>
              </svg>
            </span>
        <button type="button" onClick="{{editMe}}" aria-label="꾸미기 · Bearbeiten" class="sa-edit"><svg viewBox="0 0 24 24" width="20" height="20" fill="#1C1838" aria-hidden="true"><path d="M15.2 4.3a2.4 2.4 0 0 1 3.4 0l1.1 1.1a2.4 2.4 0 0 1 0 3.4L9.4 19.1 4 20l.9-5.4Z"></path></svg></button>
      </div>
      <div style="min-width: 0">
        <div style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; white-space: nowrap">{{meName}}</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 10px; font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; font-stretch: 110%"><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2 6.2 20.4l1.2-6.5L2.6 9.4l6.5-.8z" fill="#FFCE3A" stroke="#1C1838" stroke-width="2.2" stroke-linejoin="round"/></svg>{{weekStars}}</div>
        <div style="font-weight: 700; font-size: 14px; opacity: .65; margin-top: 6px; white-space: nowrap">이번 주 · diese Woche</div>
      </div>
      <div class="sa-rank" style="display: {{rankShow}}">{{meRank}}</div>
    </div>
  </div>
  </sc-if>
  <sc-if value="{{notClass}}" hint-placeholder-val="{{ true }}">

          </span>

          <span style="position: relative; z-index: 1; font-size: 13px; font-weight: 900; color: #5A4A12">Mischen</span>

        </div>

            <span class="puff {{p.ring}} {{p.jig}}" style="width: 62px; height: 62px; border-radius: 50%; display: block; opacity: {{p.op}}">
              <span style="position: absolute; inset: 5px; z-index: 1; border-radius: 50%; overflow: hidden; display: block; background: {{p.inner}}">

                  <path d="{{p.hairBack}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="M53 68L53 92L67 92L67 68Z" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="M20 122C22 101 36 89 60 89C84 89 98 101 100 122Z" fill="{{p.shirtCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="{{p.shirtLines}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="{{p.ears}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4"></path>
                  <path d="{{p.head}}" fill="{{p.skin}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="{{p.blush}}" fill="#F49AA8" opacity="0.6"></path>
                  <path d="{{p.freckles}}" fill="#1E1E24" opacity="0.45"></path>
                  <path d="{{p.brows}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                  <path d="{{p.eyesFill}}" fill="#1E1E24"></path>
                  <path d="{{p.eyesStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                  <path d="{{p.eyesWhite}}" fill="#FFFFFF"></path>
                  <path d="{{p.noseStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="{{p.noseFill}}" fill="#1E1E24"></path>
                  <path d="{{p.mouthFill}}" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.6" stroke-linejoin="round"></path>
                  <path d="{{p.mouthWhite}}" fill="#FFFFFF"></path>
                  <path d="{{p.tongue}}" fill="#F27A8A"></path>
                  <path d="{{p.mouthStroke}}" fill="none" stroke="#1E1E24" stroke-width="2.4" stroke-linecap="round"></path>
                  <path d="{{p.hairFront}}" fill="{{p.hairCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="{{p.glasses}}" fill="none" stroke="#1E1E24" stroke-width="2.2" stroke-linejoin="round"></path>
                  <path d="{{p.accStroke}}" fill="none" stroke="#1E1E24" stroke-width="4" stroke-linecap="round"></path>
                  <path d="{{p.accFill}}" fill="{{p.accCol}}" stroke="#1E1E24" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="{{p.accFill2}}" fill="{{p.acc2Col}}" stroke="#1E1E24" stroke-width="2" stroke-linejoin="round"></path>
                </svg>
              </span>
            </span>
            <span aria-hidden="true" style="position: absolute; left: -6px; top: -14px; z-index: 3; font-size: 24px; transform: rotate(-18deg); display: {{p.crown}}; filter: drop-shadow(0 2px 2px rgba(150,100,0,.35))">👑</span>
            <span aria-hidden="true" style="position: absolute; right: -2px; top: -4px; z-index: 2; min-width: 26px; padding: 0 5px; box-sizing: border-box; height: 26px; border-radius: 50%; background: #2E8F63; box-shadow: 0 0 0 2.5px #FFFFFF, 0 2px 4px rgba(30,120,80,.4); display: {{p.badge}}; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 900; color: #FFFFFF; line-height: 1; background: {{p.badgeBg}}">{{p.num}}</span>
            <span style="font-family: 'Jua', sans-serif; font-size: 14px; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span>
          </button>
        </sc-for>
        <sc-if value="{{classMode}}" hint-placeholder-val="{{ false }}">

  /* ---------- sound ---------- */
  audio() {
    try {

  note(f, t, dur, type, peak, f2) {

  /* ---------- studio helpers ---------- */
  setDraft(key, v) { this.setState({ draft: { ...this.state.draft, cfg: { ...this.state.draft.cfg, [key]: v } } }); this.play('tap'); }

  }

  }

    let roster = this.state.roster.slice(); let sel = { ...this.state.sel };
    if (d.id) roster = roster.map(p => p.id === d.id ? { ...p, name, cfg: d.cfg } : p);

    }

  renderVals() {
    this.persist();

    const tapSound = () => this.play('tap');
    const order = s.order.filter(id => s.sel[id] && s.roster.some(p => p.id === id));
    const C = this.C;
    const wkRows = C ? C.board() : [];
    const players = s.roster.map(p => {
      const selected = !!s.sel[p.id];
      const wr = wkRows.find(r => r.student.id === p.id);
      const classBits = C ? {
        badge: 'flex', num: '★' + (wr ? wr.stars : 0), badgeBg: selected ? '#2E8F63' : '#8C83C9',
        crown: C.hasCrown(p.id) ? 'block' : 'none',
        toggle: () => { C.setMe(p.id); this.syncClass(); this.setState({ nudge: false }); this.play('select'); }
      } : { badgeBg: '#2E8F63', crown: 'none' };
      return {
        ...this.build(p.cfg), name: p.name,
        ring: selected ? 'p-mint' : 'p-white', op: selected ? '1' : '0.7', badge: selected ? 'flex' : 'none',
        num: selected ? order.indexOf(p.id) + 1 : '',
        jig: selected && s.jig ? (s.jig % 2 ? 'jig-a' : 'jig-b') : '',
        pressed: selected ? 'true' : 'false',
        toggle: () => {
          const on = !this.state.sel[p.id];
          const ord = this.state.order.filter(x => x !== p.id);
          if (on) ord.push(p.id);
          this.setState({ sel: { ...this.state.sel, [p.id]: on }, order: ord, jig: 0 }); this.play('select');
        },

          const sel = { ...this.state.sel }; delete sel[p.id];
          this.setState({ roster: this.state.roster.filter(x => x.id !== p.id), sel, order: this.state.order.filter(x => x !== p.id), pendingDelete: null }); this.play('miss');
        },
        ...classBits
      };
    });
    const names = order.map(id => s.roster.find(p => p.id === id).name);
    const selLabel = names.length === 0 ? '이름표를 눌러 골라요'
      : names.length === 1 ? names[0] + ' 혼자 · allein'
      : names.join(' → ') + ' · ' + names.length + '명';

    let classLabel = '';
    if (C) {
      const me = C.me();
      if (!me) classLabel = '내 그림을 눌러요 · Tippe auf dich';
      else {
        const t = C.today(me.id), wr = wkRows.find(r => r.student.id === me.id);
        classLabel = '오늘 ★' + t.stars + ' · ⏱ ' + Math.floor(t.minutes) + '/' + C.RULES.dailyMinutes + '분 · 이번 주 ★' + (wr ? wr.stars : 0) + (wr ? ' (' + wr.rank + '등)' : '');
      }
    }
    let studio = {};
    if (s.overlay === 'studio' && s.draft) {
      const T = (ko, en, vb, key, count) => ({ ko, en, vb, isThumb: true, isSwatch: false, isToggle: false, isNote: false, items: this.thumbs(key, count) });
      const S = (ko, en, key, colors) => s.mono
        ? { ko, en, isThumb: false, isSwatch: false, isToggle: false, isNote: true, items: [] }
        : { ko, en, isThumb: false, isSwatch: true, isToggle: false, isNote: false, items: this.swatches(key, colors) };
      const G = (ko, en, key) => ({ ko, en, isThumb: false, isSwatch: false, isToggle: true, isNote: false, items: this.toggleItems(key) });
      const all = {
        face: [T('얼굴형', 'Gesichtsform', '14 8 92 92', 'head', 3), S('피부색', 'Hautton', 'skin', D.SKIN)],
        eyes: [T('눈', 'Augen', '36 40 48 30', 'eyes', 6), T('눈썹', 'Augenbrauen', '36 34 48 30', 'brows', 4), T('안경', 'Brille', '34 38 52 34', 'glasses', 3)],
        mouth: [T('코', 'Nase', '42 46 36 26', 'nose', 4), T('입', 'Mund', '42 58 36 26', 'mouth', 6), G('볼터치', 'Wangen', 'blush'), G('주근깨', 'Sommersprossen', 'freckles')],
        hair: [T('머리 모양', 'Frisur', '14 4 92 92', 'hair', 9), S('머리 색', 'Haarfarbe', 'hairC', D.HAIR)],
        clothes: [T('옷 모양', 'Oberteil', '14 66 92 56', 'shirt', 4), S('옷 색', 'Farbe', 'shirtC', D.CLOTH)],
        extras: [T('소품', 'Accessoire', '14 0 92 92', 'acc', 6), S('소품 색', 'Farbe', 'accC', D.CLOTH), S('배경 색', 'Hintergrund', 'bg', D.BADGE_HEX)]
      };
      const tabDefs = [
        { id: 'face', ko: '얼굴', en: 'Gesicht' }, { id: 'eyes', ko: '눈', en: 'Augen' }, { id: 'mouth', ko: '코·입', en: 'Nase & Mund' },
        { id: 'hair', ko: '머리', en: 'Haare' }, { id: 'clothes', ko: '옷', en: 'Kleidung' }, { id: 'extras', ko: '소품', en: 'Extras' }
      ];
      studio = {
        d: this.build(s.draft.cfg),
        draftName: s.draft.name,
        studioTitle: s.draft.id ? '이름표 꾸미기' : '새 이름표',
        studioSub: s.draft.id ? 'Figur bearbeiten' : 'Neue Figur',
        tabs: tabDefs.map(t => ({ ...t, cls: t.id === s.tab ? 'p-lav' : 'p-ghost', pressed: t.id === s.tab ? 'true' : 'false', pick: () => { this.setState({ tab: t.id }); this.play('tap'); } })),
        sections: all[s.tab]
      };
    }

    const packDefs = [
      { id: 'glass', ko: '유리 종', en: 'Glasglocken', desc: '맑고 반짝이는 종소리' },
      { id: 'bubble', ko: '뽀글뽀글', en: 'Blubber', desc: '말랑한 방울 소리 · weiche Blubbertöne' },
      { id: 'xylo', ko: '실로폰', en: 'Xylofon', desc: '나무 실로폰 느낌 · warmes Holz' },
      { id: 'retro', ko: '레트로 게임', en: 'Retro 8-bit', desc: '옛날 게임기 소리 · alte Spielkonsole' }
    ];
    const packs = packDefs.map(k => {
      const on = s.pack === k.id;
      return {
        ...k, cls: on ? 'p-lav' : 'p-white', pressed: on ? 'true' : 'false',
        btnCls: on ? 'p-mint' : 'p-coral', btnInk: on ? '#1F4A3A' : '#FFFFFF',
        btnLabel: on ? '✓ 사용 중' : '이걸로',
        tTap: () => this.play('tap', k.id, true), tMatch: () => this.play('match', k.id, true),
        tMiss: () => this.play('miss', k.id, true), tWin: () => this.play('win', k.id, true),
        choose: () => { this.setState({ pack: k.id }); this.play('select', k.id, true); }
      };
    });

    const meNow = C ? C.me() : null;
    const showWelcome = !!C && !meNow;
    const pickList = showWelcome && s.wstep === 'pick' ? C.students().map(p => ({ ...this.build(p.cfg), name: p.name,
      pick: () => { C.setMe(p.id); this.syncClass(); this.setState({ wstep: 'home', nudge: false }); this.play('match'); } })) : [];
    return {
      ...studio, studioMsg: s.studioMsg,
      showWelcome, welcomeHome: s.wstep !== 'pick', welcomePick: s.wstep === 'pick', pickList,
      goStudent: () => { this.setState({ wstep: 'pick' }); this.play('select'); },
      welcomeBack: () => { this.setState({ wstep: 'home' }); this.play('tap'); },
      notMe: () => { if (C) { C.logout(); this.syncClass(); this.setState({ wstep: 'pick', overlay: null }); this.play('tap'); } },
      rootCls: s.motion ? '' : 'still',
      players, selLabel: C ? classLabel : selLabel, tapSound,
      gridCols: C ? '4' : '3',
      ...(() => {   // student hero + per-game star tries
        const me = C && C.me(); if (!me) return { pipsShow: 'none' };
        const t = C.today(me.id), wr = wkRows.find(r => r.student.id === me.id);
        const st = C.settings(), title = st.chapterTitle || '', m = title.match(/^(\d+과)\s*(.*)$/);
        const out = { meAv: this.build(me.cfg), meName: me.name, weekStars: wr ? wr.stars : 0,
          meRank: wr && wr.stars > 0 ? wr.rank + '등' : '', rankShow: wr && wr.stars > 0 ? 'grid' : 'none',
          chapNo: m ? m[1] : title, chapTitle: m ? m[2] : '', todayStars: '★' + t.stars,
          minLeft: Math.max(0, Math.ceil(C.RULES.dailyMinutes - t.minutes)), pipsShow: 'flex' };
        out.timeUp = out.minLeft <= 0;
        out.timeTag = out.timeUp ? '오늘 시간 끝! 이제 연습만 · Heute nur noch Übung' : out.minLeft + '분 남음';
        out.timeSty = out.timeUp ? 'background: #EC4027; color: #FFFFFF' : '';
        ['quiz', 'crossword', 'syllables', 'chosung'].forEach(g => { const used = t.rounds[g] || 0;
          const left = out.timeUp ? 0 : Math.max(0, 3 - used); out['pipt' + g] = left ? '별 ' + left + '번 남음' : '연습'; });
        return out;
      })(),
      classMode: !!C, notClass: !C, nudge: !!s.nudge,
      nudgeText: s.nudge === 'pick' ? '먼저 오늘 온 학생을 골라요 · Zuerst Schüler wählen' : s.nudge === 'race' ? '🎲 보드게임은 수업 때 같이 해요!' : '먼저 내 그림을 눌러요! · Zuerst dich antippen',
      roomMode: !!this.R, canManage: !C && !this.R,
      endRoom: () => { if (this.R) { this.R.teacherLogout(); this.play('tap'); window.location.reload(); } },   // ends class mode AND logs the teacher out
      whoTitle: C ? (meNow ? '안녕, ' + meNow.name + '!' : '나는 누구?') : (this.R ? '오늘 수업에 누가 왔나요?' : '오늘은 누가 할까요?'),
      whoSub: C ? (C.settings().chapterTitle || '') : 'Wer spielt heute?',
      editOp: C && C.me() ? '1' : '0.4',
      editMe: () => {
        const me = C && C.me();
        if (!me) { this.setState({ nudge: true }); this.play('miss'); return; }
        this.setState({ overlay: 'studio', draft: { id: me.id, name: me.name, cfg: { ...me.cfg } }, tab: 'face', studioMsg: '' }); this.play('tap');
      },
      raceLabel: '시작', raceOp: '1',
      boardSub: (() => { if (!C) return 'Rangliste'; const me = C.me(); const r = me && C.board().find(x => x.student.id === me.id); return r && r.stars > 0 ? ('★' + r.stars + ' · ' + r.rank + '등') : 'Rangliste'; })(),
      tileRace: (e) => {
        if (this.R && !order.length) { e.preventDefault(); this.setState({ nudge: 'pick' }); this.play('miss'); clearTimeout(this._nt); this._nt = setTimeout(() => this.setState({ nudge: false }), 2400); return; }
        if (C) { e.preventDefault(); this.setState({ nudge: 'race' }); this.play('miss'); clearTimeout(this._nt); this._nt = setTimeout(() => this.setState({ nudge: false }), 2600); return; }
        this.play('tap');
      },
      tileGo: (e) => {
        if (this.R && !order.length) { e.preventDefault(); this.setState({ nudge: 'pick' }); this.play('miss'); clearTimeout(this._nt); this._nt = setTimeout(() => this.setState({ nudge: false }), 2400); return; }
        if (C && !C.me()) { e.preventDefault(); this.setState({ nudge: true }); this.play('miss'); clearTimeout(this._nt); this._nt = setTimeout(() => this.setState({ nudge: false }), 2200); return; }
        this.play('tap');
      },
      shuffleOff: order.length < 2 ? 'off' : '',
      shuffleOrder: () => {
        const ord = this.state.order.filter(id => this.state.sel[id]);
        if (ord.length < 2) return;
        let next = ord.slice();
        for (let tries = 0; tries < 6 && next.join() === ord.join(); tries++) {
          next = ord.slice();
          for (let i = next.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = next[i]; next[i] = next[j]; next[j] = t; }
        }
        this.setState({ order: next, jig: this.state.jig + 1 }); this.play('match');
      },
      soundIcon: s.sound ? '🔊' : '🔇', soundPressed: s.sound ? 'true' : 'false', soundTrack: s.sound ? 'p-blue' : 'p-white', soundKnob: s.sound ? '36px' : '4px',
      toggleSound: () => { const on = !this.state.sound; this.setState({ sound: on }); if (on) this.play('select', null, true); },
      openSettings: () => { this.setState({ overlay: 'settings', resetAsk: false }); this.play('tap'); },
      openPlayers: () => { this.setState({ overlay: 'players', pendingDelete: null }); this.play('tap'); },
      addPlayer: () => { this.setState({ overlay: 'studio', draft: { id: null, name: '', cfg: this.roll() }, tab: 'face', studioMsg: '' }); this.play('tap'); },
      closeOverlay: () => { this.setState({ overlay: null, draft: null, pendingDelete: null, resetAsk: false, studioMsg: '' }); this.play('tap'); },
      cancelDelete: () => this.setState({ pendingDelete: null }),
      showPlayers: s.overlay === 'players', showStudio: s.overlay === 'studio' && !!s.draft, showSettings: s.overlay === 'settings',
      onName: (e) => this.setState({ draft: { ...this.state.draft, name: e.target.value.slice(0, 10) }, studioMsg: '' }),
      randomize: () => { this.setState({ draft: { ...this.state.draft, cfg: this.roll() } }); this.play('select'); },
      saveDraft: () => this.saveDraft(),
      packs, volume: s.volume,
      onVolume: (e) => this.setState({ volume: Number(e.target.value) }),
      motionPressed: s.motion ? 'true' : 'false', motionTrack: s.motion ? 'p-blue' : 'p-white', motionKnob: s.motion ? '36px' : '4px',
      toggleMotion: () => { this.setState({ motion: !this.state.motion }); this.play('tap'); },
      colorCls: s.mono ? 'p-white' : 'p-lav', monoCls: s.mono ? 'p-lav' : 'p-white',
      colorPressed: s.mono ? 'false' : 'true', monoPressed: s.mono ? 'true' : 'false',
      setColor: () => { this.setState({ mono: false }); this.play('tap'); },
      setMono: () => { this.setState({ mono: true }); this.play('tap'); },
      resetIdle: !s.resetAsk, resetAsk: s.resetAsk,
      askReset: () => { this.setState({ resetAsk: true }); this.play('tap'); },
      cancelReset: () => this.setState({ resetAsk: false }),
      confirmReset: () => { if (this.C) { this.setState({ resetAsk: false }); return; } this.setState({ roster: [], sel: {}, order: [], resetAsk: false }); this.play('miss'); }
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
