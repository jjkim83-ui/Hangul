body{margin:0}
a{color:#2B2C6B}a:hover{color:#2B2C6B}
button:focus-visible,a:focus-visible{outline:4px solid #2B2C6B;outline-offset:5px}
.puff{position:relative;background:linear-gradient(180deg,var(--c) 0%,var(--c) 58%,var(--d) 160%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.38),inset 0 -12px 16px -10px rgba(255,255,255,.6),inset 0 -2px 0 var(--dd),0 0 0 1.5px rgba(255,255,255,.55),0 4px 0 var(--d),0 14px 24px var(--sh),0 2px 4px rgba(43,44,107,.08)}
.puff::before{content:"";position:absolute;left:5px;right:5px;top:4px;height:47%;border-radius:inherit;background:radial-gradient(circle at 86% 32%,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 2.5px,rgba(255,255,255,0) 4.5px),linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.2) 65%,rgba(255,255,255,.04) 100%);pointer-events:none}
.puff::after{content:"";position:absolute;inset:2px;border-radius:inherit;border:3px solid transparent;border-top-color:rgba(255,255,255,.9);border-left-color:rgba(255,255,255,.35);filter:blur(1px);pointer-events:none}
.p-white{--c:#FBFAFF;--d:#E7E3F6;--dd:rgba(120,110,180,.18);--sh:rgba(120,110,180,.24)}
.p-lav{--c:#BBA8F6;--d:#9E88E9;--dd:rgba(100,70,200,.30);--sh:rgba(140,110,230,.38)}
.p-coral{--c:#EE7466;--d:#D85B4E;--dd:rgba(160,40,30,.30);--sh:rgba(238,116,102,.42)}
.p-mint{--c:#A6E5C9;--d:#84D2B0;--dd:rgba(30,140,100,.25);--sh:rgba(110,200,160,.38)}
.p-butter{--c:#FBE18C;--d:#F1CD62;--dd:rgba(170,120,0,.22);--sh:rgba(230,190,70,.40)}
.p-blue{--c:#A9CBF7;--d:#86B1EC;--dd:rgba(40,90,180,.25);--sh:rgba(110,160,230,.38)}
.p-pink{--c:#F7B6CF;--d:#EC95B6;--dd:rgba(180,50,100,.22);--sh:rgba(240,150,190,.38)}
.frost{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.32) 100%);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -12px 18px -12px rgba(255,255,255,.7),0 12px 30px rgba(70,50,150,.16),0 2px 4px rgba(43,44,107,.06)}
.frost-strong{background:linear-gradient(180deg,#FBF9FF 0%,#F1EDFB 100%)}
.blob{position:absolute;border-radius:50%;opacity:.88;-webkit-mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%);will-change:transform;animation:morph 14s ease-in-out infinite}
.blob2{animation-delay:-6s;animation-duration:17s}
.blob3{animation-delay:-11s;animation-duration:20s}
@keyframes morph{0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}25%{transform:translate(180px,-90px) scale(1.2) rotate(20deg)}50%{transform:translate(60px,110px) scale(.9) rotate(-10deg)}75%{transform:translate(-160px,40px) scale(1.12) rotate(12deg)}}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .25s ease}
.press:hover{transform:translateY(-4px) scale(1.02)}
.press:active{transform:translateY(3px) scale(.97)}
.dim{opacity:.5}
.wobble{animation:wobble .45s ease}
.used{opacity:.22;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.used::before,.used::after{display:none}
.slot-empty{background:rgba(255,255,255,.35);box-shadow:inset 0 3px 6px rgba(43,44,107,.14),inset 0 0 0 2px rgba(255,255,255,.85)}
.slot-empty::before,.slot-empty::after{display:none}
@keyframes wobble{0%,100%{translate:0 0}20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:4px 0}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.blob,.pop,.wobble{animation:none}.press{transition:none}}
.kb-caret{display:inline-block;width:3px;height:34px;margin-left:4px;background:#7B6BE0;border-radius:2px;animation:kbBlink 1s steps(1) infinite}@keyframes kbBlink{50%{opacity:0}}
.many-t > :first-child{padding:10px 14px 12px !important;gap:4px !important}.many-t > :first-child > span.puff:first-child{width:66px !important;height:66px !important}.many-t > :first-child > span.puff:first-child svg{width:56px;height:56px}.many-t > :first-child > div{font-size:28px !important}.many-t > :first-child > span.puff:not(:first-child){display:none !important}.many .plist{display:grid !important;grid-template-columns:1fr 1fr;gap:4px !important;overflow:visible !important;flex-shrink:0 !important}.many .plist > div{padding:3px 10px 3px 3px !important;gap:6px !important;border-radius:16px !important;min-width:0}.many .plist > div > span:first-child{width:32px !important;height:32px !important}.many .plist > div > span:first-child svg{width:32px;height:32px}.many .plist > div > span:nth-child(2){font-size:16px !important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.many .plist > div > span:last-child{font-size:20px !important}
.rain-field{position:relative;overflow:hidden}
.rain-field .sky-lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 46px,rgba(79,184,255,.13) 46px 48px);z-index:0}
.drop{position:absolute;z-index:2;transform:translateX(-50%);padding:8px 18px 9px;border-radius:16px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(22,19,31,.10),0 6px 0 #DCD7EC,0 10px 22px rgba(22,19,31,.10);font-family:'Jua',sans-serif;font-weight:800;font-size:32px;line-height:1;color:var(--ink,#16131F);white-space:nowrap;transition:top .1s linear,transform .25s cubic-bezier(.3,1.6,.5,1),opacity .4s ease .12s,background .15s}
.drop.match{background:#EFEAFF;box-shadow:0 0 0 3px var(--violet,#6A47F2),0 6px 0 #C9BDF7}
.drop .typed{color:var(--violet,#6A47F2)}
.drop.hit{background:var(--lime,#4CC46A);color:#FFFFFF;box-shadow:0 6px 0 #2F9A4C;transform:translateX(-50%) scale(1.22);opacity:0}
.drop.land{background:var(--red,#FF2B2B);color:#FFFFFF;box-shadow:0 6px 0 #A80F0F;opacity:.0;transition:opacity .5s ease .35s}
.drop .pts{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);font-size:22px;color:#2F9A4C;white-space:nowrap}
.rain-sky{position:absolute;inset:0;z-index:2;pointer-events:none}
.rain-paused .drop{transition:none}
.rain-ground{position:absolute;left:0;right:0;bottom:0;height:88px;z-index:1;background:var(--lime,#4CC46A);box-shadow:inset 0 2px 0 rgba(22,19,31,.18)}
.rain-ground::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:radial-gradient(circle at 8px 10px,var(--lime,#4CC46A) 7px,transparent 7.5px) 0 0/16px 10px}
.splash{position:absolute;bottom:84px;z-index:1;width:70px;height:18px;margin-left:-35px;border-radius:50%;background:rgba(255,43,43,.35);animation:splash .7s ease-out forwards}
@keyframes splash{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.rain-banner{position:absolute;left:50%;top:42%;z-index:3;transform:translate(-50%,-50%);font-family:'Jua',sans-serif;font-weight:800;font-size:56px;color:var(--ink,#16131F);background:var(--sun,#FFDD3C);border-radius:22px;padding:10px 30px 14px;white-space:nowrap;pointer-events:none}
.rain-entry{position:absolute;left:50%;bottom:13px;z-index:4;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.rain-entry input{width:360px;height:62px;box-sizing:border-box;border:none;border-radius:999px;padding:0 26px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(22,19,31,.12),0 6px 18px rgba(22,19,31,.14);font-family:'Jua',sans-serif;font-weight:800;font-size:30px;color:#16131F;text-align:center}
.rain-entry input:focus{outline:none;box-shadow:0 0 0 3px var(--violet,#6A47F2),0 6px 18px rgba(22,19,31,.14)}
.rain-entry.bad input{animation:wobble .45s ease}
.umb{font-size:26px;line-height:1;transition:opacity .3s,filter .3s}
.umb.off{opacity:.25;filter:grayscale(1)}
.rkb{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;border-radius:30px}
.rkb-row{display:flex;justify-content:center;gap:8px}
.rkb-row button{flex:0 1 112px;min-width:0;height:52px;border:none;border-radius:16px;padding:0;cursor:pointer;color:#2B2C6B;font-family:'Jua',sans-serif;font-size:26px}
.rkb-row button.wide{flex:0 1 176px;font-size:20px}
.rkb-row button.go{flex:3 1 0;max-width:none;color:#FFFFFF;font-size:22px}
.dc-phone .rkb-row button{height:64px;font-size:32px;flex-basis:150px}
.dc-phone .rkb-row button.wide{flex-basis:220px}
.dc-phone .rkb{gap:6px;padding:8px 12px 10px}
.dc-phone .rain-ground{height:76px}
.dc-phone button[aria-label^="잠깐 멈추기"]{width:72px !important;height:72px !important}
.dc-phone .rkb-row button.wide{font-size:22px}
.dc-phone .rain-entry input{width:420px;height:66px;font-size:32px}
.dc-phone .drop{font-size:36px}
/*SA-THEME*/
/* ==========================================================================
   한글 놀이터 — "문방구 Sticker Arcade" theme
   Loaded after each page's own styles; restyles the shared building blocks
   (.puff tiles/buttons, .frost panels, blobs, fonts) without touching markup.
   ========================================================================== */
:root{
  --ink:#16131F; --paper:#FFFFFF; --mist:#F4F2EC; --violet:#6A47F2; --violet-d:#4C2BD6; --violet-l:#B9A8FF;
  --red:#EC4027; --lime:#4CC46A; --sun:#FFDD3C; --sky:#4FB8FF; --gum:#F05AB4;
  --b:3px solid var(--ink);
}

/* page background: dot grid instead of drifting blobs */
.sa-root{background:var(--mist) !important;color:var(--ink) !important;isolation:isolate}
/* poster decor: big flat shapes, hatching, polka dots, giant outlined type (behind everything) */
.sa-decor{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sa-decor i{position:absolute;display:block}
.sa-decor .d-type{left:-40px;bottom:-150px;font-family:'Jua',sans-serif;font-weight:800;font-size:560px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(22,19,31,.16);letter-spacing:-20px;white-space:nowrap;font-style:normal}
.sa-decor .d-blob{right:-120px;top:-150px;width:560px;height:470px;border-radius:58% 42% 55% 45%/48% 60% 40% 52%;background:repeating-linear-gradient(-45deg,var(--violet) 0 5px,transparent 5px 11px);opacity:.9;transform:rotate(-12deg)}
.sa-decor .d-dots{left:-90px;bottom:-110px;width:430px;height:330px;background:var(--lime) radial-gradient(#FFFFFF 7px,transparent 7.5px) 0 0/34px 34px;transform:rotate(14deg);clip-path:polygon(0 18%,74% 0,100% 64%,30% 100%)}
.sa-decor .d-star{left:20px;top:96px;width:250px;height:250px;background:var(--sun);clip-path:polygon(50% 0,59% 26%,85% 12%,73% 39%,100% 46%,74% 58%,90% 84%,62% 74%,52% 100%,42% 74%,14% 88%,28% 60%,0 50%,27% 40%,12% 14%,40% 25%);transform:rotate(8deg)}
.sa-decor .d-tri{right:300px;bottom:-40px;width:140px;height:180px;background:var(--ink);clip-path:polygon(0 0,100% 60%,20% 100%)}
.blob{display:none !important}

/* fonts: display text heavy, never faux-bold */
[style*="'Jua'"]{font-weight:800 !important;letter-spacing:-.2px}
h1,h2{font-weight:800 !important}

/* sticker surfaces */
.puff{background:var(--c) !important;border:var(--b) !important;box-shadow:0 4px 0 var(--ink) !important;box-sizing:border-box}
.puff::before,.puff::after{display:none !important}
.puff .puff{box-shadow:0 2px 0 var(--ink) !important;border-width:2.5px !important}
.p-white{--c:var(--paper)}
.p-lav{--c:var(--violet-l)}
.p-coral{--c:var(--red);color:#FFFFFF}
.p-mint{--c:var(--lime)}
.p-butter{--c:var(--sun)}
.p-blue{--c:var(--sky)}
.p-pink{--c:var(--gum)}
.p-holo{--c:var(--lime)}
.p-ghost,.p-ghost.puff{--c:transparent;border-color:transparent !important;box-shadow:none !important}
.flat{box-shadow:none !important}
.frost,.frost-strong{background:var(--paper) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border:var(--b) !important;box-shadow:0 6px 0 var(--ink) !important;box-sizing:border-box}
.frost .frost{box-shadow:0 3px 0 var(--ink) !important}
.ico{filter:none !important}
.sw{box-shadow:0 0 0 3px var(--ink) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:var(--b) !important;box-shadow:inset 0 3px 0 rgba(28,24,56,.08) !important;background:#FFFFFF !important}

/* white text sits on colour: give it an ink outline so it stays readable */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink) !important}
.p-coral{text-shadow:none}
.p-coral > span,.p-coral{-webkit-text-stroke:0}

/* gradient-clipped "glossy" display words become solid ink */
[style*="background-clip: text"]{-webkit-text-fill-color:currentColor}

/* motion: quick, tactile, no hover floating */
.tile{transition:transform .14s cubic-bezier(.3,1.6,.6,1),box-shadow .14s !important}
.tile:hover{transform:translateY(-4px) rotate(-.5deg) !important;box-shadow:0 8px 0 var(--ink) !important}
.tile:active{transform:translateY(4px) !important;box-shadow:0 0 0 var(--ink) !important}
.press{transition:transform .1s cubic-bezier(.3,1.6,.6,1),box-shadow .1s !important}
.press:hover{transform:translateY(-2px) !important}
.press:active{transform:translateY(3px) !important;box-shadow:0 1px 0 var(--ink) !important}
.float,.float2{animation:none !important}

/* focus ring */
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--violet) !important;outline-offset:3px}

/* ---------- hub (menu) ---------- */
.sa-onv{color:var(--ink)}
.sa-onv-sub{color:var(--ink);opacity:.65}
.sa-violet h1{color:#FFFFFF;text-shadow:3px 3px 0 var(--ink)}
.sa-violet h1 + * , .sa-violet .sa-sub-on{color:#FFFFFF}
.sa-nolja{font-family:'Jua',sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--red);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink);transform:rotate(-4deg);letter-spacing:-3px;flex-shrink:0;margin-left:-6px}
.sa-nolja-sm{font-size:118px;-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px 0 var(--ink)}
.sa-tag{height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border:var(--b);border-radius:6px;background:var(--ink);color:#FFFFFF;font-weight:800;font-size:17px}
.sa-tag[style*="background"]{color:var(--ink)}
.sa-tag b{font-family:'Jua',sans-serif;font-size:19px}
.sa-me{position:relative;width:330px;height:190px;flex-shrink:0;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:18px;padding:0 22px;box-sizing:border-box}
.sa-me > div:first-child > span{background-color:var(--sky) !important}
.sa-rank{position:absolute;right:-14px;top:-20px;width:80px;height:80px;border:var(--b);border-radius:50%;background:var(--lime);place-items:center;transform:rotate(10deg);box-shadow:0 4px 0 var(--ink);font-family:'Jua',sans-serif;font-size:28px}
.sa-edit{position:absolute;right:-4px;bottom:-2px;z-index:3;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--sun);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.sa-games{flex:1;min-height:0;display:grid;gap:22px;padding-bottom:8px}
.sa-card{position:relative;display:flex;flex-direction:column;border:var(--b);border-radius:22px;background:var(--paper);box-shadow:0 7px 0 var(--ink);overflow:hidden;text-decoration:none;color:var(--ink)}
.sa-art{position:relative;flex:1;min-height:0;border-bottom:var(--b);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sa-art-in{position:relative;width:240px;height:186px;flex-shrink:0}
.sa-foot{height:92px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;box-sizing:border-box}
.sa-gname{font-family:'Jua',sans-serif;font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.sa-gsub{font-weight:650;font-size:15px;opacity:.6;margin-top:6px;white-space:nowrap}
.sa-play{margin-left:auto;width:54px;height:54px;flex-shrink:0;border:var(--b);border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.sa-play svg{margin-left:3px}
.sa-pips{position:absolute;right:12px;top:12px;gap:3px;background:var(--paper);border:var(--b);border-radius:10px;padding:4px 7px}
.sa-t{position:absolute;display:grid;place-items:center;border:var(--b);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-family:'Jua',sans-serif;font-weight:800;color:var(--ink);box-sizing:border-box}
.sa-o{position:absolute;height:34px;border:var(--b);border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;box-sizing:border-box}
.sa-o i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:12px}
.sa-ow{position:absolute;font-family:'Jua',sans-serif;font-weight:800;font-size:32px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
/* class mode: 3 x 2 smaller cards */
.sa-games[style*="repeat(3"]:not(.one) .sa-foot{height:70px}
.sa-games[style*="repeat(3"]:not(.one) .sa-gname{font-size:25px}
.sa-games[style*="repeat(3"]:not(.one) .sa-gsub{font-size:13px;margin-top:4px}
.sa-games[style*="repeat(3"]:not(.one) .sa-play{width:46px;height:46px}
.sa-games[style*="repeat(3"]:not(.one) .sa-art-in{transform:scale(.55)}

/* welcome screen */
.sa-welcome{background:var(--mist) !important}
.sa-welcome h1{font-size:64px !important}

/* ---------- games ---------- */
.sa-prompt{position:relative;border:var(--b);border-radius:24px;box-shadow:0 7px 0 var(--ink);background:var(--violet) repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 4px,transparent 4px 12px)}
.sa-ask{font-family:'Jua',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF}
.sa-bigword{color:#FFFFFF;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);letter-spacing:1px}
.sa-key{width:58px;height:58px;flex-shrink:0;border-radius:12px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-family:'Jua',sans-serif;font-weight:800;font-size:28px;position:relative;z-index:1}
.dim{opacity:1 !important;--c:#E9E7EF !important;color:rgba(22,19,31,.42) !important;box-shadow:0 2px 0 rgba(22,19,31,.35) !important;border-color:rgba(22,19,31,.35) !important}
.dim .sa-key{background:rgba(22,19,31,.35)}
.dim *{color:inherit !important}

/* calmer decor on game pages: the menu keeps the full poster */
.sa-root:not(.sa-hub) .sa-decor .d-dots,.sa-root:not(.sa-hub) .sa-decor .d-tri{display:none}
.sa-root:not(.sa-hub) .sa-decor .d-star{left:auto;right:-60px;top:auto;bottom:-70px;width:220px;height:220px}

/* ==========================================================================
   v2 — no outlines on controls (client feedback):
   colour blocks: flat fill + a darker base in their own colour (press-down affordance)
   white surfaces: hairline + soft shadow on a slightly deeper paper background
   white strips attached to colour cards: solid ink with white text
   ink lines stay only on stickers (game art tiles), big outlined type, avatars, "selected"
   ========================================================================== */
:root{--mist:#ECE8DE; --paper-d:#D5CEBE; --hair:inset 0 0 0 1.5px rgba(22,19,31,.13); --soft:0 10px 22px -12px rgba(22,19,31,.32)}
.p-white{--d:var(--paper-d)} .p-lav{--d:#8E78E8} .p-coral{--d:#B52A16} .p-mint{--d:#2F9A4C}
.p-butter{--d:#D9B315} .p-blue{--d:#2A8DD6} .p-pink{--d:#C23A8C} .p-holo{--d:#2F9A4C}
.puff{border:0 !important;box-shadow:0 5px 0 var(--d) !important}
.puff.p-white{box-shadow:var(--hair),0 5px 0 var(--paper-d),var(--soft) !important}
.puff .puff{box-shadow:none !important;border:0 !important}
.puff .puff.p-white{box-shadow:var(--hair) !important}
.frost,.frost-strong{border:0 !important;box-shadow:var(--hair),var(--soft) !important}
.frost .frost{box-shadow:var(--hair) !important}
input[type="text"],input:not([type]),input[type="password"],input[type="tel"]{border:0 !important;box-shadow:inset 0 0 0 2px rgba(22,19,31,.15),inset 0 3px 0 rgba(22,19,31,.05) !important}
input:focus{box-shadow:inset 0 0 0 3px var(--violet) !important;outline:none !important}
.tile:hover{box-shadow:0 9px 0 var(--d) !important}
.tile:active{box-shadow:0 0 0 var(--d) !important}
.press:active{box-shadow:0 0 0 var(--d) !important}
.puff.p-white.press:active,.puff.p-white.tile:active{box-shadow:var(--hair) !important}
/* selected / on states keep a ring so "chosen" is unmistakable */
[aria-pressed="true"].puff{box-shadow:inset 0 0 0 3px var(--ink),0 5px 0 var(--d) !important}
.puff.dim,.puff.p-white.dim,.dim{box-shadow:none !important;border:0 !important;--c:#E2DED4 !important}
.sw{box-shadow:var(--hair) !important}
.sw-on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink) !important}
/* white text on colour: lighter treatment now that blocks have no ink edge */
[style*="color: #FFFFFF"],[style*="color:#FFFFFF"],[style*="color: #fff;"]{-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(22,19,31,.35) !important}
/* quiz + prompt panels */
.sa-prompt{border:0;box-shadow:0 7px 0 var(--violet-d)}
/* hub */
.sa-card{border:0;box-shadow:0 8px 0 var(--d,#000);background:var(--ink)}
.sa-card:hover{box-shadow:0 12px 0 var(--d,#000) !important}
.sa-card:active{box-shadow:0 0 0 var(--d,#000) !important}
.sa-art{border-bottom:0}
.sa-foot{background:var(--ink);color:#FFFFFF}
.sa-gsub{color:#FFFFFF;opacity:.62}
.sa-play{border:0;box-shadow:0 4px 0 #B52A16}
.sa-pips{border:0;background:var(--ink)}
.sa-pipt{font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;color:#FFFFFF;white-space:nowrap;line-height:18px}
.sa-me{border:0;box-shadow:var(--hair),0 6px 0 var(--paper-d),var(--soft)}
.sa-rank{border:0;box-shadow:0 4px 0 #2F9A4C}
.sa-edit{border:0;box-shadow:0 3px 0 #D9B315}
.sa-tag{border:0}
.sa-tag[style*="background"]{box-shadow:none}
/* white things sitting on white panels (crossword squares, empty syllable slots, list rows) get a paper tint */
.frost .puff.p-white{--c:#F2EFE7}
.frost .puff.p-white[aria-pressed="true"]{--c:var(--paper)}
/* empty syllable slots: dashed ink outline so kids can see where tiles go */
.slot-empty{background:#F2EFE7 !important;box-shadow:inset 0 0 0 2.5px rgba(22,19,31,.35) !important;border:2.5px dashed rgba(22,19,31,.0) !important;outline:2.5px dashed rgba(22,19,31,.45);outline-offset:-6px}

/*R2-PATCH*/
/* P1-1 letterbox matches the paper */
html,body{background:#ECE8DE !important}
/* P1-2 retire old navy/lavender-grey text + icon strokes */
[style*="color: #2B2C6B"],[style*="color:#2B2C6B"]{color:var(--ink) !important}
[style*="color: #4A4C80"],[style*="color:#4A4C80"],[style*="color: #8486B5"]{color:rgba(22,19,31,.62) !important}
svg[stroke="#2B2C6B"]{stroke:var(--ink)} svg[fill="#2B2C6B"]{fill:var(--ink)}
/* P1-2b remaining legacy tints */
[style*="color: #6A4A00"],[style*="color: #5B5DA8"],[style*="color: #3A3B78"],[style*="color: #2E4F45"],[style*="color: #5A4A12"],[style*="color: #5A5C8E"],[style*="color: #3A3C78"],[style*="color: #3A2E7A"],[style*="color: #1F4A3A"],[style*="color: #7E68E0"]{color:rgba(22,19,31,.72) !important}
[style*="color: #B23A2E"],[style*="color: #E2685A"]{color:var(--red) !important}
[style*="color: #2E7A57"]{color:#1F7A3D !important}
a,a:hover{color:var(--ink) !important}
input::placeholder{color:rgba(22,19,31,.42) !important}
/* P1-3 icon "coins" inside controls: drop the nested circle, keep the bare icon */
.frost > .puff[aria-hidden="true"][style*="border-radius: 50%"],
.puff > .puff[aria-hidden="true"][style*="border-radius: 50%"]{background:transparent !important;box-shadow:none !important;width:28px !important}
/* P1-4 pastel lavender -> saturated mid-violet (ink text 6.2:1) */
:root{--violet-l:#9C84FF}
.p-lav{--c:#9C84FF;--d:#7556F0}
/* P1-5 selected = solid violet + white text (one meaning, everywhere) */
[aria-pressed="true"].puff{--c:var(--violet) !important;--d:var(--violet-d) !important;color:#fff !important;box-shadow:0 5px 0 var(--violet-d) !important}
[aria-pressed="true"].puff [style*="color"],[aria-pressed="true"].puff span,[aria-pressed="true"].puff div{color:#fff !important}
[aria-pressed="true"].puff .puff,[aria-pressed="true"].puff .puff *{color:var(--ink) !important}
[aria-pressed="true"].puff > svg,[aria-pressed="true"].puff > svg *{stroke:#fff !important}
/* P1-6 overlay scrim: neutral ink, not navy-lavender */
[style*="background: rgba(43,44,107"]{background:rgba(22,19,31,.55) !important}
/* P1-7 text on red is white; text on sky/green is ink */
.p-coral,.p-coral [style*="color"]{color:#fff !important}
.p-blue [style*="color: #FFFFFF"],.p-mint [style*="color: #FFFFFF"],.p-blue[style*="color: #FFFFFF"],.p-mint[style*="color: #FFFFFF"]{color:var(--ink) !important;text-shadow:none !important}
/* P1-8 no sticky hover on touch */
@media (hover:none){.tile:hover,.press:hover,.sa-card:hover{transform:none !important}.tile:hover{box-shadow:0 5px 0 var(--d) !important}}
/* P1-9 decor type: quieter, menu only */
.sa-decor .d-type{-webkit-text-stroke-color:rgba(22,19,31,.07)}
.sa-root:not(.sa-hub) .sa-decor .d-type{display:none}
/* P1-10 result title: poster type, not gold gloss */
span[style*="background-clip: text"][style*="#FFF8D9"]{display:none !important}
span[style*="color: #F1CD62"]{color:var(--red) !important;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink) !important}
/*/R2-PATCH*/
/*PHONE*/
/* ==========================================================================
   Phones (html.dc-phone — set by dc-runtime.js when the short side < 500px).
   The 1280x720 stage renders at ~0.54x there, so this block
   1) lets every page fill the widened stage (runtime matches it to the screen's aspect),
   2) raises small type to >= ~19.5 design px (~10.5px on screen), keeping the order of sizes,
   3) grows tap targets, and re-balances the few layouts that would otherwise overflow.
   Nothing here applies on tablets / desktop.
   ========================================================================== */

/* ---- 1. fill the stage; trim vertical padding a little to give the game more room ---- */
.dc-phone .sa-root{width:100% !important;padding-top:22px !important;padding-bottom:26px !important}

/* ---- 2. type ramp (inline sizes from the page sources) ---- */
.dc-phone [style*="font-size: 11px"]{font-size:19.5px !important}
.dc-phone [style*="font-size: 12px"]{font-size:19.5px !important}
.dc-phone [style*="font-size: 12.5px"]{font-size:19.5px !important}
.dc-phone [style*="font-size: 13px"]{font-size:19.5px !important}
.dc-phone [style*="font-size: 14px"]{font-size:20px !important}
.dc-phone [style*="font-size: 15px"]{font-size:20.5px !important}
.dc-phone [style*="font-size: 16px"]{font-size:21px !important}
.dc-phone [style*="font-size: 17px"]{font-size:21.5px !important}
.dc-phone [style*="font-size: 18px"]{font-size:22px !important}
.dc-phone [style*="font-size: 19px"]{font-size:22.5px !important}
.dc-phone [style*="font-size: 20px"]{font-size:23px !important}
.dc-phone [style*="font-size: 21px"]{font-size:24px !important}
.dc-phone [style*="font-size: 22px"]{font-size:24.5px !important}
/* theme classes */
.dc-phone .sa-gsub{font-size:20px !important}
.dc-phone .sa-pipt{font-size:19.5px;line-height:24px}
.dc-phone .sa-pips{padding:4px 10px}
.dc-phone .sa-tag{font-size:20px;height:44px}
.dc-phone .sa-tag b{font-size:22px}
.dc-phone .many .plist > div > span:nth-child(2){font-size:20px !important}

/* ---- 3. tap targets: small pills grow to >= 50 design px (~27px on screen); small circles to 48-54 ---- */
.dc-phone button[style^="height: 38px"],.dc-phone button[style*="; height: 38px"],.dc-phone a[style^="height: 38px"],.dc-phone a[style*="; height: 38px"]{height:50px !important}
.dc-phone button[style^="height: 40px"],.dc-phone button[style*="; height: 40px"],.dc-phone a[style^="height: 40px"],.dc-phone a[style*="; height: 40px"]{height:52px !important}
.dc-phone button[style^="height: 42px"],.dc-phone button[style*="; height: 42px"],.dc-phone a[style^="height: 42px"],.dc-phone a[style*="; height: 42px"]{height:54px !important}
.dc-phone button[style^="height: 44px"],.dc-phone button[style*="; height: 44px"],.dc-phone a[style^="height: 44px"],.dc-phone a[style*="; height: 44px"]{height:54px !important}
.dc-phone button[style^="height: 46px"],.dc-phone button[style*="; height: 46px"],.dc-phone a[style^="height: 46px"],.dc-phone a[style*="; height: 46px"]{height:56px !important}
.dc-phone button[style*="width: 32px; height: 32px"]{width:48px !important;height:48px !important;min-width:48px}
.dc-phone button[style*="width: 40px; height: 40px"]{width:54px !important;height:54px !important;min-width:54px}
.dc-phone button[style*="width: 42px; height: 42px"]{width:54px !important;height:54px !important;min-width:54px}
.dc-phone .sa-edit{width:54px;height:54px;right:-10px;bottom:-8px}
.dc-phone .sw{width:60px !important;height:60px !important}
.dc-phone .range{height:48px}

/* ---- hub ---- */
.dc-phone .sa-me{width:400px}
.dc-phone .sa-foot{height:96px}
.dc-phone .sa-games[style*="repeat(3"]:not(.one) .sa-foot{height:80px}
.dc-phone .sa-games[style*="repeat(3"]:not(.one) .sa-gname{font-size:27px}
.dc-phone .sa-games[style*="repeat(3"]:not(.one) .sa-gsub{font-size:19.5px !important}

/* settings overlay: use the extra width so the four sound cards fit without clipping */
.dc-phone .frost-strong.pop[style*="width: 1120px; height: 640px"]{width:calc(100% - 100px) !important;max-width:1460px;height:calc(100% - 40px) !important}

/* ---- on-screen Korean keyboard (crossword + chosung): wider, taller keys ---- */
.dc-phone .frost-strong.pop[style*="width: 1000px"]{width:calc(100% - 120px) !important;max-width:1400px;padding:14px 28px 18px !important;gap:10px !important}
.dc-phone button[style*="width: 68px; height: 56px"]{width:98px !important;height:68px !important;font-size:30px !important}
.dc-phone button[style*="width: 96px; height: 56px"]{width:136px !important;height:68px !important}
.dc-phone button[style*="width: 360px; height: 56px"]{width:520px !important;height:64px !important}
.dc-phone button[style*="width: 250px; height: 56px"]{width:330px !important;height:64px !important}

/* ---- memory: cards become wide tickets so the bigger words fit ---- */
.dc-phone [style*="perspective: 1100px"]{width:100%;max-width:980px;grid-template-columns:repeat(4,minmax(0,1fr)) !important}
.dc-phone [style*="perspective: 1100px"]:has(> .card-btn:nth-child(17)){grid-template-columns:repeat(5,minmax(0,1fr)) !important;max-width:1060px}
.dc-phone [style*="perspective: 1100px"]:has(> .card-btn:nth-child(21)){grid-template-columns:repeat(6,minmax(0,1fr)) !important;max-width:1100px}
.dc-phone .card-btn{width:100% !important}
.dc-phone .card-btn [style*="overflow-wrap: break-word"]{padding:0 14px !important;line-height:1.08 !important}
/* ---- word pool ---- */
.dc-phone section.frost[style*="width: 440px"]{width:500px !important}

/* ---- teacher ---- */
.dc-phone button[style*="width: 44px; height: 40px"]{width:56px !important;height:52px !important}
.dc-phone .rowin:not(#t-pin){height:50px !important}

/* ---- crossword: wider clue list + answer panel, aside takes what is left ---- */
.dc-phone div[style*="width: 500px; flex-shrink: 0; display: flex; flex-direction: column; gap: 24px"]{width:560px !important}
.dc-phone .frost[style*="width: 290px; flex-shrink: 0"]{width:450px !important}
.dc-phone .frost[style*="width: 290px; flex-shrink: 0"] > button[style*="height: 50px"]{height:58px !important}
.dc-phone .sa-root:has(#cw-answer) div[style*="font-size: 22px; white-space: nowrap"]{white-space:normal !important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.08}
.dc-phone .sa-root:has(#cw-answer) .frost[style*="grid-auto-rows"]{padding:12px !important}
.dc-phone .cell > span[style*="position: absolute"]{font-size:15px !important;top:1px !important}
/*/PHONE*/

/*MOTION*/
/* punchier red (title, play buttons, red cards) */
:root{--red:#FF2B2B}
.sa-nolja{color:#FF2B2B}
/* background: wobbly blobs + parallax (theme decor layers) */
:root{--px:0;--py:0}
.sa-decor .d-blob{animation:sa-wob 9s ease-in-out infinite;translate:calc(var(--px) * -26px) calc(var(--py) * -18px)}
.sa-decor .d-dots{animation:sa-bob 7s ease-in-out infinite;translate:calc(var(--px) * 18px) calc(var(--py) * 14px)}
.sa-decor .d-star{animation:sa-spin 14s ease-in-out infinite;translate:calc(var(--px) * -12px) calc(var(--py) * -10px)}
.sa-decor .d-tri{animation:sa-bob 6s ease-in-out infinite reverse;translate:calc(var(--px) * 30px) calc(var(--py) * 22px)}
.sa-decor .d-type{animation:sa-drift 18s ease-in-out infinite;translate:calc(var(--px) * 8px) calc(var(--py) * 6px)}
@keyframes sa-wob{
  0%,100%{border-radius:58% 42% 55% 45%/48% 60% 40% 52%;scale:1;rotate:0deg}
  33%{border-radius:44% 56% 40% 60%/58% 42% 58% 42%;scale:1.05;rotate:4deg}
  66%{border-radius:62% 38% 48% 52%/40% 55% 45% 60%;scale:.97;rotate:-3deg}}
@keyframes sa-bob{0%,100%{scale:1;rotate:0deg}50%{scale:1.04;rotate:-3deg}}
@keyframes sa-spin{0%,100%{rotate:0deg;scale:1}50%{rotate:14deg;scale:1.06}}
@keyframes sa-drift{0%,100%{rotate:0deg}50%{rotate:-1.5deg;scale:1.02}}
.dc-still .sa-decor i,.still .sa-decor i{animation:none !important;translate:none !important}
@media (prefers-reduced-motion: reduce){.sa-decor i{animation:none !important;translate:none !important}}
/*/MOTION*/

/*CARDS*/
/* game cards: one colour block, no ink band; name in a deep tone of the card colour */
.sa-card{--t:var(--ink)}
.sa-card[style*="#8E78E8"]{--t:#2B1784;background:var(--violet-l)}
.sa-card[style*="#D9B315"]{--t:#6B4A00;background:var(--sun)}
.sa-card[style*="#2F9A4C"]{--t:#0F5223;background:var(--lime)}
.sa-card[style*="#C23A8C"]{--t:#6E0E47;background:var(--gum)}
.sa-card[style*="#2A8DD6"]{--t:#0A3F73;background:var(--sky)}
.sa-card[style*="#B52A16"]{--t:#6A0505;background:var(--red)}
.sa-foot{background:transparent !important;color:var(--t) !important}
.sa-gname{color:var(--t);font-size:32px;letter-spacing:-.5px}
.sa-gsub{color:var(--t) !important;opacity:.78 !important;font-weight:800}
.sa-play{background:var(--t) !important;box-shadow:0 4px 0 rgba(22,19,31,.28) !important}
.sa-play path{stroke:transparent}
.sa-games[style*="repeat(3"]:not(.one) .sa-gname{font-size:27px}
/*/CARDS*/

/*SIGN*/
/* school sign, top left on every page */
.sa-sign{display:inline-flex;align-items:center;flex-shrink:0;background:var(--red);color:#FFFFFF;font-family:'Jua',sans-serif;font-weight:800;font-size:26px;line-height:1;padding:9px 16px 10px;border-radius:12px;box-shadow:0 4px 0 #A80F0F;transform:rotate(-2.5deg);letter-spacing:-.3px;white-space:nowrap}
.sa-sign.lg{font-size:40px;padding:12px 24px 14px;border-radius:16px;box-shadow:0 6px 0 #A80F0F}
.sa-sign.sm{font-size:16px;padding:5px 9px 6px;border-radius:8px;box-shadow:0 3px 0 #A80F0F;transform:rotate(-2deg)}
.sa-menu{font-family:'Jua',sans-serif;font-size:17px;white-space:nowrap}
.dc-phone .sa-sign.sm{font-size:21px !important}
.dc-phone .sa-menu{font-size:22px}
/*/SIGN*/

/*LAYOUT*/
/* 2026-10 density pass (design review): calmer setup dialog, consistent gaps, readable edges */
/* Korean never breaks inside a word (잘할수록 많 / 이!) */
.sa-root{word-break:keep-all;overflow-wrap:anywhere}

/* ---- setup dialog "게임 준비" (all six games) ---- */
[role=dialog][aria-label^="게임 준비"] > .frost{flex-direction:row !important;flex-wrap:wrap;align-items:center;gap:10px 14px !important}
[role=dialog][aria-label^="게임 준비"] > .frost > div:first-child{display:contents !important}
[role=dialog][aria-label^="게임 준비"] > .frost > div:first-child > div{flex:0 0 auto !important;order:1}
[role=dialog][aria-label^="게임 준비"] > .frost > div:nth-child(2){order:2;flex:1 1 auto}
[role=dialog][aria-label^="게임 준비"] > .frost > div:first-child > a{order:3;margin-left:auto}
[role=dialog][aria-label^="게임 준비"] > .frost > div:last-child{order:4;flex-basis:100%}
[role=dialog][aria-label^="게임 준비"] > .frost > div:last-child:empty{display:none}
/* a row with only one choice is information, not a button */
[role=dialog][aria-label^="게임 준비"] button[aria-pressed]:only-of-type{flex:0 0 auto !important;padding:0 26px !important;background:#FFFFFF !important;box-shadow:0 0 0 1px rgba(22,19,31,.10),0 4px 14px rgba(22,19,31,.08) !important;pointer-events:none;color:var(--ink) !important}
[role=dialog][aria-label^="게임 준비"] button[aria-pressed]:only-of-type::before,[role=dialog][aria-label^="게임 준비"] button[aria-pressed]:only-of-type::after{display:none !important}
[role=dialog][aria-label^="게임 준비"] button[aria-pressed]:only-of-type span{color:var(--ink) !important;text-shadow:none !important}
/* phone: use the wider stage, tighter rhythm, secondary line stays secondary */
.dc-phone [role=dialog][aria-label^="게임 준비"]{width:min(1040px,calc(100% - 120px)) !important;padding:20px 30px 22px !important;gap:12px !important;max-height:calc(100% - 24px);overflow:auto}
.dc-phone [role=dialog][aria-label^="게임 준비"] > div > div[style*="width: 178px"]{width:200px !important}
.dc-phone [role=dialog][aria-label^="게임 준비"] button[aria-pressed]{height:68px !important;white-space:nowrap}
.dc-phone [role=dialog][aria-label^="게임 준비"] button[aria-pressed] > span:last-child{font-size:16px !important;opacity:.75;line-height:1.15}
.dc-phone [role=dialog][aria-label^="게임 준비"] > div:last-child > div:first-child{font-size:17px !important;line-height:1.3 !important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---- hub ---- */
/* shuffle blob: room around its label */
button[aria-label^="순서 섞기"]{width:108px !important;padding:8px 12px !important}
.dc-phone button[aria-label^="순서 섞기"]{width:132px !important;padding:8px 14px !important}
/* student card a little narrower so the three tags stay on one line on laptops/tablets */
.sa-me{width:296px;gap:16px;padding:0 20px}
.sa-tag{padding:0 11px}
/* phone class mode: breathing room between the who-is-here band and the six cards; art clear of the card top */
.dc-phone .sa-games[style*="repeat(3"]:not(.one){margin-top:12px;gap:20px}
.dc-phone .sa-games[style*="repeat(3"]:not(.one) .sa-foot{height:72px}
.dc-phone .sa-games[style*="repeat(3"]:not(.one) .sa-art-in{transform:scale(.48) translateY(10px)}
/* ---- lists that scroll: fade at the bottom edge instead of a hard cut, last row clears the edge ---- */
.frost[style*="width: 290px; flex-shrink: 0"]{-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent);padding-bottom:30px !important}
/* ---- snakes & ladders: the player whose turn it is gets a violet ring on the board ---- */
.piece.on > span:first-child{box-shadow:0 0 0 2.5px #FFFFFF,0 0 0 6px var(--violet) !important}
.frost.scroll,.sa-root:has(input[placeholder^="새 학생"]) .scroll[style*="flex-direction: column"]{-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent);padding-bottom:30px !important}

/* ---- teacher: the 16 lessons as one even 8 x 2 grid ---- */

<body>
<template id="dc-view">
<div class="sa-root" style="position: relative; isolation: isolate; width: 1280px; height: 720px; box-sizing: border-box; padding: 30px 80px 44px; background: #E4DCF4; color: #2B2C6B; font-family: 'Nunito', 'Jua', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px; overflow: hidden">
  <div class="sa-decor" aria-hidden="true"><i class="d-type">한글</i><i class="d-blob"></i><i class="d-dots"></i><i class="d-star"></i><i class="d-tri"></i></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden">
    <span class="blob" style="left: -120px; top: -140px; width: 620px; height: 480px; background: #B49BF6"></span>
    <span class="blob blob2" style="left: 620px; top: -160px; width: 600px; height: 440px; background: #FFA797"></span>
    <span class="blob blob3" style="left: 260px; top: 330px; width: 640px; height: 420px; background: #8AD9B6"></span>
    <span class="blob" style="left: 900px; top: 380px; width: 480px; height: 400px; background: #FFD46E; animation-delay: -11s"></span>
  </div>

  <header style="height: 60px; display: flex; align-items: center; gap: 20px">
    <a href="index.html" class="frost press" style="height: 56px; box-sizing: border-box; border-radius: 999px; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 8px; font-family: 'Jua', sans-serif; font-size: 20px">
      <span class="puff p-lav" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B2C6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative; z-index: 1"><polyline points="14 6 8 12 14 18"></polyline></svg>
      </span>
      <span class="sa-sign sm">키움한글학교</span><span class="sa-menu">메뉴</span></a>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; white-space: nowrap">산성비</div>
      <div style="font-size: 15px; font-weight: 800; color: #4A4C80; margin-top: 4px">Wortregen · Tippspiel</div>
    </div>
    <button type="button" onClick="{{togglePause}}" aria-label="잠깐 멈추기 · Pause" class="frost press" style="width: 56px; height: 56px; flex-shrink: 0; border: none; border-radius: 50%; padding: 0; cursor: pointer; display: {{pauseDisp}}; align-items: center; justify-content: center; color: #2B2C6B">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="{{pauseIcon}}" fill="#2B2C6B"></path></svg>
    </button>
    <div class="frost" aria-label="우산 · Leben" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 18px; display: flex; align-items: center; gap: 6px">
      <sc-for list="{{umbs}}" as="u" hint-placeholder-count="5"><span class="umb {{u.cls}}" aria-hidden="true">☂️</span></sc-for>
    </div>
    <div class="puff p-butter" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #E0A800; box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 2px 3px rgba(30,120,80,.35)"></span>
      <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 20px">{{scoreLabel}}</span>
      <span style="position: relative; z-index: 1; font-size: 14px; font-weight: 800; color: #2E4F45">점 · Punkte</span>
    </div>
    <div class="puff p-mint" style="height: 56px; box-sizing: border-box; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #3FAE7E; box-shadow: inset 0 2px 2px rgba(255,255,255,.6), 0 2px 3px rgba(30,120,80,.35)"></span>
      <span style="position: relative; z-index: 1; font-family: 'Jua', sans-serif; font-size: 20px">{{qLabel}}</span>
      <span style="position: relative; z-index: 1; font-size: 14px; font-weight: 800; color: #2E4F45">Wörter</span>
    </div>
  </header>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px">
    <div class="frost rain-field {{fieldCls}}" style="flex: 1; min-height: 0; border-radius: 36px">
      <div class="sky-lines" aria-hidden="true"></div>
      <div id="rain-drops" class="rain-sky"><sc-for list="{{drops}}" as="d" hint-placeholder-count="3"><span id="{{d.id}}" class="drop {{d.cls}}" style="left: {{d.x}}%; top: calc({{d.p}} * (100% - {{groundH}}px - 52px) - 64px * (1 - {{d.p}}))"><span class="typed">{{d.pre}}</span>{{d.rest}}<sc-if value="{{d.pts}}"><span class="pts">{{d.pts}}</span></sc-if></span></sc-for></div>
      <div id="rain-splash" class="rain-sky"><sc-for list="{{splashes}}" as="p" hint-placeholder-count="1"><span id="{{p.id}}" class="splash" style="left: {{p.x}}%"></span></sc-for></div>
      <div id="rain-banner" class="rain-banner" aria-live="polite" style="display: {{bannerShow}}">{{banner}}</div>
      <div id="rain-ground" class="rain-ground" aria-hidden="true"></div>
      <div id="rain-entry" class="rain-entry {{entryCls}}">
        <label for="rain-in" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">단어 입력 · Wort tippen</label>
        <input id="rain-in" type="text" value="{{guess}}" onChange="{{onGuess}}" onKeyDown="{{onKey}}" inputmode="{{inMode}}" placeholder="여기에 써요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button type="button" onClick="{{submit}}" class="puff p-coral press" style="height: 62px; border: none; border-radius: 999px; padding: 0 24px; cursor: pointer; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 22px; text-shadow: 0 2px 3px rgba(160,40,30,.35)"><span style="position: relative; z-index: 1">확인</span></button>
        <button type="button" onClick="{{toggleKb}}" aria-label="화면 키보드 · Bildschirmtastatur" aria-pressed="{{kbPressed}}" class="puff {{kbBtnCls}} press" style="width: 62px; height: 62px; flex-shrink: 0; border: none; border-radius: 50%; padding: 0; cursor: pointer; font-size: 26px; display: flex; align-items: center; justify-content: center"><span style="position: relative; z-index: 1">⌨️</span></button>
      </div>
    </div>
    <sc-if value="{{kbOn}}" hint-placeholder-val="{{ true }}">
    <div class="frost rkb" role="group" aria-label="한글 키보드 · Tastatur">
      <sc-for list="{{kbRows}}" as="r" hint-placeholder-count="4">
        <div class="rkb-row">
          <sc-for list="{{r.keys}}" as="k" hint-placeholder-count="10">
            <button type="button" onPointerDown="{{k.press}}" aria-label="{{k.aria}}" class="puff {{k.cls}}"><span style="position: relative; z-index: 1">{{k.label}}</span></button>
          </sc-for>
        </div>
      </sc-for>
    </div>
    </sc-if>
  </div>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 6; background: rgba(43,44,107,.3); display: flex; align-items: center; justify-content: center">
      <div class="frost frost-strong pop" style="border-radius: 48px; padding: 36px 52px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <div aria-hidden="true" style="position: relative; font-family: 'Jua', sans-serif; font-size: 112px; line-height: 1">
          <span style="color: #F1CD62; text-shadow: 0 3px 0 #E8B93E, 0 6px 0 #D9A62A, 0 18px 24px rgba(230,190,70,.5)">{{doneTitle}}</span>
          <span style="position: absolute; left: 0; top: 0; background: linear-gradient(175deg, #FFF8D9 0%, #FFE58F 35%, #F6CF55 70%, #EDBD3A 100%); -webkit-background-clip: text; background-clip: text; color: transparent">{{doneTitle}}</span>
        </div>
        <div style="font-family: 'Jua', sans-serif; font-size: 30px">{{winner}}</div>
        <sc-if value="{{classOn}}" hint-placeholder-val="{{ false }}">
          <div class="puff p-butter" style="border-radius: 999px; padding: 10px 24px; font-family: 'Jua', sans-serif; font-size: 24px; color: #6A4A00"><span style="position: relative; z-index: 1">{{classLine}}</span></div>
        </sc-if>
        <div style="font-size: 16px; font-weight: 800; color: #4A4C80">{{finalLine}}</div>
        <button type="button" onClick="{{restart}}" class="puff p-coral press" style="margin-top: 8px; height: 62px; border: none; border-radius: 999px; padding: 0 28px; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 24px; cursor: pointer; text-shadow: 0 2px 3px rgba(160,40,30,.35)"><span style="position: relative; z-index: 1">한 번 더 · Nochmal</span></button>
      </div>
    </div>
  </sc-if>
<sc-if value="{{setup}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; z-index: 5; background: rgba(43,44,107,.34); display: flex; align-items: center; justify-content: center">
      <div class="frost frost-strong pop" role="dialog" aria-label="게임 준비 · Spiel einstellen" style="width: 760px; box-sizing: border-box; border-radius: 46px; padding: 28px 34px 30px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="font-family: 'Jua', sans-serif; font-size: 36px; line-height: 1">게임 준비</div>
          <div style="font-size: 15px; font-weight: 800; color: #4A4C80">Spiel einstellen</div>
        </div>
        <div class="frost" style="border-radius: 30px; padding: 14px 16px 14px 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 12px">
            <div style="flex: 1; line-height: 1.15">
              <div style="font-family: 'Jua', sans-serif; font-size: 21px">생활 단어 <span style="font-family: 'Jua', sans-serif; color: #5B5DA8">{{poolCount}}</span></div>
              <div style="font-size: 13px; font-weight: 800; color: #4A4C80">Alltagswörter</div>
            </div>
            <a href="words.html" class="puff p-white press" style="height: 44px; box-sizing: border-box; border-radius: 999px; padding: 0 18px; display: {{vocabDisp}}; align-items: center; text-decoration: none; font-family: 'Jua', sans-serif; font-size: 17px"><span style="position: relative; z-index: 1">단어장에서 바꾸기 · Ändern</span></a>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{poolChips}}" as="ch" hint-placeholder-count="2">
              <span class="puff {{ch.cls}}" style="border-radius: 999px; padding: 6px 14px; font-family: 'Jua', sans-serif; font-size: 17px"><span style="position: relative; z-index: 1">{{ch.label}}</span></span>
            </sc-for>
          </div>
          <div style="font-size: 13px; font-weight: 800; color: #4A4C80">{{poolNote}}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 178px; flex-shrink: 0; line-height: 1.15">
            <div style="font-family: 'Jua', sans-serif; font-size: 21px">{{opt1Title}}</div>
            <div style="font-size: 13px; font-weight: 800; color: #4A4C80">{{opt1Sub}}</div>
          </div>
          <div style="flex: 1; display: flex; gap: 10px">
            <sc-for list="{{opt1}}" as="o" hint-placeholder-count="4">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" class="puff press {{o.cls}}" style="flex: 1; min-width: 0; height: 58px; border: none; border-radius: 999px; padding: 0 8px; cursor: pointer; color: #2B2C6B; font-family: inherit; line-height: 1.05">
                <span style="position: relative; z-index: 1; display: block; font-family: 'Jua', sans-serif; font-size: 20px">{{o.label}}</span>
                <span style="position: relative; z-index: 1; display: block; font-size: 12px; font-weight: 800; color: #4A4C80">{{o.sub}}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 178px; flex-shrink: 0; line-height: 1.15">
            <div style="font-family: 'Jua', sans-serif; font-size: 21px">{{opt2Title}}</div>
            <div style="font-size: 13px; font-weight: 800; color: #4A4C80">{{opt2Sub}}</div>
          </div>
          <div style="flex: 1; display: flex; gap: 10px">
            <sc-for list="{{opt2}}" as="o" hint-placeholder-count="4">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" class="puff press {{o.cls}}" style="flex: 1; min-width: 0; height: 58px; border: none; border-radius: 999px; padding: 0 8px; cursor: pointer; color: #2B2C6B; font-family: inherit; line-height: 1.05">
                <span style="position: relative; z-index: 1; display: block; font-family: 'Jua', sans-serif; font-size: 20px">{{o.label}}</span>
                <span style="position: relative; z-index: 1; display: block; font-size: 12px; font-weight: 800; color: #4A4C80">{{o.sub}}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 2px">
          <div style="flex: 1; font-size: 14px; font-weight: 800; color: #4A4C80; line-height: 1.4">{{setupNote}}</div>
          <sc-if value="{{canClose}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{closeSetup}}" class="puff p-white press" style="height: 62px; border: none; border-radius: 999px; padding: 0 24px; cursor: pointer; color: #2B2C6B; font-family: 'Jua', sans-serif; font-size: 20px"><span style="position: relative; z-index: 1">계속하기 · Weiter</span></button>
          </sc-if>
          <button type="button" onClick="{{startGame}}" class="puff p-coral press" style="height: 62px; border: none; border-radius: 999px; padding: 0 30px; cursor: pointer; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 23px; text-shadow: 0 2px 3px rgba(160,40,30,.35)"><span style="position: relative; z-index: 1">시작! · Los!</span></button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{pausedOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 6; background: rgba(43,44,107,.3); display: flex; align-items: center; justify-content: center">
      <div class="frost frost-strong pop" role="dialog" aria-label="잠깐 멈춤 · Pause" style="border-radius: 46px; padding: 32px 48px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
        <div style="font-family: 'Jua', sans-serif; font-size: 44px; line-height: 1">잠깐 쉬어요</div>
        <div style="font-size: 16px; font-weight: 800; color: #4A4C80">Pause · Der Regen wartet auf dich</div>
        <button type="button" onClick="{{togglePause}}" class="puff p-coral press" style="height: 62px; border: none; border-radius: 999px; padding: 0 30px; cursor: pointer; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 23px"><span style="position: relative; z-index: 1">계속하기 · Weiter</span></button>
      </div>
    </div>
  </sc-if>
</div>
</template>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.GAME = 'rain';
    this.ROSTER = this.loadPlayers().slice(0, 1);
    const coarse = (() => { try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
    this.state = { pool: null, setup: true, started: false, count: 25, level: 1, kbOn: coarse, ...this.fresh() };
  }
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  refreshPool() {
    this.loadPool()
      .then(pool => { this.setState({ pool }); if (this.onPool) this.onPool(pool); })
      .catch(() => { const pool = this.samplePool('단어장을 못 불러와서 예시 단어를 써요 · Beispielwörter'); this.setState({ pool }); if (this.onPool) this.onPool(pool); });
  }
  seg(list, cur, key) {
    return list.map(o => ({ label: o.label, sub: o.sub, pressed: o.v === cur ? 'true' : 'false', cls: o.v === cur ? 'p-lav' : 'p-white', pick: () => this.setState({ [key]: o.v }) }));
  }
  avData() {
    return {
      SKIN: ['#FFE9DC', '#F9D7BE', '#EEC09A', '#D9A27A', '#B07A52', '#8A5A3A', '#6A4128', '#A6E5C9', '#A9CBF7'],
      HAIR: ['#1E1E24', '#4A3326', '#7B4E2E', '#C99A4E', '#E5C27A', '#B4B4B8', '#E46B5A', '#7E6BD9', '#F05AB4', '#4FB8FF', '#4CC46A', '#FF9F43'],
      CLOTH: ['#BBA8F6', '#EE7466', '#A6E5C9', '#FBE18C', '#A9CBF7', '#F7B6CF', '#FFFFFF', '#5B5DA8', '#EC4027', '#4CC46A', '#16131F', '#FF9F43'],
      BADGE: ['p-lav', 'p-mint', 'p-butter', 'p-blue', 'p-pink', 'p-coral', 'p-butter', 'p-pink', 'p-blue', 'p-lav', 'p-mint', 'p-coral', 'p-blue', 'p-butter'],
      BADGE_HEX: ['#BBA8F6', '#A6E5C9', '#FBE18C', '#A9CBF7', '#F7B6CF', '#EE7466',
        'repeating-linear-gradient(45deg, #FFDD3C 0 7px, #FFF0A6 7px 14px)',
        'radial-gradient(circle, #F05AB4 2.6px, transparent 3.2px) 0 0 / 13px 13px, #FFD9EF',
        'repeating-conic-gradient(from 0deg at 50% 60%, #4FB8FF 0 15deg, #A8DBFF 15deg 30deg)',
        'conic-gradient(#9C84FF 25%, #D4C9FF 0 50%, #9C84FF 0 75%, #D4C9FF 0) 0 0 / 18px 18px',
        'radial-gradient(circle at 50% 120%, #FFDD3C 0 30%, #FF9F43 30% 48%, #EC4027 48% 64%, #6A47F2 64%)',
        'repeating-linear-gradient(0deg, #4CC46A 0 6px, #B9EDC6 6px 12px)',
        'radial-gradient(circle at 30% 30%, #FFFFFF 0 2px, transparent 2.5px) 0 0 / 16px 16px, radial-gradient(circle at 70% 70%, #FFDD3C 0 1.6px, transparent 2px) 0 0 / 22px 22px, #2B2C6B',
        'linear-gradient(180deg, #8FD3FF 0 55%, #4CC46A 55% 72%, #2F9A4C 72%)'],
      INNER: ['#EEE8FF', '#E6F8EF', '#FFF7D6', '#E8F1FF', '#FFEDF4', '#FFE7E3']
    };
  }
  build(cfg) {
    const C = (x, y, r) => 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0Z';

    if (!s.started || s.over || s.setup) return;
    const t = (window.performance ? performance.now() : Date.now());
    if (on && !s.paused) { this._pausedAt = t; this.setState({ paused: true }); }
    else if (!on && s.paused) { this._pausedTotal = (this._pausedTotal || 0) + (t - this._pausedAt); this._pausedAt = 0; this.setState({ paused: false }); this.focusIn(); }
  }
  focusIn() { if (this.state.kbOn) return; const go = () => { const el = document.getElementById('rain-in'); if (el && document.activeElement !== el) try { el.focus({ preventScroll: true }); } catch (e) {} }; setTimeout(go, 60); setTimeout(go, 400); }

  /* ---------- speed: slow start, faster towards the end ---------- */
  keys(w) {   // how many key presses a word needs (a 겹받침 or 겹모음 counts double)
    const JUNG2 = 'ㅘㅙㅚㅝㅞㅟㅢ', JONG2 = { 3: 1, 5: 1, 6: 1, 9: 1, 10: 1, 11: 1, 12: 1, 13: 1, 14: 1, 15: 1, 18: 1 }, JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
    return Array.from(w).reduce((a, ch) => { const n = ch.charCodeAt(0) - 0xAC00; if (n < 0 || n > 11171) return a + 1; const v = JUNG[Math.floor(n % 588 / 28)], j = n % 28;
      return a + 2 + (JUNG2.indexOf(v) >= 0 ? 1 : 0) + (j ? (JONG2[j] ? 2 : 1) : 0); }, 0);
  }
  pace(i, n, w) {
    // [fall ms at start, at end, gap ms at start, at end, extra gap per key, most words in the air]
    const P = { 1: [11500, 8500, 3400, 2600, 160, 3], 2: [10000, 7000, 2800, 2000, 130, 4], 3: [9000, 6000, 2400, 1700, 110, 4] }[this.state.level] || [10000, 7000, 2800, 2000, 130, 4];
    const p = n > 1 ? i / (n - 1) : 0;
    return { dur: Math.round(P[0] + (P[1] - P[0]) * p), gap: Math.round(P[2] + (P[3] - P[2]) * p + P[4] * this.keys(w)), max: P[5] };
  }
  startGame() {
    this.classStart();
    clearInterval(this.loop);
    const n = this.classSize(this.state.count);
    let words = this.shuffle(this.levelWords(this.state.level));
    while (words.length && words.length < n) words = words.concat(this.shuffle(words));
    this._pausedTotal = 0; this._pausedAt = 0; this._id = 0;
    const t0 = this.now();
    this.setState({ ...this.fresh(), queue: words.slice(0, n), total: n, setup: false, started: true, banner: '준비… 시작!', next: t0 + 1400, t0 });
    setTimeout(() => { if (this.state.banner === '준비… 시작!') this.setState({ banner: '' }); }, 1300);
    this.loop = setInterval(() => this.tick(), 100);
    this.focusIn();
  }
  freeX(drops) {
    const used = drops.filter(d => !d.state).map(d => d.x);
    let best = 50, bestGap = -1;
    for (let k = 0; k < 12; k++) {
      const x = 10 + Math.random() * 80;
      const gap = used.length ? Math.min(...used.map(u => Math.abs(u - x))) : 100;
      if (gap > bestGap) { bestGap = gap; best = x; }
      if (gap > 22) break;
    }
    return Math.round(best * 10) / 10;
  }
  tick() {
    const s = this.state;
    if (!s.started || s.over || s.paused || s.setup) return;
    const t = this.now();
    let drops = s.drops, changed = false, lives = s.lives, missed = s.missed, combo = s.combo, results = s.results, splashes = s.splashes, spawned = s.spawned, next = s.next;
    // land
    drops = drops.map(d => {
      if (!d.state && t - d.born >= d.dur) {
        changed = true; lives -= 1; missed += 1; combo = 0; results = results.concat([false]);
        splashes = splashes.concat([{ id: 'sp' + d.id, x: d.x, at: t }]);
        this.sfx('miss');
        return { ...d, state: 'land', at: t };
      }
      return d;
    });
    // clean up finished effects
    const keep = drops.filter(d => !d.state || t - d.at < 900);
    if (keep.length !== drops.length) { drops = keep; changed = true; }
    const sp = splashes.filter(p => t - p.at < 800);
    if (sp.length !== splashes.length) { splashes = sp; changed = true; }
    // spawn
    const inAir = drops.filter(d => !d.state).length;
    const cap = this.pace(spawned, s.queue.length, '').max;
    if (inAir >= cap && t >= next) next = t + 300;   // never pile up: wait until one is caught or lands
    if (lives > 0 && spawned < s.queue.length && t >= next) {
      const w = s.queue[spawned];
      const pc = this.pace(spawned, s.queue.length, w[0]);
      drops = drops.concat([{ id: 'dr' + (++this._id), ko: w[0], de: w[1], x: this.freeX(drops), dur: pc.dur, born: t, state: '' }]);
      spawned += 1; next = t + pc.gap; changed = true;
      // nothing on screen: bring the next one sooner
      if (!drops.some(d => !d.state && d.id !== 'dr' + this._id)) next = Math.min(next, t + 900);
    }
    if (!changed) { this.setState({ clock: t }); return; }   // moves the words
    const active = drops.some(d => !d.state);
    const over = lives <= 0 || (spawned >= s.queue.length && !active);
    if (lives <= 0) results = results.concat(s.queue.slice(spawned).map(() => false)).concat(drops.filter(d => !d.state).map(() => false));
    this.setState({ drops, lives: Math.max(0, lives), missed, combo, results, splashes, spawned, next, over, clock: t });
    if (over) clearInterval(this.loop);
  }
  submit() {
    const s = this.state;
    if (s.setup || !s.started || s.over || s.paused) return;
    const g = (s.guess || '').replace(/\s+/g, '');
    if (!g) return;
    const t = this.now();
    const hits = s.drops.filter(d => !d.state && d.ko === g).sort((a, b) => (t - b.born) / b.dur - (t - a.born) / a.dur);
    if (!hits.length) {
      this.sfx('miss');
      this.setState({ bad: true, combo: 0 });
      setTimeout(() => this.setState({ bad: false }), 450);
      return;
    }
    const h = hits[0], combo = s.combo + 1;
    const pts = h.ko.length * 10 + Math.min(combo - 1, 10) * 5;
    this.sfx(combo >= 3 ? 'match' : 'select');
    const drops = s.drops.map(d => d.id === h.id ? { ...d, state: 'hit', at: t, pts: '+' + pts } : d);
    const active = drops.some(d => !d.state);
    const over = s.spawned >= s.queue.length && !active;
    this.setState({ drops, guess: '', score: s.score + pts, caught: s.caught + 1, combo, best: Math.max(s.best, combo), results: s.results.concat([true]), over,
      banner: combo >= 5 && combo % 5 === 0 ? combo + '연속! 🔥' : s.banner });
    if (combo >= 5 && combo % 5 === 0) setTimeout(() => { if (this.state.banner.indexOf('연속') > 0) this.setState({ banner: '' }); }, 900);
    if (over) clearInterval(this.loop);
  }
  accuracy() { const s = this.state; return s.total ? s.caught / s.total : 0; }
  isPhone() { return document.documentElement.classList.contains('dc-phone'); }
  jamo(str) {   // 우ㅇ -> ㅇㅜㅇ, so a half-typed syllable still matches 우유
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ['', 'ㄱ', 'ㄲ', 'ㄱㅅ', 'ㄴ', 'ㄴㅈ', 'ㄴㅎ', 'ㄷ', 'ㄹ', 'ㄹㄱ', 'ㄹㅁ', 'ㄹㅂ', 'ㄹㅅ', 'ㄹㅌ', 'ㄹㅍ', 'ㄹㅎ', 'ㅁ', 'ㅂ', 'ㅂㅅ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
    const V2 = { 'ㅘ': 'ㅗㅏ', 'ㅙ': 'ㅗㅐ', 'ㅚ': 'ㅗㅣ', 'ㅝ': 'ㅜㅓ', 'ㅞ': 'ㅜㅔ', 'ㅟ': 'ㅜㅣ', 'ㅢ': 'ㅡㅣ' };
    return Array.from(str || '').map(ch => { const n = ch.charCodeAt(0) - 0xAC00; if (n < 0 || n > 11171) return V2[ch] || ch; const v = JUNG[Math.floor(n % 588 / 28)];
      return CHO[Math.floor(n / 588)] + (V2[v] || v) + JONG[n % 28]; }).join('');
  }

  /* ---------- on-screen keyboard (always visible on touch screens) ---------- */
  hgCompose(str, key) {
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
    const VV = { 'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ', 'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ' };
    const CC = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
    const SPLIT = {}; Object.keys(CC).forEach(k => { SPLIT[CC[k]] = [k[0], k[1]]; });
    const mk = (c, v, j) => String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28 + (j ? JONG.indexOf(j) : 0));
    const parts = (ch) => { const n = ch.charCodeAt(0) - 0xAC00; if (n < 0 || n > 11171) return null; return [CHO[Math.floor(n / 588)], JUNG[Math.floor(n % 588 / 28)], n % 28 ? JONG[n % 28] : '']; };
    const last = str.slice(-1), head = str.slice(0, -1), p = last ? parts(last) : null;
    const isV = JUNG.indexOf(key) >= 0;
    if (!isV) {
      if (p && !p[2] && JONG.indexOf(key) > 0) return head + mk(p[0], p[1], key);
      if (p && p[2] && CC[p[2] + key]) return head + mk(p[0], p[1], CC[p[2] + key]);
      return str + key;
    }
    if (last && CHO.indexOf(last) >= 0) return head + mk(last, key, '');
    if (p && !p[2] && VV[p[1] + key]) return head + mk(p[0], VV[p[1] + key], '');
    if (p && p[2]) {
      const sp = SPLIT[p[2]];
      if (sp) return head + mk(p[0], p[1], sp[0]) + mk(sp[1], key, '');
      if (CHO.indexOf(p[2]) >= 0) return head + mk(p[0], p[1], '') + mk(p[2], key, '');
    }
    return str + key;
  }
  hgBack(str) {
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
    const UNV = { 'ㅘ': 'ㅗ', 'ㅙ': 'ㅗ', 'ㅚ': 'ㅗ', 'ㅝ': 'ㅜ', 'ㅞ': 'ㅜ', 'ㅟ': 'ㅜ', 'ㅢ': 'ㅡ' };
    const UNC = { 'ㄳ': 'ㄱ', 'ㄵ': 'ㄴ', 'ㄶ': 'ㄴ', 'ㄺ': 'ㄹ', 'ㄻ': 'ㄹ', 'ㄼ': 'ㄹ', 'ㄽ': 'ㄹ', 'ㄾ': 'ㄹ', 'ㄿ': 'ㄹ', 'ㅀ': 'ㄹ', 'ㅄ': 'ㅂ' };
    const last = str.slice(-1), head = str.slice(0, -1);
    const n = last ? last.charCodeAt(0) - 0xAC00 : -1;
    if (n < 0 || n > 11171) return head;
    const c = CHO[Math.floor(n / 588)], v = JUNG[Math.floor(n % 588 / 28)], j = n % 28 ? JONG[n % 28] : '';
    const mk = (c, v, j) => String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28 + (j ? JONG.indexOf(j) : 0));
    if (j) return head + mk(c, v, UNC[j] || '');
    if (UNV[v]) return head + mk(c, UNV[v], '');
    return head + c;
  }
  kbRows() {
    const s = this.state;
    const base = [['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', 'ㅐ', 'ㅔ'], ['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'], ['ㅋ', 'ㅌ', 'ㅊ', 'ㅍ', 'ㅠ', 'ㅜ', 'ㅡ']];
    const SH = { 'ㅂ': 'ㅃ', 'ㅈ': 'ㅉ', 'ㄷ': 'ㄸ', 'ㄱ': 'ㄲ', 'ㅅ': 'ㅆ', 'ㅐ': 'ㅒ', 'ㅔ': 'ㅖ' };
    const vowel = (k) => 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅛㅜㅠㅡㅣ'.indexOf(k) >= 0;
    const tap = (fn) => (e) => { if (e && e.preventDefault) e.preventDefault(); fn(); };
    const key = (k) => { const ch = s.kbShift && SH[k] ? SH[k] : k; return { label: ch, aria: ch, cls: vowel(ch) ? 'p-butter' : 'p-white',
      press: tap(() => this.setState({ guess: this.hgCompose(this.state.guess || '', ch), kbShift: false })) }; };
    const rows = base.map(r => ({ keys: r.map(key) }));
    rows[2].keys.unshift({ label: '⇧', aria: 'Shift · 쌍자음', cls: (s.kbShift ? 'p-lav' : 'p-white') + ' wide', press: tap(() => this.setState({ kbShift: !this.state.kbShift })) });
    rows[2].keys.push({ label: '⌫', aria: '지우기 · Löschen', cls: 'p-pink wide', press: tap(() => this.setState({ guess: this.hgBack(this.state.guess || '') })) });
    return rows;
  }

  renderVals() {
    const v = this.classVals(this.renderVals0());
    // the pool box in the setup dialog shows the everyday-word set instead of lesson words
    v.vocabDisp = 'none';
    return v;
  }
  renderVals0() {
    const s = this.state;
    const n = s.total || this.classSize(s.count);
    const done = s.started && !s.setup && s.over;
    this.winSound(done);
    const g = (s.guess || '').replace(/\s+/g, '');
    const gj = this.jamo(g);
    const t = this.state.started && !this.state.setup ? (s.clock || this.now()) : 0;
    const drops = s.drops.map(d => {
      const live = !d.state;
      const on = live && gj && this.jamo(d.ko).indexOf(gj) === 0;
      let k = 0; if (on) { const a = Array.from(d.ko), b2 = Array.from(g); while (k < b2.length && a[k] === b2[k]) k++; }
      const pre = on ? Array.from(d.ko).slice(0, k).join('') : '';
      const p = Math.max(0, Math.min(1, ((d.state ? d.at : t) - d.born) / d.dur));
      return { id: d.id, x: d.x, p: p.toFixed(4), pre, rest: d.ko.slice(pre.length), pts: d.state === 'hit' ? d.pts : '', cls: d.state || (on ? 'match' : '') };
    });
    const umbs = [0, 1, 2, 3, 4].map(k => ({ cls: k < s.lives ? '' : 'off' }));
    const me = this.ROSTER[0];
    const lv = (this.state.levels || this.sampleLevels());
    const lvName = (k) => { const x = lv.find(y => y.n === k); return x ? x.name : ''; };
    const total = lv.reduce((a, x) => a + x.words.length, 0);
    return {
      poolCount: total + '개', poolChips: [{ label: '매일 쓰는 말 · Alltag', cls: 'p-mint' }], poolNote: '', poolLabel: lvName(s.level), poolReady: true,
      drops, splashes: s.splashes.map(p => ({ id: p.id, x: p.x })), banner: s.banner, bannerShow: s.banner ? 'block' : 'none',
      groundH: this.isPhone() ? 76 : 88,
      fieldCls: s.paused || s.setup || done ? 'rain-paused' : '', entryCls: s.bad ? 'bad' : '',
      guess: s.guess, inMode: s.kbOn ? 'none' : 'text',
      onGuess: (e) => this.setState({ guess: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter' && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); this.submit(); } },
      submit: () => { this.submit(); this.focusIn(); },
      kbOn: !!s.kbOn, kbRows: s.kbOn ? this.kbRows() : [], kbPressed: s.kbOn ? 'true' : 'false', kbBtnCls: s.kbOn ? 'p-lav' : 'p-white',
      toggleKb: () => { const on = !this.state.kbOn; this.setState({ kbOn: on }); if (!on) setTimeout(() => this.focusIn(), 0); },
      umbs, scoreLabel: String(s.score), qLabel: s.setup || !s.started ? '–' : Math.min(s.spawned, n) + '/' + n,
      pauseDisp: s.started && !done && !s.setup ? 'flex' : 'none', pauseIcon: s.paused ? 'M7 4.5v15l12-7.5z' : 'M6 4h4.5v16H6zM13.5 4H18v16h-4.5z',
      togglePause: () => this.pause(!this.state.paused), pausedOpen: !!s.paused && !done,
      done, doneTitle: s.lives > 0 ? '끝!' : '비가 왔어요!',
      winner: s.score + '점 · ' + s.score + ' Punkte' + (s.best >= 3 ? '  ·  최고 ' + s.best + '연속' : ''),
      finalLine: n + '개 중 ' + s.caught + '개 잡았어요 · ' + s.caught + ' von ' + n + ' gefangen',
      cur: { ...this.build(me.cfg), name: me.name, helper: me.en },
      restart: () => { clearInterval(this.loop); this.setState({ setup: true, started: false, over: false, drops: [], splashes: [] }); },
      setup: s.setup, canClose: s.started && !done,
      openSetup: () => this.pause(true),
      closeSetup: () => this.setState({ setup: false }),
      startGame: () => this.startGame(),
      opt1Title: '단어 수', opt1Sub: 'Wörter',
      opt1: this.seg([
        { v: 20, label: '20개', sub: '20 Wörter' },
        { v: 25, label: '25개', sub: '25 Wörter' },
        { v: 30, label: '30개', sub: '30 Wörter' }
      ], s.count, 'count'),
      opt2Title: '단계', opt2Sub: 'Stufe',
      opt2: this.seg([1, 2, 3].map(k => ({ v: k, label: lvName(k) || ['쉬움', '보통', '어려움'][k - 1], sub: ['Leicht · langsam', 'Mittel', 'Schwer · schnell'][k - 1] })), s.level, 'level'),
      setupNote: '☂️ 우산 5개! 땅에 떨어지기 전에 단어를 써요 · Tippe die Wörter, bevor sie landen'
    };
  }
}
DC.mount(Component);
